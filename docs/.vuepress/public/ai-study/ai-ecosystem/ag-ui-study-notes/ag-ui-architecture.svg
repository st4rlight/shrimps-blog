<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="460" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">AG-UI 架构总览</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#94a3b8">客户端-服务器架构，事件驱动的双向通信</text>

  <!-- ===== Application (Frontend) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="85" width="200" height="130" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="30" y="85" width="200" height="36" rx="12" fill="url(#indigoG)"/>
  <rect x="30" y="105" width="200" height="16" fill="url(#indigoG)"/>
  <text x="130" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="white">Application</text>
  <text x="130" y="142" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">面向用户的应用</text>
  <text x="130" y="162" text-anchor="middle" font-size="10" fill="#64748b">聊天界面 / AI 助手</text>
  <text x="130" y="180" text-anchor="middle" font-size="10" fill="#64748b">渲染流式消息</text>
  <text x="130" y="196" text-anchor="middle" font-size="10" fill="#64748b">处理用户中断/审批</text>

  <!-- Arrow: App ↔ AG-UI Client -->
  <line x1="230" y1="140" x2="268" y2="140" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="268" y1="160" x2="232" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== AG-UI Client ===== -->
  <g filter="url(#shadow)">
    <rect x="270" y="85" width="200" height="130" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="270" y="85" width="200" height="36" rx="12" fill="url(#blueG)"/>
  <rect x="270" y="105" width="200" height="16" fill="url(#blueG)"/>
  <text x="370" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="white">AG-UI Client</text>
  <text x="370" y="142" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">通信客户端</text>
  <text x="370" y="162" text-anchor="middle" font-size="10" fill="#64748b">HttpAgent / WebSocket</text>
  <text x="370" y="180" text-anchor="middle" font-size="10" fill="#64748b">发送请求 + 接收事件流</text>
  <text x="370" y="196" text-anchor="middle" font-size="10" fill="#64748b">事件订阅与分发</text>

  <!-- Arrow: AG-UI Client ↔ Agent (SSE/WS) -->
  <line x1="470" y1="140" x2="508" y2="140" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <line x1="508" y1="160" x2="472" y2="160" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <rect x="478" y="120" width="24" height="14" rx="3" fill="#dbeafe"/>
  <text x="490" y="131" text-anchor="middle" font-size="8" font-weight="600" fill="#1d4ed8">SSE</text>
  <rect x="478" y="166" width="24" height="14" rx="3" fill="#d1fae5"/>
  <text x="490" y="177" text-anchor="middle" font-size="8" font-weight="600" fill="#047857">事件</text>

  <!-- ===== Agent (Backend) ===== -->
  <g filter="url(#shadow)">
    <rect x="510" y="85" width="200" height="130" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="510" y="85" width="200" height="36" rx="12" fill="url(#greenG)"/>
  <rect x="510" y="105" width="200" height="16" fill="url(#greenG)"/>
  <text x="610" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="white">Agent</text>
  <text x="610" y="142" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">后端 AI Agent</text>
  <text x="610" y="162" text-anchor="middle" font-size="10" fill="#64748b">LLM 推理 + 工具调用</text>
  <text x="610" y="180" text-anchor="middle" font-size="10" fill="#64748b">生成流式事件响应</text>
  <text x="610" y="196" text-anchor="middle" font-size="10" fill="#64748b">LangGraph / CrewAI / Mastra</text>

  <!-- ===== Secure Proxy (Below) ===== -->
  <g filter="url(#shadow)">
    <rect x="270" y="260" width="280" height="70" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="270" y="260" width="280" height="28" rx="12" fill="url(#violetG)"/>
  <rect x="270" y="278" width="280" height="10" fill="url(#violetG)"/>
  <text x="410" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="white">Secure Proxy</text>
  <text x="410" y="310" text-anchor="middle" font-size="10" fill="#64748b">安全代理：鉴权 · 限流 · 日志 · 凭证管理</text>
  <text x="410" y="324" text-anchor="middle" font-size="9" fill="#94a3b8">可选组件，位于 AG-UI Client 和 Agent 之间</text>

  <!-- Arrow: Agent → Secure Proxy -->
  <line x1="610" y1="215" x2="610" y2="240" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="610" y1="240" x2="550" y2="240" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="550" y1="240" x2="550" y2="258" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowV)"/>

  <!-- Arrow: AG-UI Client → Secure Proxy -->
  <line x1="370" y1="215" x2="370" y2="240" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="370" y1="240" x2="410" y2="240" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="410" y1="240" x2="410" y2="258" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowV)"/>

  <!-- ===== Human-in-the-Loop annotation ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="260" width="210" height="70" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="30" y="260" width="210" height="26" rx="10" fill="url(#amberG)"/>
  <rect x="30" y="276" width="210" height="10" fill="url(#amberG)"/>
  <text x="135" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="white">Human-in-the-Loop</text>
  <text x="135" y="306" text-anchor="middle" font-size="10" fill="#64748b">用户可在执行过程中</text>
  <text x="135" y="320" text-anchor="middle" font-size="10" fill="#64748b">中断 · 审批 · 修改 · 回复</text>

  <!-- Arrow: App → HITL -->
  <line x1="130" y1="215" x2="130" y2="258" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ===== Tool Execution annotation ===== -->
  <g filter="url(#shadow)">
    <rect x="580" y="260" width="210" height="70" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="580" y="260" width="210" height="26" rx="10" fill="url(#violetG)"/>
  <rect x="580" y="276" width="210" height="10" fill="url(#violetG)"/>
  <text x="685" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="white">Tool Execution</text>
  <text x="685" y="306" text-anchor="middle" font-size="10" fill="#64748b">Frontend-Defined 工具</text>
  <text x="685" y="320" text-anchor="middle" font-size="10" fill="#64748b">由前端执行并返回结果</text>

  <!-- Arrow: Agent → Tool Execution -->
  <line x1="685" y1="215" x2="685" y2="258" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowV)"/>

  <!-- ===== Transport Layer ===== -->
  <rect x="30" y="360" width="760" height="36" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="375" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">传输层</text>
  <text x="410" y="390" text-anchor="middle" font-size="10" fill="#64748b">HTTP + SSE（Server-Sent Events） · WebSocket · GraphQL Subscriptions</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="415" width="560" height="30" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="434" text-anchor="middle" font-size="11" fill="#15803d">💡 前端只需对接 AG-UI Client，后端 Agent 框架可自由替换 —— 协议标准化消除适配成本</text>
</svg>