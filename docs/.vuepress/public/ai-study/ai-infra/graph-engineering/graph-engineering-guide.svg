<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowY" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowN" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="540" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Graph Engineering 选型决策图</text>
  <text x="410" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">根据场景需求选择合适的技术栈</text>

  <!-- ===== Start node ===== -->
  <rect x="320" y="75" width="180" height="40" rx="20" fill="url(#indigoG)" filter="url(#shadow)"/>
  <text x="410" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="white">你的图场景是什么？</text>

  <!-- Arrow start → D1 -->
  <line x1="410" y1="115" x2="410" y2="131" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- ===== Decision 1: 是否需要全图算法？ ===== -->
  <polygon points="410,135 570,175 410,215 250,175" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">需要跑全图算法？</text>
  <text x="410" y="188" text-anchor="middle" font-size="10" fill="#92400e">PageRank/社区检测</text>

  <!-- D1 → No → D2 (right side, simple query) -->
  <line x1="570" y1="175" x2="640" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="600" y="168" text-anchor="middle" font-size="10" fill="#64748b">否</text>

  <!-- ===== Decision 2: 数据量 ===== -->
  <polygon points="720,155 790,175 720,195 650,175" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="720" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">数据量？</text>

  <!-- D2 → 亿级以内 → Neo4j -->
  <line x1="720" y1="195" x2="720" y2="216" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="740" y="210" font-size="9" fill="#f59e0b">≤亿级</text>

  <rect x="640" y="220" width="160" height="45" rx="8" fill="url(#blueG)" filter="url(#shadow)"/>
  <text x="720" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="white">场景一：简单图查询</text>
  <text x="720" y="255" text-anchor="middle" font-size="10" fill="#dbeafe">Neo4j + Cypher</text>

  <!-- D2 → 百亿级 → NebulaGraph (below the diamond) -->
  <path d="M 720 195 L 720 195" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <line x1="790" y1="175" x2="800" y2="175" stroke="#64748b" stroke-width="0"/>

  <!-- ===== D1 → Yes → D3 (need GNN?) ===== -->
  <line x1="410" y1="215" x2="410" y2="251" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="425" y="238" font-size="10" fill="#f59e0b">是</text>

  <polygon points="410,255 570,295 410,335 250,295" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">需要图神经网络？</text>
  <text x="410" y="308" text-anchor="middle" font-size="10" fill="#92400e">节点分类/链路预测</text>

  <!-- D3 → No → 大规模图分析 -->
  <line x1="250" y1="295" x2="180" y2="295" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="215" y="288" text-anchor="middle" font-size="10" fill="#64748b">否</text>

  <rect x="30" y="275" width="150" height="45" rx="8" fill="url(#greenG)" filter="url(#shadow)"/>
  <text x="105" y="293" text-anchor="middle" font-size="11" font-weight="700" fill="white">场景二</text>
  <text x="105" y="310" text-anchor="middle" font-size="10" fill="#d1fae5">大规模图分析</text>
  <text x="105" y="345" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">NebulaGraph + GraphX</text>
  <text x="105" y="360" text-anchor="middle" font-size="10" fill="#64748b">nGQL + Plato</text>

  <!-- D3 → Yes → D4 (知识图谱?) -->
  <line x1="410" y1="335" x2="410" y2="371" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="425" y="358" font-size="10" fill="#f59e0b">是</text>

  <polygon points="410,375 570,415 410,455 250,415" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">需要构建知识图谱？</text>
  <text x="410" y="428" text-anchor="middle" font-size="10" fill="#92400e">本体/推理/语义</text>

  <!-- D4 → Yes → 场景三 -->
  <line x1="250" y1="415" x2="180" y2="415" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="215" y="408" text-anchor="middle" font-size="10" fill="#f59e0b">是</text>

  <rect x="30" y="395" width="150" height="60" rx="8" fill="url(#amberG)" filter="url(#shadow)"/>
  <text x="105" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="white">场景三：知识图谱</text>
  <text x="105" y="432" text-anchor="middle" font-size="10" fill="#fef3c7">Neo4j + GDS</text>
  <text x="105" y="447" text-anchor="middle" font-size="10" fill="#fef3c7">本体 + GraphRAG</text>

  <!-- D4 → No → 场景四 -->
  <line x1="570" y1="415" x2="640" y2="415" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="600" y="408" text-anchor="middle" font-size="10" fill="#f59e0b">否</text>

  <rect x="640" y="395" width="160" height="60" rx="8" fill="url(#violetG)" filter="url(#shadow)"/>
  <text x="720" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="white">场景四：图智能</text>
  <text x="720" y="432" text-anchor="middle" font-size="10" fill="#ede9fe">DGL + GraphSAGE</text>
  <text x="720" y="447" text-anchor="middle" font-size="10" fill="#ede9fe">或 GAT</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="170" y="485" width="480" height="40" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="503" text-anchor="middle" font-size="11" fill="#15803d">💡 核心原则：不要过早分布式，好的图建模比好的数据库更重要</text>
  <text x="410" y="518" text-anchor="middle" font-size="11" fill="#15803d">GNN 不是万能药——规则和图算法能解决的不要急着上</text>
</svg>
