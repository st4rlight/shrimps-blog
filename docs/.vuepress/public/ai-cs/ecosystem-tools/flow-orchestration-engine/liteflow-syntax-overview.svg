<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">LiteFlow 编排语法一览</text>
  <text x="410" y="56" text-anchor="middle" font-size="11" fill="#94a3b8">用 EL 表达式描述组件间的协作关系，所见即所得</text>

  <!-- THEN: Serial -->
  <g filter="url(#shadow)">
    <rect x="30" y="75" width="360" height="80" rx="12" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="50" y="97" font-size="13" font-weight="700" fill="#1d4ed8">THEN — 串行执行</text>
  <rect x="50" y="108" width="60" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="80" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">A</text>
  <line x1="114" y1="123" x2="136" y2="123" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="140" y="108" width="60" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="170" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">B</text>
  <line x1="204" y1="123" x2="226" y2="123" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="230" y="108" width="60" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="260" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">C</text>
  <text x="310" y="127" font-size="10" fill="#64748b">按顺序 a→b→c</text>

  <!-- WHEN: Parallel -->
  <g filter="url(#shadow)">
    <rect x="420" y="75" width="370" height="80" rx="12" fill="white" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="440" y="97" font-size="13" font-weight="700" fill="#047857">WHEN — 并行执行</text>
  <line x1="500" y1="105" x2="500" y2="130" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="470" y="108" width="60" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="500" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">A</text>
  <rect x="540" y="108" width="60" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="570" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">B</text>
  <rect x="610" y="108" width="60" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">C</text>
  <text x="690" y="126" font-size="10" fill="#64748b">A∥B∥C 同时执行</text>

  <!-- SWITCH: Selection -->
  <g filter="url(#shadow)">
    <rect x="30" y="175" width="360" height="100" rx="12" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="50" y="197" font-size="13" font-weight="700" fill="#92400e">SWITCH — 选择分支</text>
  <rect x="155" y="208" width="70" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="190" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">switch</text>
  <!-- Diamond -->
  <polygon points="190,240 220,260 190,280 160,260" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="190" y="264" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">条件</text>
  <rect x="240" y="248" width="50" height="24" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="265" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">分支A</text>
  <rect x="300" y="248" width="50" height="24" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="325" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">分支B</text>
  <line x1="222" y1="260" x2="238" y2="258" stroke="#f59e0b" stroke-width="1"/>

  <!-- IF: Condition -->
  <g filter="url(#shadow)">
    <rect x="420" y="175" width="370" height="100" rx="12" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="440" y="197" font-size="13" font-weight="700" fill="#5b21b6">IF — 条件分支</text>
  <rect x="540" y="208" width="70" height="28" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="575" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">ifNode</text>
  <polygon points="575,240 598,260 575,280 552,260" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="575" y="264" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6">条件</text>
  <rect x="625" y="210" width="60" height="24" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="655" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">TRUE</text>
  <rect x="625" y="248" width="60" height="24" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="655" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">FALSE</text>
  <line x1="598" y1="255" x2="623" y2="224" stroke="#8b5cf6" stroke-width="1"/>
  <line x1="598" y1="265" x2="623" y2="259" stroke="#8b5cf6" stroke-width="1"/>

  <!-- FOR: Loop -->
  <g filter="url(#shadow)">
    <rect x="30" y="295" width="360" height="80" rx="12" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <text x="50" y="317" font-size="13" font-weight="700" fill="#3730a3">FOR / WHILE — 循环编排</text>
  <rect x="55" y="330" width="70" height="28" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="90" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">FOR(n)</text>
  <line x1="128" y1="344" x2="148" y2="344" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="152" y="330" width="60" height="28" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="182" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">body</text>
  <!-- Loop arrow -->
  <path d="M 212 358 Q 222 375 182 372 Q 145 370 152 358" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="348" font-size="10" fill="#64748b">重复执行 n 次</text>

  <!-- NEST: Nesting -->
  <g filter="url(#shadow)">
    <rect x="420" y="295" width="370" height="80" rx="12" fill="white" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="440" y="317" font-size="13" font-weight="700" fill="#374151">嵌套组合 — 任意层级</text>
  <text x="440" y="340" font-size="10" fill="#64748b">THEN( a, WHEN(b, c), SWITCH(d).TO(e, f) )</text>
  <rect x="440" y="348" width="320" height="18" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="361" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">外层 THEN 串行</text>

  <!-- Real-world example -->
  <g filter="url(#shadow)">
    <rect x="30" y="395" width="760" height="120" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="30" y="395" width="760" height="32" rx="12" fill="url(#greenG)"/>
  <rect x="30" y="415" width="760" height="12" fill="url(#greenG)"/>
  <text x="410" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="white">实战示例：AI 客服会话处理流程</text>

  <!-- Flow: THEN(preprocess, WHEN(intent, emotion), SWITCH(route)...) -->
  <rect x="60" y="440" width="70" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="95" y="459" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">预处理</text>
  <line x1="133" y1="455" x2="152" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="156" y="440" width="140" height="30" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="226" y="453" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">WHEN 并行</text>
  <text x="226" y="465" text-anchor="middle" font-size="8" fill="#047857">意图识别 ∥ 情绪分析</text>
  <line x1="299" y1="455" x2="318" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="340,440 370,455 340,470 310,455" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="340" y="459" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">路由</text>
  <line x1="372" y1="455" x2="390" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="394" y="440" width="120" height="30" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="454" y="453" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">SWITCH 选择</text>
  <text x="454" y="465" text-anchor="middle" font-size="8" fill="#5b21b6">退款/咨询/投诉</text>
  <line x1="517" y1="455" x2="536" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="440" width="80" height="30" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="580" y="459" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">LLM回复</text>
  <line x1="623" y1="455" x2="642" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="646" y="440" width="80" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="686" y="459" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">记录日志</text>

  <!-- Code snippet -->
  <text x="60" y="498" font-size="10" font-weight="600" fill="#374151">规则代码：</text>
  <text x="120" y="498" font-size="9" fill="#6366f1">THEN( preprocessNode, WHEN(intentNode, emotionNode),
    SWITCH(intentSwitch).TO(refundChain, consultChain, complaintChain), recordNode );</text>

  <!-- Bottom tip -->
  <rect x="200" y="528" width="420" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="545" text-anchor="middle" font-size="10" fill="#15803d">💡 规则文件即流程图：看规则就能理解业务全貌，非技术人员也能参与设计</text>
</svg>
