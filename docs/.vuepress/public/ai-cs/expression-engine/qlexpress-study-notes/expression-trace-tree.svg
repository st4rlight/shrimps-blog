<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="540" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">表达式追踪树结构</text>
  <text x="410" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">每个节点记录类型、Token、中间值、是否被计算（短路标记）</text>

  <!-- ===== Expression string ===== -->
  <rect x="210" y="72" width="400" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="410" y="90" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e293b">a &amp;&amp; (!myTest(11) || false)</text>

  <!-- Arrow down to tree -->
  <line x1="410" y1="102" x2="410" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Trace Tree ===== -->
  <!-- Root: OPERATOR && -->
  <g transform="translate(330, 125)">
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">OPERATOR &amp;&amp;</text>
    <text x="80" y="34" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">value: false ✓</text>
  </g>

  <!-- Lines from root to children -->
  <line x1="360" y1="169" x2="250" y2="200" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="460" y1="169" x2="560" y2="200" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Left child: VARIABLE a -->
  <g transform="translate(180, 200)">
    <rect x="0" y="0" width="140" height="44" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">VARIABLE a</text>
    <text x="70" y="34" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">value: true ✓</text>
  </g>

  <!-- Right child: OPERATOR || -->
  <g transform="translate(490, 200)">
    <rect x="0" y="0" width="140" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">OPERATOR ||</text>
    <text x="70" y="34" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">value: false ✓</text>
  </g>

  <!-- Lines from || to children -->
  <line x1="530" y1="244" x2="460" y2="275" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="590" y1="244" x2="660" y2="275" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- || left child: OPERATOR ! -->
  <g transform="translate(400, 275)">
    <rect x="0" y="0" width="120" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">OPERATOR !</text>
    <text x="60" y="34" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">value: false ✓</text>
  </g>

  <!-- || right child: VALUE false -->
  <g transform="translate(620, 275)">
    <rect x="0" y="0" width="100" height="44" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="50" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">VALUE false</text>
    <text x="50" y="34" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">value: false ✓</text>
  </g>

  <!-- Line from ! to FUNCTION myTest -->
  <line x1="460" y1="319" x2="460" y2="345" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- ! child: FUNCTION myTest -->
  <g transform="translate(380, 345)">
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">FUNCTION myTest</text>
    <text x="80" y="34" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">value: true ✓</text>
  </g>

  <!-- Line from myTest to VALUE 11 -->
  <line x1="460" y1="389" x2="460" y2="410" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- myTest child: VALUE 11 -->
  <g transform="translate(410, 410)">
    <rect x="0" y="0" width="100" height="38" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="50" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">VALUE 11</text>
    <text x="50" y="30" text-anchor="middle" font-size="11" font-family="monospace" fill="#047857">value: 11 ✓</text>
  </g>

  <!-- ===== Right side: Node field legend ===== -->
  <g transform="translate(660, 125)">
    <rect x="0" y="0" width="140" height="195" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <rect x="0" y="0" width="140" height="32" rx="10" fill="url(#violetG)"/>
    <rect x="0" y="16" width="140" height="16" fill="url(#violetG)"/>
    <text x="70" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="white">ExpressionTrace</text>

    <text x="12" y="50" font-size="9" font-weight="600" fill="#8b5cf6">type</text>
    <text x="128" y="50" text-anchor="end" font-size="9" fill="#64748b">TraceType</text>

    <text x="12" y="66" font-size="9" font-weight="600" fill="#8b5cf6">token</text>
    <text x="128" y="66" text-anchor="end" font-size="9" fill="#64748b">String</text>

    <text x="12" y="82" font-size="9" font-weight="600" fill="#8b5cf6">value</text>
    <text x="128" y="82" text-anchor="end" font-size="9" fill="#64748b">Object</text>

    <text x="12" y="98" font-size="9" font-weight="600" fill="#8b5cf6">evaluated</text>
    <text x="128" y="98" text-anchor="end" font-size="9" fill="#64748b">boolean</text>

    <text x="12" y="114" font-size="9" font-weight="600" fill="#8b5cf6">children</text>
    <text x="128" y="114" text-anchor="end" font-size="9" fill="#64748b">List&lt;...&gt;</text>

    <line x1="10" y1="122" x2="130" y2="122" stroke="#e2e8f0" stroke-width="1"/>

    <text x="12" y="136" font-size="9" font-weight="600" fill="#8b5cf6">line</text>
    <text x="128" y="136" text-anchor="end" font-size="9" fill="#64748b">int</text>

    <text x="12" y="152" font-size="9" font-weight="600" fill="#8b5cf6">col</text>
    <text x="128" y="152" text-anchor="end" font-size="9" fill="#64748b">int</text>

    <text x="12" y="168" font-size="9" font-weight="600" fill="#8b5cf6">position</text>
    <text x="128" y="168" text-anchor="end" font-size="9" fill="#64748b">int</text>

    <line x1="10" y1="176" x2="130" y2="176" stroke="#e2e8f0" stroke-width="1"/>
    <text x="70" y="188" text-anchor="middle" font-size="8" fill="#94a3b8">源码定位信息</text>
  </g>

  <!-- ===== Bottom: Color legend ===== -->
  <line x1="30" y1="465" x2="790" y2="465" stroke="#e2e8f0" stroke-width="1"/>

  <text x="410" y="485" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">节点类型颜色说明</text>

  <g transform="translate(60, 495)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="11" font-size="9" fill="#475569">OPERATOR 运算符</text>
  </g>
  <g transform="translate(200, 495)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="11" font-size="9" fill="#475569">VARIABLE 变量</text>
  </g>
  <g transform="translate(340, 495)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="11" font-size="9" fill="#475569">FUNCTION 函数</text>
  </g>
  <g transform="translate(480, 495)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="11" font-size="9" fill="#475569">VALUE 常量值</text>
  </g>
  <g transform="translate(620, 495)">
    <text x="0" y="11" font-size="9" fill="#94a3b8">✓ evaluated=true</text>
    <text x="120" y="11" font-size="9" fill="#94a3b8">空=未计算(短路)</text>
  </g>

  <!-- Bottom tip -->
  <rect x="100" y="518" width="620" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="531" text-anchor="middle" font-size="10" fill="#15803d">💡 追踪树 = 语法树 + 每个节点的中间结果值 · 短路节点的 evaluated=false</text>
</svg>
