<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="400" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">图计算模型：BSP vs GAS</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">两种分布式图计算的工作原理</text>

  <!-- ===== Left: BSP ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="350" height="270" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="350" height="35" rx="12" fill="url(#blueG)"/>
  <rect x="30" y="97" width="350" height="18" fill="url(#blueG)"/>
  <text x="205" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="white">BSP（Bulk Synchronous Parallel）</text>

  <!-- Superstep boxes -->
  <rect x="55" y="130" width="90" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="150" text-anchor="middle" font-size="10" fill="#1d4ed8">compute()</text>

  <line x1="145" y1="145" x2="161" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <rect x="165" y="130" width="90" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="210" y="150" text-anchor="middle" font-size="10" fill="#92400e">消息传递</text>

  <line x1="255" y1="145" x2="271" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <rect x="275" y="130" width="80" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="315" y="150" text-anchor="middle" font-size="10" fill="#92400e">Barrier 同步</text>

  <!-- Superstep loop arrow -->
  <path d="M 315 160 L 315 175 L 100 175 L 100 160" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <text x="205" y="190" text-anchor="middle" font-size="9" fill="#3b82f6">超步循环</text>

  <!-- Superstep sequence -->
  <rect x="55" y="205" width="60" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="85" y="221" text-anchor="middle" font-size="9" fill="#1d4ed8">超步1</text>

  <line x1="115" y1="217" x2="131" y2="217" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="135" y="205" width="60" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="165" y="221" text-anchor="middle" font-size="9" fill="#1d4ed8">超步2</text>

  <line x1="195" y1="217" x2="211" y2="217" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="205" width="60" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="245" y="221" text-anchor="middle" font-size="9" fill="#1d4ed8">超步3</text>

  <line x1="275" y1="217" x2="291" y2="217" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="295" y="205" width="60" height="24" rx="4" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="325" y="221" text-anchor="middle" font-size="9" fill="#047857">完成</text>

  <!-- BSP properties -->
  <rect x="55" y="245" width="300" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="65" y="263" font-size="10" font-weight="600" fill="#3b82f6">BSP 特点：</text>
  <text x="65" y="281" font-size="10" fill="#64748b">• 超步内并行执行 compute()</text>
  <text x="65" y="299" font-size="10" fill="#64748b">• 超步间全局同步屏障</text>
  <text x="65" y="317" font-size="10" fill="#64748b">• 编程简单，但有 Straggler 问题</text>
  <text x="65" y="331" font-size="10" fill="#64748b">• 代表：Pregel, Giraph, GraphX</text>

  <!-- ===== Right: GAS ===== -->
  <g filter="url(#shadow)">
    <rect x="420" y="80" width="350" height="270" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="420" y="80" width="350" height="35" rx="12" fill="url(#greenG)"/>
  <rect x="420" y="97" width="350" height="18" fill="url(#greenG)"/>
  <text x="595" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="white">GAS（Gather-Apply-Scatter）</text>

  <!-- GAS stages -->
  <rect x="445" y="130" width="90" height="30" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="490" y="150" text-anchor="middle" font-size="10" fill="#047857">Gather</text>

  <line x1="535" y1="145" x2="551" y2="145" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="555" y="130" width="80" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="595" y="150" text-anchor="middle" font-size="10" fill="#1d4ed8">Apply</text>

  <line x1="635" y1="145" x2="651" y2="145" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="655" y="130" width="90" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="700" y="150" text-anchor="middle" font-size="10" fill="#92400e">Scatter</text>

  <!-- GAS split illustration -->
  <rect x="445" y="180" width="300" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="#10b981">超级节点 Gather 可切分</text>
  <rect x="465" y="208" width="120" height="16" rx="4" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="525" y="220" text-anchor="middle" font-size="9" fill="#047857">worker 1: 邻居子集</text>
  <rect x="605" y="208" width="120" height="16" rx="4" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="665" y="220" text-anchor="middle" font-size="9" fill="#047857">worker 2: 邻居子集</text>
  <text x="595" y="243" text-anchor="middle" font-size="9" fill="#64748b">→ 聚合后 Apply</text>

  <!-- GAS properties -->
  <rect x="445" y="265" width="300" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="455" y="283" font-size="10" font-weight="600" fill="#10b981">GAS 特点：</text>
  <text x="455" y="301" font-size="10" fill="#64748b">• Gather 可拆分到多 worker 并行</text>
  <text x="455" y="319" font-size="10" fill="#64748b">• 解决幂律图超级节点瓶颈</text>
  <text x="455" y="332" font-size="10" fill="#64748b">• 代表：PowerGraph, Plato</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="370" width="540" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="385" text-anchor="middle" font-size="11" fill="#15803d">💡 BSP 通用简单，GAS 适合幂律图（社交网络等超级节点场景）</text>
</svg>
