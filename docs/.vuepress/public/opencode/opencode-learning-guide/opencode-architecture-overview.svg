<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="820" height="560" fill="#f8fafc" rx="12"/>

  <text x="410" y="30" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">OpenCode 五层架构与依赖方向</text>

  <!-- Schema Layer -->
  <g filter="url(#shadow)">
    <rect x="40" y="50" width="740" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="73" font-size="11" font-weight="600" fill="#1d4ed8" letter-spacing="1.5">SCHEMA LAYER</text>
    <text x="60" y="92" font-size="12" fill="#374151">packages/schema — 纯类型定义，零业务逻辑，零依赖</text>
  </g>

  <!-- Core Layer -->
  <g filter="url(#shadow)">
    <rect x="40" y="125" width="740" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="60" y="148" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="1.5">CORE LAYER</text>
    <text x="60" y="167" font-size="12" fill="#374151">packages/core — 领域逻辑：Session Runner、Tool Registry、Database</text>
  </g>

  <!-- LLM Layer (left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="200" width="350" height="55" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="60" y="223" font-size="11" font-weight="600" fill="#7c3aed" letter-spacing="1.5">LLM LAYER</text>
    <text x="60" y="242" font-size="12" fill="#374151">packages/llm — LLM 抽象与协议适配</text>
  </g>

  <!-- Protocol Layer (right) -->
  <g filter="url(#shadow)">
    <rect x="410" y="200" width="370" height="55" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="430" y="223" font-size="11" font-weight="600" fill="#7c3aed" letter-spacing="1.5">PROTOCOL LAYER</text>
    <text x="430" y="242" font-size="12" fill="#374151">packages/protocol — HttpApi 路由与中间件</text>
  </g>

  <!-- Application (left, highlighted, spans 2 rows) -->
  <g filter="url(#shadow)">
    <rect x="40" y="275" width="350" height="130" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="60" y="300" font-size="11" font-weight="600" fill="#5b21b6" letter-spacing="1.5">APPLICATION (packages/opencode)</text>
    <text x="60" y="322" font-size="13" font-weight="600" fill="#1e293b">组合所有层</text>
    <text x="60" y="342" font-size="10" fill="#64748b">· CLI · Agent · Session · Tool · Provider</text>
    <text x="60" y="358" font-size="10" fill="#64748b">· Plugin · MCP · Config · Permission</text>
    <text x="60" y="374" font-size="10" fill="#64748b">· Server · LSP · Skill · Snapshot · Git</text>
  </g>

  <!-- Server Layer (right) -->
  <g filter="url(#shadow)">
    <rect x="410" y="275" width="370" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="430" y="298" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="1.5">SERVER LAYER</text>
    <text x="430" y="317" font-size="12" fill="#374151">packages/server — HTTP 处理器、CORS、Auth</text>
  </g>

  <!-- Client Layer (right) -->
  <g filter="url(#shadow)">
    <rect x="410" y="350" width="370" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="430" y="373" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="1.5">CLIENT LAYER</text>
    <text x="430" y="392" font-size="12" fill="#374151">packages/client — 自动生成的 Client SDK</text>
  </g>

  <!-- Bottom row: TUI, APP, SDK -->
  <g filter="url(#shadow)">
    <rect x="40" y="425" width="240" height="55" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="60" y="448" font-size="10" font-weight="600" fill="#047857" letter-spacing="1">TUI</text>
    <text x="60" y="467" font-size="11" fill="#374151">终端界面 (OpenTUI)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="300" y="425" width="240" height="55" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="320" y="448" font-size="10" font-weight="600" fill="#047857" letter-spacing="1">APP</text>
    <text x="320" y="467" font-size="11" fill="#374151">桌面/Web (SolidJS)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="560" y="425" width="240" height="55" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="580" y="448" font-size="10" font-weight="600" fill="#047857" letter-spacing="1">SDK</text>
    <text x="580" y="467" font-size="11" fill="#374151">JS SDK / sdk-next</text>
  </g>

  <!-- Dependency arrows -->
  <line x1="410" y1="105" x2="410" y2="123" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="180" x2="410" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
