<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowY" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowN" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="540" rx="14" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">要不要用 Grill Me？</text>
  <text x="410" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">按「失败后的返工成本」判断，而不是按任务大小</text>

  <!-- ===== Start node ===== -->
  <g filter="url(#shadow)">
    <rect x="305" y="80" width="210" height="46" rx="23" fill="url(#indigoG)"/>
  </g>
  <text x="410" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="white">开始一个任务</text>

  <!-- ===== Decision 1 ===== -->
  <g filter="url(#shadow)">
    <rect x="305" y="175" width="210" height="56" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="410" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">返工成本低吗？</text>
  <text x="410" y="218" text-anchor="middle" font-size="10" fill="#64748b">typo / 文案 / 独立小改动</text>

  <!-- start → decision1 -->
  <line x1="410" y1="126" x2="410" y2="171" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- ===== Yes branch → do it directly ===== -->
  <line x1="515" y1="203" x2="606" y2="203" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="560" y="195" text-anchor="middle" font-size="11" fill="#64748b">是</text>
  <g filter="url(#shadow)">
    <rect x="610" y="180" width="180" height="46" rx="23" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="700" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">直接用，别问</text>

  <!-- ===== No branch → decision2 ===== -->
  <line x1="410" y1="231" x2="410" y2="311" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="420" y="276" text-anchor="start" font-size="11" fill="#64748b">否</text>

  <!-- ===== Decision 2 ===== -->
  <g filter="url(#shadow)">
    <rect x="305" y="315" width="210" height="56" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="410" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">影响核心逻辑吗？</text>
  <text x="410" y="358" text-anchor="middle" font-size="10" fill="#64748b">数据模型 / 权限 / 用户流程</text>

  <!-- ===== Yes → grill me ===== -->
  <line x1="515" y1="343" x2="606" y2="343" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="560" y="335" text-anchor="middle" font-size="11" fill="#f59e0b">是</text>
  <g filter="url(#shadow)">
    <rect x="610" y="318" width="180" height="50" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="700" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">用 Grill Me</text>
  <text x="700" y="358" text-anchor="middle" font-size="10" fill="#047857">先拷问再动手</text>

  <!-- ===== No → depends ===== -->
  <line x1="410" y1="371" x2="410" y2="426" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="420" y="404" text-anchor="start" font-size="11" fill="#64748b">否</text>
  <g filter="url(#shadow)">
    <rect x="305" y="430" width="210" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="410" y="451" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">看情况</text>
  <text x="410" y="470" text-anchor="middle" font-size="10" fill="#92400e">局部改动可直接做</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="230" y="505" width="360" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="523" text-anchor="middle" font-size="11" fill="#15803d">💡 重构 / 登录 / 支付 / 评论 —— 强烈建议先拷问</text>
</svg>
