<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="540" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">AI 交互范式四层演进</text>
  <text x="410" y="52" text-anchor="middle" font-size="12" fill="#94a3b8">从"写措辞"到"设计循环"——每一层包住前一层，杠杆率递增</text>

  <!-- ===== Layer 4 (outermost): Loop Engineering ===== -->
  <g filter="url(#shadowLg)">
    <rect x="30" y="70" width="760" height="440" rx="12" fill="white" stroke="#6366f1" stroke-width="2.5"/>
  </g>
  <rect x="30" y="70" width="760" height="36" rx="12" fill="url(#indigoG)"/>
  <rect x="30" y="92" width="760" height="14" fill="url(#indigoG)"/>
  <text x="55" y="93" text-anchor="start" font-size="14" font-weight="700" fill="white">④ Loop Engineering（2026）</text>
  <text x="775" y="93" text-anchor="end" font-size="11" font-weight="500" fill="white">核心问题：Agent 如何持续自主工作？</text>
  <text x="55" y="122" text-anchor="start" font-size="11" fill="#4338ca" font-weight="600">开发者角色：循环系统设计者 → 设计驱动自主工作的迭代循环</text>

  <!-- ===== Layer 3: Harness Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="60" y="135" width="700" height="360" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="60" y="135" width="700" height="32" rx="10" fill="url(#violetG)"/>
  <rect x="60" y="155" width="700" height="12" fill="url(#violetG)"/>
  <text x="80" y="156" text-anchor="start" font-size="13" font-weight="700" fill="white">③ Harness Engineering（2026）</text>
  <text x="740" y="156" text-anchor="end" font-size="10" font-weight="500" fill="white">Agent 运行需要什么环境？</text>
  <text x="80" y="183" text-anchor="start" font-size="11" fill="#5b21b6" font-weight="600">开发者角色：环境搭建者 → 配置工具、约束条件、反馈管道、沙箱、权限</text>

  <!-- ===== Layer 2: Context Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="90" y="198" width="640" height="280" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="90" y="198" width="640" height="32" rx="10" fill="url(#blueG)"/>
  <rect x="90" y="218" width="640" height="12" fill="url(#blueG)"/>
  <text x="110" y="219" text-anchor="start" font-size="13" font-weight="700" fill="white">② Context Engineering（2025）</text>
  <text x="710" y="219" text-anchor="end" font-size="10" font-weight="500" fill="white">模型需要看到什么？</text>
  <text x="110" y="246" text-anchor="start" font-size="11" fill="#1d4ed8" font-weight="600">开发者角色：上下文策划者 → RAG、上下文压缩、token 预算管理</text>

  <!-- ===== Layer 1 (innermost): Prompt Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="120" y="261" width="580" height="200" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="120" y="261" width="580" height="32" rx="10" fill="url(#amberG)"/>
  <rect x="120" y="281" width="580" height="12" fill="url(#amberG)"/>
  <text x="140" y="282" text-anchor="start" font-size="13" font-weight="700" fill="white">① Prompt Engineering（2022-2024）</text>
  <text x="680" y="282" text-anchor="end" font-size="10" font-weight="500" fill="white">怎么跟模型说话？</text>
  <text x="140" y="309" text-anchor="start" font-size="11" fill="#92400e" font-weight="600">开发者角色：措辞优化者 → 优化 prompt 措辞、few-shot 示例、模板设计</text>

  <!-- Core: Single LLM Call -->
  <g filter="url(#shadow)">
    <rect x="250" y="325" width="320" height="120" rx="10" fill="#f1f5f9" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="410" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">🧠 LLM 模型调用</text>
  <text x="410" y="372" text-anchor="middle" font-size="11" fill="#64748b">概率性推理 · 工具调用 · 任务规划</text>
  <text x="410" y="395" text-anchor="middle" font-size="10" fill="#94a3b8">所有范式最终都服务于这一次调用</text>
  <text x="410" y="420" text-anchor="middle" font-size="10" fill="#94a3b8">但每一层让这次调用更可靠、更持续</text>

  <!-- Nesting arrows on the left -->
  <text x="45" y="290" text-anchor="middle" font-size="9" fill="#6366f1" font-weight="600" transform="rotate(-90 45 290)">包住</text>
  <text x="75" y="290" text-anchor="middle" font-size="9" fill="#8b5cf6" font-weight="600" transform="rotate(-90 75 290)">包住</text>
  <text x="105" y="290" text-anchor="middle" font-size="9" fill="#3b82f6" font-weight="600" transform="rotate(-90 105 290)">包住</text>

  <!-- Leverage indicator -->
  <rect x="180" y="470" width="460" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="486" text-anchor="middle" font-size="10" fill="#64748b">💡 杠杆率递增：措辞 → 上下文 → 环境 → 循环，每一层比上一层影响力更大</text>

  <!-- Bottom tip -->
  <rect x="100" y="505" width="620" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="410" y="521" text-anchor="middle" font-size="10" fill="#4338ca">四层是嵌套关系而非替代——你仍需写好 prompt，只是关注点从"单次交互"上升到"持续循环"</text>
</svg>
