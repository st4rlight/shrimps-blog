<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="700" height="400" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">物化视图：即时计算 vs 预计算的权衡</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">查询频率越高，预计算（物化）摊薄刷新成本的优势越明显</text>

  <!-- ===== Legend ===== -->
  <line x1="400" y1="80" x2="422" y2="80" stroke="#ef4444" stroke-width="2.5"/>
  <text x="428" y="84" font-size="11" fill="#991b1b">即时计算（每次现算）</text>
  <line x1="548" y1="80" x2="570" y2="80" stroke="#10b981" stroke-width="2.5"/>
  <text x="576" y="84" font-size="11" fill="#047857">物化视图（预计算）</text>

  <!-- ===== Axes ===== -->
  <line x1="90" y1="320" x2="660" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="90" y1="320" x2="90" y2="90" stroke="#475569" stroke-width="1.5"/>

  <!-- grid -->
  <line x1="90" y1="140" x2="660" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="90" y1="200" x2="660" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="90" y1="260" x2="660" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== Best region (high freq) ===== -->
  <rect x="175" y="90" width="485" height="230" rx="6" fill="#dcfce7" fill-opacity="0.45" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="105" text-anchor="end" font-size="10" font-weight="600" fill="#15803d">高频：物化更优</text>

  <!-- ===== Curves ===== -->
  <!-- 即时计算：恒定偏高成本 -->
  <line x1="90" y1="170" x2="660" y2="170" stroke="#ef4444" stroke-width="2.5"/>
  <!-- 物化视图：低频 upfront 高，随频率摊薄 -->
  <path d="M 90 120 Q 250 230 430 250 L 660 250" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- ===== Crossover (拐点) ===== -->
  <line x1="175" y1="90" x2="175" y2="320" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="183" y="108" font-size="10" font-weight="600" fill="#b45309">拐点</text>

  <!-- ===== Axis labels ===== -->
  <text transform="rotate(-90 45 205)" x="45" y="205" text-anchor="middle" font-size="11" fill="#64748b">单次查询成本</text>
  <text x="375" y="345" text-anchor="middle" font-size="11" fill="#64748b">查询频率（低 → 高）</text>
  <text x="98" y="100" font-size="9" fill="#94a3b8">高</text>
  <text x="98" y="318" font-size="9" fill="#94a3b8">低</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="120" y="372" width="460" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="350" y="389" text-anchor="middle" font-size="11" fill="#047857">💡 低频用即时计算（零存储），高频用物化视图（摊薄刷新成本）；中频可结合 Lattice 自动推荐</text>
</svg>
