<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="460" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">图查询语言对比</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">Cypher · Gremlin · GQL · nGQL</text>

  <!-- ===== 4 Cards in 2x2 grid ===== -->

  <!-- Card 1: Cypher -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="365" height="160" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="365" height="32" rx="10" fill="url(#blueG)"/>
  <rect x="30" y="96" width="365" height="16" fill="url(#blueG)"/>
  <text x="50" y="101" font-size="14" font-weight="700" fill="white">Cypher</text>
  <text x="375" y="101" text-anchor="end" font-size="10" fill="#dbeafe">声明式 · Neo4j</text>

  <text x="50" y="132" font-size="10" font-weight="600" fill="#475569">设计风格：声明式模式匹配</text>
  <text x="50" y="150" font-size="10" fill="#64748b">语法直觉：⭐⭐⭐⭐⭐ 最直觉</text>
  <text x="50" y="168" font-size="10" fill="#64748b">表达力：子图模式匹配为主</text>
  <text x="50" y="186" font-size="10" fill="#64748b">支持：Neo4j, Memgraph</text>
  <rect x="50" y="200" width="325" height="28" rx="6" fill="#f1f5f9"/>
  <text x="60" y="219" font-size="9" fill="#64748b">MATCH (u)-[:FRIEND]->(f) RETURN f.name</text>

  <!-- Card 2: Gremlin -->
  <g filter="url(#shadow)">
    <rect x="410" y="80" width="360" height="160" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="410" y="80" width="360" height="32" rx="10" fill="url(#amberG)"/>
  <rect x="410" y="96" width="360" height="16" fill="url(#amberG)"/>
  <text x="430" y="101" font-size="14" font-weight="700" fill="white">Gremlin</text>
  <text x="750" y="101" text-anchor="end" font-size="10" fill="#fef3c7">命令式 · TinkerPop</text>

  <text x="430" y="132" font-size="10" font-weight="600" fill="#475569">设计风格：函数式遍历 DSL</text>
  <text x="430" y="150" font-size="10" fill="#64748b">语法直觉：⭐⭐ 需理解遍历器</text>
  <text x="430" y="168" font-size="10" fill="#64748b">表达力：图灵完备</text>
  <text x="430" y="186" font-size="10" fill="#64748b">支持：Neo4j, JanusGraph, Neptune</text>
  <rect x="430" y="200" width="320" height="28" rx="6" fill="#f1f5f9"/>
  <text x="440" y="219" font-size="9" fill="#64748b">g.V().has('name','张三').out('FRIEND')</text>

  <!-- Card 3: GQL -->
  <g filter="url(#shadow)">
    <rect x="30" y="260" width="365" height="160" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="30" y="260" width="365" height="32" rx="10" fill="url(#greenG)"/>
  <rect x="30" y="276" width="365" height="16" fill="url(#greenG)"/>
  <text x="50" y="281" font-size="14" font-weight="700" fill="white">GQL</text>
  <text x="375" y="281" text-anchor="end" font-size="10" fill="#d1fae5">ISO 标准 · 未来</text>

  <text x="50" y="312" font-size="10" font-weight="600" fill="#475569">设计风格：声明式 + 过程式扩展</text>
  <text x="50" y="330" font-size="10" fill="#64748b">语法直觉：⭐⭐⭐⭐ Cypher 超集</text>
  <text x="50" y="348" font-size="10" fill="#64748b">表达力：模式匹配 + 过程式扩展</text>
  <text x="50" y="366" font-size="10" fill="#64748b">支持：Neo4j 5.x，逐步推广中</text>
  <rect x="50" y="380" width="325" height="28" rx="6" fill="#f0fdf4"/>
  <text x="60" y="399" font-size="10" fill="#047857">💡 ISO/IEC 39075 — 继 SQL 后第二个标准</text>

  <!-- Card 4: nGQL -->
  <g filter="url(#shadow)">
    <rect x="410" y="260" width="360" height="160" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="410" y="260" width="360" height="32" rx="10" fill="url(#violetG)"/>
  <rect x="410" y="276" width="360" height="16" fill="url(#violetG)"/>
  <text x="430" y="281" font-size="14" font-weight="700" fill="white">nGQL</text>
  <text x="750" y="281" text-anchor="end" font-size="10" fill="#ede9fe">NebulaGraph</text>

  <text x="430" y="312" font-size="10" font-weight="600" fill="#475569">设计风格：声明式（Cypher 变体）</text>
  <text x="430" y="330" font-size="10" fill="#64748b">语法直觉：⭐⭐⭐⭐ 接近 Cypher</text>
  <text x="430" y="348" font-size="10" fill="#64748b">表达力：模式匹配</text>
  <text x="430" y="366" font-size="10" fill="#64748b">支持：NebulaGraph</text>
  <rect x="430" y="380" width="320" height="28" rx="6" fill="#f5f3ff"/>
  <text x="440" y="399" font-size="9" fill="#64748b">GO 1 TO 3 STEPS FROM "张三" OVER FRIEND</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="430" width="540" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="445" text-anchor="middle" font-size="11" fill="#15803d">💡 Cypher 最直觉，GQL 是 ISO 标准的未来趋势</text>
</svg>
