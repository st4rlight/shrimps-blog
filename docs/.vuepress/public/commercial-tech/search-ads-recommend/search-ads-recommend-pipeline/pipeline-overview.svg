<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowB" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="560" rx="14" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">搜广推系统级联漏斗架构</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">召回 → 粗排 → 精排 → 重排，从多到少、从粗到精</text>

  <!-- ===== Funnel shapes (trapezoids) ===== -->

  <!-- Step 1: Recall - widest -->
  <g filter="url(#shadow)">
    <polygon points="100,80 700,80 620,155 180,155" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="100" y="80" width="600" height="36" rx="0" fill="url(#blueG)"/>
  <rect x="100" y="80" width="600" height="36" rx="0" fill="url(#blueG)"/>
  <text x="400" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="white">① 召回 Recall</text>
  <text x="300" y="140" font-size="12" fill="#1d4ed8" font-weight="600">快 + 广</text>
  <text x="500" y="140" font-size="11" fill="#64748b">亿级 → 数千~数万</text>

  <!-- Arrow 1→2 -->
  <line x1="400" y1="155" x2="400" y2="171" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Step 2: Pre-Ranking -->
  <g filter="url(#shadow)">
    <polygon points="160,175 640,175 580,250 220,250" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="160" y="175" width="480" height="36" rx="0" fill="url(#greenG)"/>
  <text x="400" y="199" text-anchor="middle" font-size="15" font-weight="700" fill="white">② 粗排 Pre-Ranking</text>
  <text x="300" y="236" font-size="12" fill="#047857" font-weight="600">轻量筛选</text>
  <text x="500" y="236" font-size="11" fill="#64748b">数千~数万 → 数百~数千</text>

  <!-- Arrow 2→3 -->
  <line x1="400" y1="250" x2="400" y2="266" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Step 3: Ranking - narrow -->
  <g filter="url(#shadow)">
    <polygon points="220,270 580,270 530,345 270,345" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="220" y="270" width="360" height="36" rx="0" fill="url(#amberG)"/>
  <text x="400" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="white">③ 精排 Ranking</text>
  <text x="300" y="330" font-size="12" fill="#92400e" font-weight="600">精准打分</text>
  <text x="500" y="330" font-size="11" fill="#64748b">数百~数千 → 数十~数百</text>

  <!-- Arrow 3→4 -->
  <line x1="400" y1="345" x2="400" y2="361" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Step 4: Re-Ranking - narrowest -->
  <g filter="url(#shadow)">
    <polygon points="270,365 530,365 500,440 300,440" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="270" y="365" width="260" height="36" rx="0" fill="url(#violetG)"/>
  <text x="400" y="389" text-anchor="middle" font-size="15" font-weight="700" fill="white">④ 重排 Re-Ranking</text>
  <text x="340" y="426" font-size="12" fill="#5b21b6" font-weight="600">全局优化</text>
  <text x="470" y="426" font-size="11" fill="#64748b">→ 十几~几十条</text>

  <!-- ===== Right side: Complexity indicator ===== -->
  <text x="730" y="120" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">模型复杂度</text>
  <line x1="730" y1="130" x2="730" y2="420" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="730,420 724,408 736,408" fill="#94a3b8"/>
  <text x="730" y="438" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">高</text>
  <text x="730" y="138" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">低</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="470" width="540" height="32" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="491" text-anchor="middle" font-size="12" fill="#15803d">💡 核心哲学：算力有限，分层漏斗，每层用"刚好够用"的模型复杂度</text>

  <!-- ===== Left side: Candidate scale ===== -->
  <text x="50" y="120" text-anchor="start" font-size="10" fill="#94a3b8" font-weight="600">候选规模</text>
  <text x="50" y="140" text-anchor="start" font-size="11" fill="#3b82f6">亿级</text>
  <text x="50" y="210" text-anchor="start" font-size="11" fill="#10b981">数千</text>
  <text x="50" y="305" text-anchor="start" font-size="11" fill="#f59e0b">数百</text>
  <text x="50" y="400" text-anchor="start" font-size="11" fill="#8b5cf6">数十</text>
</svg>
