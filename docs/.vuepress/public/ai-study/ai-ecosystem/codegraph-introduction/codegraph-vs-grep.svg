<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="400" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">CodeGraph vs 传统 grep 方式</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#94a3b8">AI Agent 理解代码的两种路径</text>

  <!-- ===== Left: Traditional grep (Anti-pattern) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="340" height="290" rx="12" fill="white" stroke="#fca5a5" stroke-width="2"/>
  </g>
  <rect x="30" y="70" width="340" height="40" rx="12" fill="url(#redG)"/>
  <rect x="30" y="90" width="340" height="20" fill="url(#redG)"/>
  <text x="200" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="white">传统方式：grep + 逐文件读取</text>

  <!-- Step 1: grep -->
  <rect x="50" y="125" width="300" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="145" text-anchor="middle" font-size="11" fill="#991b1b">grep "getUser" → 匹配到 50+ 结果</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="157" x2="200" y2="170" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 2: read files -->
  <rect x="50" y="174" width="300" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="194" text-anchor="middle" font-size="11" fill="#991b1b">逐个打开文件读取 → 大量 token 消耗</text>

  <!-- Arrow 2→3 -->
  <line x1="200" y1="206" x2="200" y2="219" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 3: guess relationships -->
  <rect x="50" y="223" width="300" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="243" text-anchor="middle" font-size="11" fill="#991b1b">猜测调用关系 → 容易遗漏和出错</text>

  <!-- Pain points -->
  <text x="200" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">探索税</text>
  <text x="200" y="296" text-anchor="middle" font-size="10" fill="#991b1b">20-80 次工具调用，大量 token</text>
  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#991b1b">无调用链追踪，影响范围未知</text>
  <text x="200" y="328" text-anchor="middle" font-size="10" fill="#991b1b">找代码而非理解代码</text>

  <!-- ===== Center: VS circle ===== -->
  <circle cx="400" cy="210" r="22" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">VS</text>

  <!-- ===== Right: CodeGraph (Correct) ===== -->
  <g filter="url(#shadow)">
    <rect x="430" y="70" width="340" height="290" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
  </g>
  <rect x="430" y="70" width="340" height="40" rx="12" fill="url(#greenG)"/>
  <rect x="430" y="90" width="340" height="20" fill="url(#greenG)"/>
  <text x="600" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="white">CodeGraph：知识图谱查询</text>

  <!-- Step 1: tree-sitter parse -->
  <rect x="450" y="125" width="300" height="32" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="145" text-anchor="middle" font-size="11" fill="#047857">tree-sitter 解析 → 构建 21 语言知识图</text>

  <!-- Arrow 1→2 -->
  <line x1="600" y1="157" x2="600" y2="170" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Step 2: MCP tool query -->
  <rect x="450" y="174" width="300" height="32" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="194" text-anchor="middle" font-size="11" fill="#047857">codegraph_context → 一步到位上下文</text>

  <!-- Arrow 2→3 -->
  <line x1="600" y1="206" x2="600" y2="219" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Step 3: graph-based analysis -->
  <rect x="450" y="223" width="300" height="32" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="243" text-anchor="middle" font-size="11" fill="#047857">codegraph_impact → 精确影响范围</text>

  <!-- Advantages -->
  <text x="600" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">优势</text>
  <text x="600" y="296" text-anchor="middle" font-size="10" fill="#047857">3-7 次工具调用，省 57% token</text>
  <text x="600" y="312" text-anchor="middle" font-size="10" fill="#047857">SQLite 持久化，重启即用</text>
  <text x="600" y="328" text-anchor="middle" font-size="10" fill="#047857">本地优先，零外部依赖</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="200" y="370" width="400" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="385" text-anchor="middle" font-size="11" fill="#15803d">从"盲目搜索文本"到"结构化查询图谱"</text>
</svg>