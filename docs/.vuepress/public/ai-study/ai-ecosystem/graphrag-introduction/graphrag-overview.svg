<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="560" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">GraphRAG 架构总览</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">From Local to Global · 知识图谱 + 社区检测 + 层级摘要</text>

  <!-- ===== Phase 1: Indexing (top section) ===== -->
  <!-- Indexing label -->
  <rect x="30" y="65" width="760" height="220" rx="12" fill="white" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="65" width="760" height="32" rx="12" fill="url(#blueG)"/>
  <rect x="30" y="85" width="760" height="12" fill="url(#blueG)"/>
  <text x="410" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="white">索引构建（离线 Indexing）</text>

  <!-- Step 1: Documents & Chunking -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="150" height="75" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  </g>
  <text x="125" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">文档切分</text>
  <text x="125" y="150" text-anchor="middle" font-size="10" fill="#1d4ed8">原始文档</text>
  <text x="125" y="165" text-anchor="middle" font-size="10" fill="#1d4ed8">→ text chunks</text>
  <text x="125" y="178" text-anchor="middle" font-size="9" fill="#64748b">1200 tokens/chunk</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="147" x2="246" y2="147" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 2: Entity & Relationship Extraction -->
  <g filter="url(#shadow)">
    <rect x="250" y="110" width="150" height="75" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  </g>
  <text x="325" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">实体关系抽取</text>
  <text x="325" y="150" text-anchor="middle" font-size="10" fill="#92400e">LLM 提取</text>
  <text x="325" y="165" text-anchor="middle" font-size="10" fill="#92400e">Entity + Relation</text>
  <text x="325" y="178" text-anchor="middle" font-size="9" fill="#64748b">含 gleaning 迭代</text>

  <!-- Arrow 2→3 -->
  <line x1="400" y1="147" x2="446" y2="147" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 3: Knowledge Graph -->
  <g filter="url(#shadow)">
    <rect x="450" y="110" width="150" height="75" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  </g>
  <text x="525" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">知识图谱构建</text>
  <text x="525" y="150" text-anchor="middle" font-size="10" fill="#5b21b6">实体 → 节点</text>
  <text x="525" y="165" text-anchor="middle" font-size="10" fill="#5b21b6">关系 → 边</text>
  <text x="525" y="178" text-anchor="middle" font-size="9" fill="#64748b">实体去重合并</text>

  <!-- Arrow 3→4 -->
  <line x1="600" y1="147" x2="646" y2="147" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 4: Community Detection -->
  <g filter="url(#shadow)">
    <rect x="650" y="110" width="120" height="75" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  </g>
  <text x="710" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">社区检测</text>
  <text x="710" y="150" text-anchor="middle" font-size="10" fill="#92400e">Leiden 算法</text>
  <text x="710" y="165" text-anchor="middle" font-size="10" fill="#92400e">层次化社区</text>
  <text x="710" y="178" text-anchor="middle" font-size="9" fill="#64748b">max_levels=3</text>

  <!-- Arrow down to community reports -->
  <line x1="710" y1="185" x2="710" y2="210" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 5: Community Reports (below, spanning) -->
  <g filter="url(#shadow)">
    <rect x="250" y="214" width="400" height="55" rx="8" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  </g>
  <text x="450" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">社区报告生成（Community Reports）</text>
  <text x="450" y="254" text-anchor="middle" font-size="10" fill="#047857">LLM 为每个社区生成摘要报告 · 从底层逐层向上汇总</text>

  <!-- Arrow from community detection to community reports (L-path) -->
  <path d="M 710 210 L 710 210" stroke="#3b82f6" stroke-width="1.5" fill="none"/>

  <!-- Storage layer -->
  <g filter="url(#shadow)">
    <rect x="250" y="280" width="400" height="0" rx="8" fill="white"/>
  </g>

  <!-- ===== Divider ===== -->
  <line x1="50" y1="300" x2="770" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== Phase 2: Query (bottom section) ===== -->
  <!-- Query label -->
  <text x="410" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">查询检索（在线 Query）</text>

  <!-- User Query -->
  <g filter="url(#shadow)">
    <rect x="310" y="335" width="200" height="40" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <text x="410" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#4338ca">用户查询</text>

  <!-- Arrow down split -->
  <line x1="410" y1="375" x2="410" y2="390" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="200" y1="390" x2="620" y2="390" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="200" y1="390" x2="200" y2="406" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="390" x2="620" y2="406" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Local Search -->
  <g filter="url(#shadow)">
    <rect x="70" y="410" width="260" height="120" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="70" y="410" width="260" height="32" rx="10" fill="url(#violetG)"/>
  <rect x="70" y="430" width="260" height="12" fill="url(#violetG)"/>
  <text x="200" y="431" text-anchor="middle" font-size="13" font-weight="700" fill="white">Local Search</text>
  <text x="200" y="460" text-anchor="middle" font-size="10" fill="#5b21b6">实体匹配 → 邻居扩展</text>
  <text x="200" y="476" text-anchor="middle" font-size="10" fill="#5b21b6">→ 关联文本块 + 社区报告</text>
  <text x="200" y="496" text-anchor="middle" font-size="10" fill="#64748b">适合：具体性/事实型问题</text>
  <text x="200" y="512" text-anchor="middle" font-size="9" fill="#64748b">单次 LLM 调用 · 秒级响应</text>

  <!-- Global Search -->
  <g filter="url(#shadow)">
    <rect x="490" y="410" width="260" height="120" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="490" y="410" width="260" height="32" rx="10" fill="url(#greenG)"/>
  <rect x="490" y="430" width="260" height="12" fill="url(#greenG)"/>
  <text x="620" y="431" text-anchor="middle" font-size="13" font-weight="700" fill="white">Global Search</text>
  <text x="620" y="460" text-anchor="middle" font-size="10" fill="#047857">社区报告匹配 → Map</text>
  <text x="620" y="476" text-anchor="middle" font-size="10" fill="#047857">→ 中间回答 Reduce 汇总</text>
  <text x="620" y="496" text-anchor="middle" font-size="10" fill="#64748b">适合：全局性/总结型问题</text>
  <text x="620" y="512" text-anchor="middle" font-size="9" fill="#64748b">多次 LLM 调用 · Map-Reduce</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="210" y="540" width="400" height="0" rx="11" fill="#f0fdf4"/>
</svg>
