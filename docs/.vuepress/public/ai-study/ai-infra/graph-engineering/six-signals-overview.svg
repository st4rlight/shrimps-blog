<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="640" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">什么时候你真的需要 Graph Engineering？</text>
  <text x="410" y="50" text-anchor="middle" font-size="12" fill="#94a3b8">六大信号——出现这些信号时，Graph 开始真正有价值</text>

  <!-- ===== Center decision circle ===== -->
  <circle cx="410" cy="340" r="72" fill="white" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="410" cy="340" r="72" fill="url(#violetG)" opacity="0.1"/>
  <text x="410" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">需要</text>
  <text x="410" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">Graph?</text>

  <!-- ===== Signal 1: Top-left — 职责分化 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="220" height="90" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="220" height="26" rx="10" fill="url(#blueG)"/>
  <rect x="30" y="94" width="220" height="12" fill="url(#blueG)"/>
  <text x="40" y="98" font-size="11" font-weight="700" fill="white">信号一 · 职责分化</text>
  <text x="140" y="130" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">一个 Agent 不适合</text>
  <text x="140" y="144" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">对整个任务负责</text>
  <text x="140" y="162" text-anchor="middle" font-size="9" fill="#94a3b8">研究 → 撰稿 → 审稿</text>
  <!-- Connector to center -->
  <line x1="250" y1="170" x2="350" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== Signal 2: Top-center — 并行依赖 ===== -->
  <g filter="url(#shadow)">
    <rect x="300" y="80" width="220" height="90" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="300" y="80" width="220" height="26" rx="10" fill="url(#greenG)"/>
  <rect x="300" y="94" width="220" height="12" fill="url(#greenG)"/>
  <text x="310" y="98" font-size="11" font-weight="700" fill="white">信号二 · 并行依赖</text>
  <text x="410" y="130" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">任务中出现真正的</text>
  <text x="410" y="144" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">并行与依赖</text>
  <text x="410" y="162" text-anchor="middle" font-size="9" fill="#94a3b8">同时分析 10 个竞品</text>
  <line x1="410" y1="170" x2="410" y2="268" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== Signal 3: Top-right — 资源隔离 ===== -->
  <g filter="url(#shadow)">
    <rect x="570" y="80" width="220" height="90" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="570" y="80" width="220" height="26" rx="10" fill="url(#amberG)"/>
  <rect x="570" y="94" width="220" height="12" fill="url(#amberG)"/>
  <text x="580" y="98" font-size="11" font-weight="700" fill="white">信号三 · 资源隔离</text>
  <text x="680" y="130" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">不同步骤需要不同</text>
  <text x="680" y="144" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">模型、工具和权限</text>
  <text x="680" y="162" text-anchor="middle" font-size="9" fill="#94a3b8">免费模型 vs 最强大模型</text>
  <line x1="570" y1="170" x2="470" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== Signal 4: Bottom-left — 可审计性 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="510" width="220" height="90" rx="10" fill="white" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <rect x="30" y="510" width="220" height="26" rx="10" fill="url(#cyanG)"/>
  <rect x="30" y="524" width="220" height="12" fill="url(#cyanG)"/>
  <text x="40" y="528" font-size="11" font-weight="700" fill="white">信号四 · 可审计性</text>
  <text x="140" y="560" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">需要高确定性、</text>
  <text x="140" y="574" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">可审计的控制流</text>
  <text x="140" y="592" text-anchor="middle" font-size="9" fill="#94a3b8">金融、医疗、通讯</text>
  <line x1="250" y1="510" x2="350" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== Signal 5: Bottom-center — 独立验证 ===== -->
  <g filter="url(#shadow)">
    <rect x="300" y="510" width="220" height="90" rx="10" fill="white" stroke="#f43f5e" stroke-width="2"/>
  </g>
  <rect x="300" y="510" width="220" height="26" rx="10" fill="url(#roseG)"/>
  <rect x="300" y="524" width="220" height="12" fill="url(#roseG)"/>
  <text x="310" y="528" font-size="11" font-weight="700" fill="white">信号五 · 独立验证</text>
  <text x="410" y="560" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">执行与验证</text>
  <text x="410" y="574" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">必须独立</text>
  <text x="410" y="592" text-anchor="middle" font-size="9" fill="#94a3b8">代码审查、质量把关</text>
  <line x1="410" y1="510" x2="410" y2="412" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== Signal 6: Bottom-right — 持久化恢复 ===== -->
  <g filter="url(#shadow)">
    <rect x="570" y="510" width="220" height="90" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="570" y="510" width="220" height="26" rx="10" fill="url(#violetG)"/>
  <rect x="570" y="524" width="220" height="12" fill="url(#violetG)"/>
  <text x="580" y="528" font-size="11" font-weight="700" fill="white">信号六 · 持久化恢复</text>
  <text x="680" y="560" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">任务中途涉及</text>
  <text x="680" y="574" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">暂停和恢复</text>
  <text x="680" y="592" text-anchor="middle" font-size="9" fill="#94a3b8">人工审批、断点续跑</text>
  <line x1="570" y1="510" x2="470" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== Bottom tip ===== -->
  <rect x="150" y="612" width="520" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="627" text-anchor="middle" font-size="11" fill="#15803d">💡 目标单一、可验证器闭环、无并行需要的任务 → 不需要 Graph</text>
</svg>
