<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="400" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">知识图谱构建流程</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">从本体设计到质量校验的四阶段流水线</text>

  <!-- ===== 4 Pipeline stages ===== -->

  <!-- Stage 1: 本体设计 -->
  <g filter="url(#shadow)">
    <rect x="30" y="85" width="160" height="180" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="30" y="85" width="160" height="35" rx="10" fill="url(#violetG)"/>
  <rect x="30" y="100" width="160" height="20" fill="url(#violetG)"/>
  <text x="110" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="white">Step 1</text>
  <text x="110" y="123" text-anchor="middle" font-size="11" fill="white">本体设计</text>

  <text x="110" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Ontology</text>
  <text x="45" y="168" font-size="9" fill="#64748b">• 实体类型定义</text>
  <text x="45" y="184" font-size="9" fill="#64748b">• 关系类型定义</text>
  <text x="45" y="200" font-size="9" fill="#64748b">• 属性约束</text>
  <text x="45" y="216" font-size="9" fill="#64748b">• 层级结构</text>
  <text x="45" y="240" font-size="9" fill="#64748b">工具: Protégé</text>
  <text x="45" y="256" font-size="9" fill="#64748b">原则: 够用就好</text>

  <!-- Arrow S1→S2 -->
  <line x1="190" y1="175" x2="206" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: 实体抽取 -->
  <g filter="url(#shadow)">
    <rect x="210" y="85" width="160" height="180" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="210" y="85" width="160" height="35" rx="10" fill="url(#blueG)"/>
  <rect x="210" y="100" width="160" height="20" fill="url(#blueG)"/>
  <text x="290" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="white">Step 2</text>
  <text x="290" y="123" text-anchor="middle" font-size="11" fill="white">实体抽取与链接</text>

  <text x="290" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Extraction</text>
  <text x="225" y="168" font-size="9" fill="#64748b">• 结构化数据: ETL</text>
  <text x="225" y="184" font-size="9" fill="#64748b">• 半结构化: 规则</text>
  <text x="225" y="200" font-size="9" fill="#64748b">• 非结构化: NER</text>
  <text x="225" y="216" font-size="9" fill="#64748b">• LLM 端到端抽取</text>
  <text x="225" y="240" font-size="9" fill="#64748b">工具: SpaCy, LLM</text>
  <text x="225" y="256" font-size="9" fill="#64748b">关联: GraphRAG</text>

  <!-- Arrow S2→S3 -->
  <line x1="370" y1="175" x2="386" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: 关系抽取与消歧 -->
  <g filter="url(#shadow)">
    <rect x="390" y="85" width="160" height="180" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="390" y="85" width="160" height="35" rx="10" fill="url(#greenG)"/>
  <rect x="390" y="100" width="160" height="20" fill="url(#greenG)"/>
  <text x="470" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="white">Step 3</text>
  <text x="470" y="123" text-anchor="middle" font-size="11" fill="white">关系抽取与消歧</text>

  <text x="470" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Disambiguation</text>
  <text x="405" y="168" font-size="9" fill="#64748b">• 字符串相似度</text>
  <text x="405" y="184" font-size="9" fill="#64748b">• 上下文 embedding</text>
  <text x="405" y="200" font-size="9" fill="#64748b">• 图结构一致性</text>
  <text x="405" y="216" font-size="9" fill="#64748b">• LLM 辅助判断</text>
  <text x="405" y="240" font-size="9" fill="#64748b">目标: 实体链接</text>
  <text x="405" y="256" font-size="9" fill="#64748b">消除歧义</text>

  <!-- Arrow S3→S4 -->
  <line x1="550" y1="175" x2="566" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: 质量校验 -->
  <g filter="url(#shadow)">
    <rect x="570" y="85" width="160" height="180" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="570" y="85" width="160" height="35" rx="10" fill="url(#amberG)"/>
  <rect x="570" y="100" width="160" height="20" fill="url(#amberG)"/>
  <text x="650" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="white">Step 4</text>
  <text x="650" y="123" text-anchor="middle" font-size="11" fill="white">质量校验</text>

  <text x="650" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Quality</text>
  <text x="585" y="168" font-size="9" fill="#64748b">• 完整性检查</text>
  <text x="585" y="184" font-size="9" fill="#64748b">• 一致性验证</text>
  <text x="585" y="200" font-size="9" fill="#64748b">• 准确性抽样</text>
  <text x="585" y="216" font-size="9" fill="#64748b">• 时效性检测</text>
  <text x="585" y="240" font-size="9" fill="#64748b">方法: 规则+推理</text>
  <text x="585" y="256" font-size="9" fill="#64748b">人工校验</text>

  <!-- ===== Output arrow ===== -->
  <line x1="650" y1="265" x2="650" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Output: Knowledge Graph ===== -->
  <g filter="url(#shadow)">
    <rect x="200" y="295" width="440" height="50" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="420" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">📊 知识图谱</text>
  <text x="420" y="335" text-anchor="middle" font-size="10" fill="#64748b">实体 · 关系 · 属性 · 本体 → 支撑下游应用</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="365" width="540" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#15803d">💡 传统 KG 工程化与 GraphRAG 互补——精度 vs 自动化</text>
</svg>
