<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="480" rx="16" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">NameServer vs ZooKeeper 架构对比</text>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">CP 强一致 vs AP 最终一致 — 消息中间件注册中心的架构抉择</text>

  <!-- ===== Left: ZooKeeper (CP) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="85" width="350" height="340" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="30" y="85" width="350" height="42" rx="12" fill="url(#redG)"/>
  <rect x="30" y="107" width="350" height="20" fill="url(#redG)"/>
  <text x="205" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="white">ZooKeeper</text>
  <text x="205" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">CP 模型 — 强一致性</text>

  <!-- ZK features -->
  <rect x="50" y="165" width="310" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="205" y="184" text-anchor="middle" font-size="11" fill="#991b1b">重量级：ZAB 协议 + Watcher + 树状数据结构</text>

  <rect x="50" y="200" width="310" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="205" y="219" text-anchor="middle" font-size="11" fill="#991b1b">需独立集群（≥3 节点过半确认）</text>

  <rect x="50" y="235" width="310" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="205" y="254" text-anchor="middle" font-size="11" fill="#991b1b">写入延迟高：需 Leader → Follower 同步</text>

  <rect x="50" y="270" width="310" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="205" y="289" text-anchor="middle" font-size="11" fill="#991b1b">运维复杂：需监控 ZK 集群本身</text>

  <rect x="50" y="305" width="310" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="205" y="324" text-anchor="middle" font-size="11" fill="#92400e">✅ 强一致：所有节点数据严格一致</text>

  <rect x="50" y="340" width="310" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="205" y="359" text-anchor="middle" font-size="11" fill="#92400e">✅ Watcher 推送：实时感知变化</text>

  <rect x="50" y="375" width="310" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="205" y="394" text-anchor="middle" font-size="11" fill="#92400e">✅ 防脑裂：ZAB 协议保证</text>

  <!-- ===== Right: NameServer (AP) ===== -->
  <g filter="url(#shadow)">
    <rect x="420" y="85" width="350" height="340" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="420" y="85" width="350" height="42" rx="12" fill="url(#greenG)"/>
  <rect x="420" y="107" width="350" height="20" fill="url(#greenG)"/>
  <text x="595" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="white">NameServer</text>
  <text x="595" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">AP 模型 — 最终一致性</text>

  <!-- NS features -->
  <rect x="440" y="165" width="310" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="595" y="184" text-anchor="middle" font-size="11" fill="#047857">极简：HashMap + 定时任务（&lt;2000 行）</text>

  <rect x="440" y="200" width="310" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="595" y="219" text-anchor="middle" font-size="11" fill="#047857">可独立/混部，无状态重启即恢复</text>

  <rect x="440" y="235" width="310" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="595" y="254" text-anchor="middle" font-size="11" fill="#047857">内存操作极快，无同步开销</text>

  <rect x="440" y="270" width="310" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="595" y="289" text-anchor="middle" font-size="11" fill="#047857">节点间互不通信，Broker 向所有节点注册</text>

  <rect x="440" y="305" width="310" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="595" y="324" text-anchor="middle" font-size="11" fill="#92400e">⚠️ 短暂不一致：最多 30s+120s 延迟</text>

  <rect x="440" y="340" width="310" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="595" y="359" text-anchor="middle" font-size="11" fill="#92400e">⚠️ Pull 模式：客户端定时拉取</text>

  <rect x="440" y="375" width="310" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="595" y="394" text-anchor="middle" font-size="11" fill="#047857">✅ 重试兜底：发送/消费失败自动重试</text>

  <!-- ===== VS circle ===== -->
  <circle cx="400" cy="255" r="30" fill="white" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">VS</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="120" y="440" width="560" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="459" text-anchor="middle" font-size="11" fill="#15803d">💡 消息中间件场景：路由短暂不一致可容忍，简单+低运维成本更重要</text>
</svg>
