<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Akka Cluster 与 Sharding 总览</text>
  Cluster：节点通过 Gossip 协议组成逻辑集群  |  Sharding：Actor 自动分散到各节点

  <!-- ===== Cluster boundary ===== -->
  <rect x="40" y="60" width="740" height="280" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="60" y="82" font-size="11" font-weight="600" fill="#64748b">Akka Cluster（逻辑集群）</text>

  <!-- Gossip lines between nodes -->
  <line x1="200" y1="160" x2="340" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="160" x2="270" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="390" y1="160" x2="530" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="390" y1="160" x2="320" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="580" y1="160" x2="510" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="320" y1="280" x2="510" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Gossip label -->
  <rect x="380" y="130" width="60" height="18" rx="9" fill="#f1f5f9"/>
  <text x="410" y="143" text-anchor="middle" font-size="8" fill="#64748b">Gossip 协议</text>

  <!-- ===== Node 1: Seed + Gateway ===== -->
  <g filter="url(#shadow)" transform="translate(110, 95)">
    <rect x="0" y="0" width="170" height="80" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="110" y="95" width="170" height="36" rx="12" fill="url(#blueG)"/>
  <rect x="110" y="113" width="170" height="18" fill="url(#blueG)"/>
  <text x="195" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="white">Node 1 (Seed)</text>
  <text x="195" y="148" text-anchor="middle" font-size="10" fill="#64748b">RPC Gateway · WebSocket</text>
  <text x="195" y="163" text-anchor="middle" font-size="9" fill="#64748b">接收用户连接 · 路由消息</text>

  <!-- ===== Node 2: Session Worker ===== -->
  <g filter="url(#shadow)" transform="translate(295, 95)">
    <rect x="0" y="0" width="170" height="80" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="295" y="95" width="170" height="36" rx="12" fill="url(#greenG)"/>
  <rect x="295" y="113" width="170" height="18" fill="url(#greenG)"/>
  <text x="380" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="white">Node 2</text>
  <text x="380" y="148" text-anchor="middle" font-size="10" fill="#64748b">Session Worker</text>
  <text x="380" y="163" text-anchor="middle" font-size="9" fill="#64748b">运行 Session Actor · 处理业务</text>

  <!-- Shards in Node 2 -->
  <rect x="305" y="180" width="50" height="20" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="330" y="194" text-anchor="middle" font-size="8" fill="#047857">Shard-01</text>
  <rect x="360" y="180" width="50" height="20" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="385" y="194" text-anchor="middle" font-size="8" fill="#047857">Shard-02</text>
  <rect x="415" y="180" width="50" height="20" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="440" y="194" text-anchor="middle" font-size="8" fill="#047857">Shard-03</text>

  <!-- ===== Node 3: Session Worker ===== -->
  <g filter="url(#shadow)" transform="translate(480, 95)">
    <rect x="0" y="0" width="170" height="80" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="480" y="95" width="170" height="36" rx="12" fill="url(#violetG)"/>
  <rect x="480" y="113" width="170" height="18" fill="url(#violetG)"/>
  <text x="565" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="white">Node 3</text>
  <text x="565" y="148" text-anchor="middle" font-size="10" fill="#64748b">Session Worker</text>
  <text x="565" y="163" text-anchor="middle" font-size="9" fill="#64748b">运行 Session Actor · 热备</text>

  <!-- Shards in Node 3 -->
  <rect x="490" y="180" width="50" height="20" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="515" y="194" text-anchor="middle" font-size="8" fill="#5b21b6">Shard-04</text>
  <rect x="545" y="180" width="50" height="20" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="570" y="194" text-anchor="middle" font-size="8" fill="#5b21b6">Shard-05</text>

  <!-- ===== Sharding Logic ===== -->
  <g filter="url(#shadow)" transform="translate(110, 215)">
    <rect x="0" y="0" width="540" height="55" rx="12" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="130" y="235" font-size="11" font-weight="600" fill="#92400e">Shard Region（分片路由逻辑）</text>

  <!-- Sharding flow -->
  <g transform="translate(130, 242)">
    <rect x="0" y="0" width="70" height="22" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" font-size="8" fill="#92400e">sessionId</text>
    <line x1="70" y1="11" x2="90" y2="11" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="90" y="0" width="80" height="22" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="130" y="15" text-anchor="middle" font-size="8" fill="#92400e">hash(id)%N</text>
    <line x1="170" y1="11" x2="190" y2="11" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="190" y="0" width="80" height="22" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="230" y="15" text-anchor="middle" font-size="8" fill="#92400e">Shard ID</text>
    <line x1="270" y1="11" x2="290" y2="11" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="290" y="0" width="120" height="22" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
    <text x="350" y="15" text-anchor="middle" font-size="8" fill="#047857">分配到目标节点</text>
  </g>

  <!-- ===== Message routing arrows from Gateway ===== -->
  <line x1="195" y1="175" x2="195" y2="195" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowB)"/>
  <text x="200" y="192" font-size="8" fill="#3b82f6">路由</text>

  <!-- ===== Bottom: Key Concepts ===== -->
  <text x="60" y="365" font-size="12" font-weight="600" fill="#475569">集群核心概念</text>

  <!-- Concept 1 -->
  <g transform="translate(60, 378)">
    <rect x="0" y="0" width="165" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="82" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">Seed Node</text>
    <text x="82" y="34" text-anchor="middle" fill="#64748b">集群启动的第一个节点</text>
    <text x="82" y="49" text-anchor="middle" fill="#64748b">其他节点通过它加入</text>
  </g>

  <!-- Concept 2 -->
  <g transform="translate(240, 378)">
    <rect x="0" y="0" width="165" height="60" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="82" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">Shard（分片）</text>
    <text x="82" y="34" text-anchor="middle" fill="#64748b">将 Actor 分组管理</text>
    <text x="82" y="49" text-anchor="middle" fill="#64748b">每个 Shard 是一个分片</text>
  </g>

  <!-- Concept 3 -->
  <g transform="translate(420, 378)">
    <rect x="0" y="0" width="165" height="60" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="82" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Rebalance（再平衡）</text>
    <text x="82" y="34" text-anchor="middle" fill="#64748b">节点增减时自动迁移</text>
    <text x="82" y="49" text-anchor="middle" fill="#64748b">Shard 自动重新分配</text>
  </g>

  <!-- Concept 4 -->
  <g transform="translate(600, 378)">
    <rect x="0" y="0" width="165" height="60" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
    <text x="82" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">故障转移</text>
    <text x="82" y="34" text-anchor="middle" fill="#64748b">节点宕机时 Shard</text>
    <text x="82" y="49" text-anchor="middle" fill="#64748b">自动迁移到健康节点</text>
  </g>

  <!-- Bottom tip -->
  <rect x="130" y="460" width="560" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="477" text-anchor="middle" font-size="11" fill="#15803d">💡 Cluster Sharding 实现了 Actor 的自动分布 —— 对外透明，系统自动处理路由和迁移</text>
</svg>
