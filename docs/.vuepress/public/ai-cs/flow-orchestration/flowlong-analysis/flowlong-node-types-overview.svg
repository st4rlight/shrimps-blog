<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="400" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">FlowLong 五种节点类型总览</text>
  <text x="410" y="55" text-anchor="middle" font-size="11" fill="#94a3b8">用 JSON 描述流程，5 种节点覆盖审批全场景</text>

  <!-- Node 1: 开始节点 -->
  <g filter="url(#shadow)">
    <rect x="30" y="90" width="140" height="100" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="30" y="90" width="140" height="34" rx="10" fill="url(#indigoG)"/>
  <rect x="30" y="110" width="140" height="14" fill="url(#indigoG)"/>
  <text x="100" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="white">开始节点</text>
  <text x="100" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#6366f1">nodeType = 0</text>
  <text x="100" y="150" text-anchor="middle" font-size="10" fill="#475569">流程入口</text>
  <text x="100" y="166" text-anchor="middle" font-size="10" fill="#475569">每个流程仅一个</text>
  <text x="100" y="180" text-anchor="middle" font-size="10" fill="#64748b">nextNodeCode</text>

  <!-- Arrow 1→2 -->
  <line x1="175" y1="140" x2="195" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: 审批节点 -->
  <g filter="url(#shadow)">
    <rect x="200" y="90" width="140" height="100" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="200" y="90" width="140" height="34" rx="10" fill="url(#blueG)"/>
  <rect x="200" y="110" width="140" height="14" fill="url(#blueG)"/>
  <text x="270" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="white">审批节点</text>
  <text x="270" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#3b82f6">nodeType = 1</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#475569">人工审批（核心）</text>
  <text x="270" y="166" text-anchor="middle" font-size="10" fill="#475569">串行/并行/会签/或签</text>
  <text x="270" y="180" text-anchor="middle" font-size="10" fill="#64748b">permissionList</text>

  <!-- Arrow 2→3 -->
  <line x1="345" y1="140" x2="365" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: 条件节点 -->
  <g filter="url(#shadow)">
    <rect x="370" y="90" width="140" height="100" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="370" y="90" width="140" height="34" rx="10" fill="url(#amberG)"/>
  <rect x="370" y="110" width="140" height="14" fill="url(#amberG)"/>
  <text x="440" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="white">条件节点</text>
  <text x="440" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">nodeType = 4</text>
  <text x="440" y="150" text-anchor="middle" font-size="10" fill="#475569">动态分支路由</text>
  <text x="440" y="166" text-anchor="middle" font-size="10" fill="#475569">表达式匹配</text>
  <text x="440" y="180" text-anchor="middle" font-size="10" fill="#64748b">conditionList</text>

  <!-- Arrow 3→4 -->
  <line x1="515" y1="140" x2="535" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4: 抄送节点 -->
  <g filter="url(#shadow)">
    <rect x="540" y="90" width="140" height="100" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="540" y="90" width="140" height="34" rx="10" fill="url(#greenG)"/>
  <rect x="540" y="110" width="140" height="14" fill="url(#greenG)"/>
  <text x="610" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="white">抄送节点</text>
  <text x="610" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">nodeType = 2</text>
  <text x="610" y="150" text-anchor="middle" font-size="10" fill="#475569">仅通知，不审批</text>
  <text x="610" y="166" text-anchor="middle" font-size="10" fill="#475569">自动完成流转</text>
  <text x="610" y="180" text-anchor="middle" font-size="10" fill="#64748b">flw_copy_task</text>

  <!-- Arrow 4→5 -->
  <line x1="685" y1="140" x2="705" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 5: 结束节点 -->
  <g filter="url(#shadow)">
    <rect x="710" y="90" width="80" height="100" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="710" y="90" width="80" height="34" rx="10" fill="url(#violetG)"/>
  <rect x="710" y="110" width="80" height="14" fill="url(#violetG)"/>
  <text x="750" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="white">结束</text>
  <text x="750" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#8b5cf6">type = 3</text>
  <text x="750" y="150" text-anchor="middle" font-size="10" fill="#475569">流程出口</text>
  <text x="750" y="166" text-anchor="middle" font-size="10" fill="#475569">实例完成</text>

  <!-- Example flow section -->
  <text x="410" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">典型流程示例</text>

  <!-- Example flow boxes -->
  <rect x="60" y="245" width="90" height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="105" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#4f46e5">开始</text>

  <line x1="155" y1="261" x2="175" y2="261" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="245" width="100" height="32" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="230" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">主管审批</text>

  <line x1="285" y1="261" x2="305" y2="261" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond for condition -->
  <polygon points="355,245 410,261 355,277 300,261" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="355" y="265" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">条件判断</text>

  <line x1="410" y1="261" x2="430" y2="261" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="435" y="245" width="100" height="32" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="485" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">总监审批</text>

  <line x1="540" y1="261" x2="560" y2="261" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="565" y="245" width="90" height="32" rx="16" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="610" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">抄送HR</text>

  <line x1="660" y1="261" x2="680" y2="261" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="685" y="245" width="80" height="32" rx="16" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="725" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">结束</text>

  <!-- Condition branches -->
  <text x="355" y="298" text-anchor="middle" font-size="9" fill="#64748b">days > 3 → 总监审批</text>
  <text x="355" y="312" text-anchor="middle" font-size="9" fill="#64748b">days ≤ 3 → 抄送HR</text>

  <!-- Bottom info -->
  <rect x="80" y="338" width="660" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="357" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">关键字段</text>
  <text x="410" y="374" text-anchor="middle" font-size="10" fill="#64748b">nodeType（类型） · nodeCode（编码） · permissionList（审批人） · conditionList（条件分支） · nodeRatio（会签比例）</text>
</svg>
