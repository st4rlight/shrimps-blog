<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="780" height="440" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">传统方式 vs 事件溯源（Event Sourcing）</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">状态覆盖写 vs 事件追加写 —— Akka Persistence 的核心思想</text>

  <!-- ===== Left: Traditional ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="75" width="340" height="340" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="30" y="75" width="340" height="46" rx="12" fill="url(#redG)"/>
  <rect x="30" y="99" width="340" height="22" fill="url(#redG)"/>
  <text x="200" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">传统方式：状态覆盖写</text>

  <!-- State box: x=100, y=138, w=200, h=40 → bottom=178 -->
  <rect x="100" y="138" width="200" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">State（当前状态）</text>

  <!-- DB box: x=100, y=210, w=200, h=40 → top=210 -->
  <rect x="100" y="210" width="200" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Database</text>

  <!-- Overwrite arrow: State bottom(178) → DB top(210) - 4px = 206 -->
  <line x1="200" y1="178" x2="200" y2="206" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="193" text-anchor="middle" font-size="10" fill="#ef4444">覆盖写</text>

  <!-- Update flow: g translate(50, 268) -->
  <g transform="translate(50, 268)">
    <!-- S0: x=0, w=28 → right=28 -->
    <rect x="0" y="0" width="28" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="14" y="15" text-anchor="middle" font-size="8" fill="#991b1b">S0</text>
    <!-- Arrow: x1=28 → x2=46 (target left=50, 50-4=46) -->
    <line x1="28" y1="11" x2="46" y2="11" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- S1: x=50, w=28 → right=78 -->
    <rect x="50" y="0" width="28" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="64" y="15" text-anchor="middle" font-size="8" fill="#991b1b">S1</text>
    <!-- Arrow: x1=78 → x2=96 (target left=100, 100-4=96) -->
    <line x1="78" y1="11" x2="96" y2="11" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- S2: x=100, w=28 → right=128 -->
    <rect x="100" y="0" width="28" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="114" y="15" text-anchor="middle" font-size="8" fill="#991b1b">S2</text>
    <!-- Arrow: x1=128 → x2=146 (target left=150, 150-4=146) -->
    <line x1="128" y1="11" x2="146" y2="11" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- S3: x=150, w=28 -->
    <rect x="150" y="0" width="28" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="164" y="15" text-anchor="middle" font-size="8" fill="#991b1b">S3</text>
  </g>
  <text x="200" y="305" text-anchor="middle" font-size="9" fill="#64748b">每次更新覆盖旧状态，历史丢失</text>

  <!-- Problems -->
  <line x1="50" y1="320" x2="350" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">局限</text>
  <g transform="translate(50, 348)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="10" fill="#64748b">无法追溯历史状态</text>
  </g>
  <g transform="translate(50, 368)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="10" fill="#64748b">无法审计操作记录</text>
  </g>
  <g transform="translate(50, 388)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="10" fill="#64748b">状态损坏后无法恢复</text>
  </g>

  <!-- VS circle -->
  <circle cx="390" cy="235" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="390" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">VS</text>

  <!-- ===== Right: Event Sourcing ===== -->
  <g filter="url(#shadow)">
    <rect x="410" y="75" width="340" height="340" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="410" y="75" width="340" height="46" rx="12" fill="url(#greenG)"/>
  <rect x="410" y="99" width="340" height="22" fill="url(#greenG)"/>
  <text x="580" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">事件溯源：事件追加写</text>

  <!-- Event Store: x=450, y=138, w=260, h=40 -->
  <rect x="450" y="138" width="260" height="40" rx="8" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="580" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">Event Store（事件日志）</text>

  <!-- Events: g translate(440, 190) -->
  <g transform="translate(440, 190)">
    <!-- Event1: x=0, w=50 → right=50 -->
    <rect x="0" y="0" width="50" height="28" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
    <text x="25" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#047857">Event1</text>
    <!-- Arrow: x1=50 → x2=66 (target left=70, 70-4=66) -->
    <line x1="50" y1="14" x2="66" y2="14" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <!-- Event2: x=70, w=50 → right=120 -->
    <rect x="70" y="0" width="50" height="28" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
    <text x="95" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#047857">Event2</text>
    <!-- Arrow: x1=120 → x2=136 (target left=140, 140-4=136) -->
    <line x1="120" y1="14" x2="136" y2="14" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <!-- Event3: x=140, w=50 → right=190 -->
    <rect x="140" y="0" width="50" height="28" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
    <text x="165" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#047857">Event3</text>
    <!-- Arrow: x1=190 → x2=206 (target left=210, 210-4=206) -->
    <line x1="190" y1="14" x2="206" y2="14" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <!-- Event4: x=210, w=50 -->
    <rect x="210" y="0" width="50" height="28" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
    <text x="235" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#047857">Event4</text>
  </g>
  <text x="580" y="232" text-anchor="middle" font-size="9" fill="#64748b">只追加，不修改，完整历史</text>

  <!-- Replay to get state: x=450, y=248, w=260, h=36 -->
  <rect x="450" y="248" width="260" height="36" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text x="580" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">重放事件 → 重建当前状态</text>

  <!-- State derivation: g translate(460, 296) -->
  <g transform="translate(460, 296)">
    <!-- SA: x=0, w=40 → right=40 -->
    <rect x="0" y="0" width="40" height="22" rx="4" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="20" y="15" text-anchor="middle" font-size="8" fill="#047857">SA</text>
    <!-- Arrow: x1=40 → x2=56 (target left=60, 60-4=56) -->
    <line x1="40" y1="11" x2="56" y2="11" stroke="#10b981" stroke-width="1" marker-end="url(#arrowG)"/>
    <!-- SB: x=60, w=40 → right=100 -->
    <rect x="60" y="0" width="40" height="22" rx="4" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="80" y="15" text-anchor="middle" font-size="8" fill="#047857">SB</text>
    <!-- Arrow: x1=100 → x2=116 (target left=120, 120-4=116) -->
    <line x1="100" y1="11" x2="116" y2="11" stroke="#10b981" stroke-width="1" marker-end="url(#arrowG)"/>
    <!-- SC: x=120, w=40 → right=160 -->
    <rect x="120" y="0" width="40" height="22" rx="4" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="140" y="15" text-anchor="middle" font-size="8" fill="#047857">SC</text>
    <!-- Arrow: x1=160 → x2=176 (target left=180, 180-4=176) -->
    <line x1="160" y1="11" x2="176" y2="11" stroke="#10b981" stroke-width="1" marker-end="url(#arrowG)"/>
    <!-- SD: x=180, w=40 -->
    <rect x="180" y="0" width="40" height="22" rx="4" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <text x="200" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="white">SD</text>
  </g>
  <text x="580" y="332" text-anchor="middle" font-size="9" fill="#64748b">当前状态 = fold(所有事件)</text>

  <!-- Advantages -->
  <line x1="430" y1="348" x2="730" y2="348" stroke="#e2e8f0" stroke-width="1"/>
  <text x="580" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">优势</text>
  <g transform="translate(430, 376)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="10" fill="#64748b">完整审计日志，可追溯任意时刻</text>
  </g>
  <g transform="translate(430, 396)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="10" fill="#64748b">Actor 崩溃后可重放恢复状态</text>
  </g>
  <g transform="translate(430, 416)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="10" fill="#64748b">时间旅行：重放到任意历史点</text>
  </g>
</svg>
