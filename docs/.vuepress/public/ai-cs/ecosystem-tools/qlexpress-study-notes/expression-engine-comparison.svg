<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">主流表达式引擎对比</text>
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">从性能、语法风格、控制流支持、生态等维度横向比较</text>

  <!-- ===== QLExpress (highlighted) ===== -->
  <g filter="url(#shadow)" transform="translate(30, 75)">
    <rect x="0" y="0" width="230" height="160" rx="12" fill="white" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <rect x="30" y="75" width="230" height="38" rx="12" fill="url(#amberG)"/>
  <rect x="30" y="95" width="230" height="18" fill="url(#amberG)"/>
  <text x="145" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="white">QLExpress ⭐</text>

  <g transform="translate(45, 125)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#92400e">出品方：阿里巴巴</text>
    <text x="0" y="18" font-size="11" fill="#64748b">语法：类 Java</text>
    <text x="0" y="34" font-size="11" fill="#64748b">性能：高</text>
    <text x="0" y="50" font-size="11" fill="#64748b">控制流：✓ if/for/while</text>
    <text x="0" y="66" font-size="11" fill="#64748b">函数定义：✓ 自定义函数</text>
    <text x="0" y="82" font-size="11" fill="#64748b">沙箱安全：✓ 白名单/黑名单</text>
    <text x="0" y="98" font-size="11" fill="#10b981" font-weight="600">优势：双11验证 · 学习成本最低</text>
  </g>

  <!-- ===== Aviator ===== -->
  <g filter="url(#shadow)" transform="translate(280, 75)">
    <rect x="0" y="0" width="230" height="160" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="280" y="75" width="230" height="38" rx="12" fill="url(#greenG)"/>
  <rect x="280" y="95" width="230" height="18" fill="url(#greenG)"/>
  <text x="395" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="white">Aviator</text>

  <g transform="translate(295, 125)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#047857">出品方：淘宝 (dennis)</text>
    <text x="0" y="18" font-size="11" fill="#64748b">语法：函数式</text>
    <text x="0" y="34" font-size="11" fill="#64748b">性能：极高（编译字节码）</text>
    <text x="0" y="50" font-size="11" fill="#64748b">控制流：✗ 纯表达式</text>
    <text x="0" y="66" font-size="11" fill="#64748b">函数定义：✓ 内置/自定义</text>
    <text x="0" y="82" font-size="11" fill="#64748b">沙箱安全：有限</text>
    <text x="0" y="98" font-size="11" fill="#10b981" font-weight="600">优势：性能最优 · 适合纯计算</text>
  </g>

  <!-- ===== MVEL ===== -->
  <g filter="url(#shadow)" transform="translate(530, 75)">
    <rect x="0" y="0" width="260" height="160" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="530" y="75" width="260" height="38" rx="12" fill="url(#blueG)"/>
  <rect x="530" y="95" width="260" height="18" fill="url(#blueG)"/>
  <text x="660" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="white">MVEL</text>

  <g transform="translate(545, 125)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#1d4ed8">出品方：Mike Brock</text>
    <text x="0" y="18" font-size="11" fill="#64748b">语法：类 Java</text>
    <text x="0" y="34" font-size="11" fill="#64748b">性能：中（运行时字节码生成）</text>
    <text x="0" y="50" font-size="11" fill="#64748b">控制流：✓ if/for</text>
    <text x="0" y="66" font-size="11" fill="#64748b">函数定义：✓</text>
    <text x="0" y="82" font-size="11" fill="#64748b">沙箱安全：有限</text>
    <text x="0" y="98" font-size="11" fill="#3b82f6" font-weight="600">优势：功能全面 · 社区成熟</text>
  </g>

  <!-- ===== Bottom row: SpEL / JEXL / Janino ===== -->
  <g filter="url(#shadow)" transform="translate(30, 255)">
    <rect x="0" y="0" width="245" height="70" rx="10" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <rect x="30" y="255" width="245" height="28" rx="10" fill="url(#violetG)"/>
  <rect x="30" y="269" width="245" height="14" fill="url(#violetG)"/>
  <text x="152" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="white">SpEL (Spring)</text>
  <text x="45" y="300" font-size="10" fill="#64748b">Spring 生态原生 · 类 EL 语法</text>
  <text x="45" y="316" font-size="10" fill="#8b5cf6">适合 Spring Boot 应用内嵌使用</text>

  <g filter="url(#shadow)" transform="translate(290, 255)">
    <rect x="0" y="0" width="245" height="70" rx="10" fill="white" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <rect x="290" y="255" width="245" height="28" rx="10" fill="#64748b"/>
  <rect x="290" y="269" width="245" height="14" fill="#64748b"/>
  <text x="412" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="white">JEXL (Apache)</text>
  <text x="305" y="300" font-size="10" fill="#64748b">Apache 出品 · 类 JS 语法</text>
  <text x="305" y="316" font-size="10" fill="#64748b">社区活跃 · 适合 Apache 生态项目</text>

  <g filter="url(#shadow)" transform="translate(550, 255)">
    <rect x="0" y="0" width="240" height="70" rx="10" fill="white" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <rect x="550" y="255" width="240" height="28" rx="10" fill="url(#redG)"/>
  <rect x="550" y="269" width="240" height="14" fill="url(#redG)"/>
  <text x="670" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="white">Janino</text>
  <text x="565" y="300" font-size="10" fill="#64748b">运行时编译 Java 代码片段</text>
  <text x="565" y="316" font-size="10" fill="#ef4444">纯 Java 语法 · 适合动态编译场景</text>

  <!-- ===== Selection guide ===== -->
  <line x1="30" y1="345" x2="790" y2="345" stroke="#e2e8f0" stroke-width="1"/>

  <text x="410" y="365" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">选型建议</text>

  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="180" height="36" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
    <text x="90" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">需要控制流 + 沙箱</text>
    <text x="90" y="29" text-anchor="middle" font-size="9" fill="#f59e0b">→ QLExpress ⭐</text>
  </g>

  <g transform="translate(235, 375)">
    <rect x="0" y="0" width="180" height="36" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="90" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">追求极致性能</text>
    <text x="90" y="29" text-anchor="middle" font-size="9" fill="#10b981">→ Aviator</text>
  </g>

  <g transform="translate(430, 375)">
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
    <text x="85" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">Spring 生态</text>
    <text x="85" y="29" text-anchor="middle" font-size="9" fill="#8b5cf6">→ SpEL</text>
  </g>

  <g transform="translate(615, 375)">
    <rect x="0" y="0" width="165" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">动态编译 Java</text>
    <text x="82" y="29" text-anchor="middle" font-size="9" fill="#64748b">→ Janino</text>
  </g>
</svg>