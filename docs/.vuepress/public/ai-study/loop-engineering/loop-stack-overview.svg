<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Loop Stack 六大组件</text>
  <text x="410" y="50" text-anchor="middle" font-size="12" fill="#94a3b8">循环系统的基础设施——清华清新研究团队 2026 报告框架</text>

  <!-- ===== Center: Agent Core ===== -->
  <g filter="url(#shadowLg)">
    <circle cx="410" cy="290" r="60" fill="white" stroke="#6366f1" stroke-width="2.5"/>
  </g>
  <circle cx="410" cy="290" r="60" fill="url(#indigoG)" opacity="0.1"/>
  <text x="410" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Agent</text>
  <text x="410" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#6366f1">LLM Core</text>
  <text x="410" y="315" text-anchor="middle" font-size="9" fill="#94a3b8">推理 + 决策</text>

  <!-- ===== 6 Components arranged around the center ===== -->

  <!-- 1. Automations (top) -->
  <g filter="url(#shadow)">
    <rect x="310" y="75" width="200" height="72" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="310" y="75" width="200" height="28" rx="10" fill="url(#amberG)"/>
  <rect x="310" y="93" width="200" height="10" fill="url(#amberG)"/>
  <text x="410" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="white">⏰ Automations</text>
  <text x="410" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">任务调度与心跳唤醒</text>
  <text x="410" y="134" text-anchor="middle" font-size="9" fill="#64748b">cron · 事件触发 · webhook</text>
  <!-- Connection line to center -->
  <line x1="410" y1="147" x2="410" y2="228" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 2. Worktrees (top right) -->
  <g filter="url(#shadow)">
    <rect x="585" y="130" width="200" height="72" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="585" y="130" width="200" height="28" rx="10" fill="url(#blueG)"/>
  <rect x="585" y="148" width="200" height="10" fill="url(#blueG)"/>
  <text x="685" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="white">🌿 Worktrees</text>
  <text x="685" y="173" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">多 Agent 并行隔离</text>
  <text x="685" y="189" text-anchor="middle" font-size="9" fill="#64748b">git worktree · 容器隔离</text>
  <!-- Connection line to center -->
  <line x1="585" y1="180" x2="465" y2="260" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 3. Skills (bottom right) -->
  <g filter="url(#shadow)">
    <rect x="585" y="370" width="200" height="72" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="585" y="370" width="200" height="28" rx="10" fill="url(#greenG)"/>
  <rect x="585" y="388" width="200" height="10" fill="url(#greenG)"/>
  <text x="685" y="389" text-anchor="middle" font-size="12" font-weight="700" fill="white">📘 Skills</text>
  <text x="685" y="413" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">项目知识与流程沉淀</text>
  <text x="685" y="429" text-anchor="middle" font-size="9" fill="#64748b">CLAUDE.md · 技能文件 · SOP</text>
  <!-- Connection line to center -->
  <line x1="585" y1="400" x2="465" y2="320" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 4. Connectors (bottom) -->
  <g filter="url(#shadow)">
    <rect x="310" y="425" width="200" height="72" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="310" y="425" width="200" height="28" rx="10" fill="url(#violetG)"/>
  <rect x="310" y="443" width="200" height="10" fill="url(#violetG)"/>
  <text x="410" y="444" text-anchor="middle" font-size="12" font-weight="700" fill="white">🔗 Connectors</text>
  <text x="410" y="468" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">外部系统连接器</text>
  <text x="410" y="484" text-anchor="middle" font-size="9" fill="#64748b">MCP · API · 数据库连接</text>
  <!-- Connection line to center -->
  <line x1="410" y1="425" x2="410" y2="352" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 5. Sub-agents (bottom left) -->
  <g filter="url(#shadow)">
    <rect x="35" y="370" width="200" height="72" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="35" y="370" width="200" height="28" rx="10" fill="url(#redG)"/>
  <rect x="35" y="388" width="200" height="10" fill="url(#redG)"/>
  <text x="135" y="389" text-anchor="middle" font-size="12" font-weight="700" fill="white">🔀 Sub-agents</text>
  <text x="135" y="413" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">子智能体委派</text>
  <text x="135" y="429" text-anchor="middle" font-size="9" fill="#64748b">Task工具 · 多Agent协调</text>
  <!-- Connection line to center -->
  <line x1="235" y1="400" x2="355" y2="320" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 6. Memory (top left) -->
  <g filter="url(#shadow)">
    <rect x="35" y="130" width="200" height="72" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="35" y="130" width="200" height="28" rx="10" fill="url(#indigoG)"/>
  <rect x="35" y="148" width="200" height="10" fill="url(#indigoG)"/>
  <text x="135" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="white">🧠 Memory</text>
  <text x="135" y="173" text-anchor="middle" font-size="10" font-weight="600" fill="#4338ca">跨循环持久记忆</text>
  <text x="135" y="189" text-anchor="middle" font-size="9" fill="#64748b">向量DB · 事件日志 · 经验池</text>
  <!-- Connection line to center -->
  <line x1="235" y1="180" x2="355" y2="260" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom tip -->
  <rect x="100" y="515" width="620" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="410" y="531" text-anchor="middle" font-size="10" fill="#4338ca">💡 六大组件环绕 Agent 核心——Automations 驱动循环、Worktrees 隔离并行、Skills 沉淀经验、Connectors 连接世界、Sub-agents 分身委派、Memory 积累过去</text>
</svg>
