<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowY" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowN" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="560" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">状态机框架选型决策图</text>
  <text x="410" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">根据项目特点和复杂度选择合适的方案</text>

  <!-- ===== Start Node ===== -->
  <g filter="url(#shadow)">
    <rect x="310" y="75" width="200" height="40" rx="20" fill="url(#indigoG)"/>
  </g>
  <text x="410" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="white">需要管理状态流转？</text>

  <!-- Arrow down from start -->
  <line x1="410" y1="115" x2="410" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- ===== Decision 1: 状态数 <= 3 ? ===== -->
  <g filter="url(#shadow)">
    <rect x="300" y="150" width="220" height="50" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="410" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">状态数 ≤ 3 且无 Action？</text>

  <!-- Yes branch: right -->
  <line x1="520" y1="175" x2="570" y2="175" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="545" y="168" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="600">是</text>
  <g filter="url(#shadow)">
    <rect x="575" y="155" width="210" height="40" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="680" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">if-else / 枚举驱动</text>

  <!-- No branch: down -->
  <line x1="410" y1="200" x2="410" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="425" y="220" text-anchor="start" font-size="10" fill="#64748b" font-weight="600">否</text>

  <!-- ===== Decision 2: Spring Boot 项目 ? ===== -->
  <g filter="url(#shadow)">
    <rect x="300" y="235" width="220" height="50" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="410" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Spring Boot 项目？</text>

  <!-- Yes branch: left -->
  <line x1="300" y1="260" x2="230" y2="260" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="265" y="253" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="600">是</text>

  <!-- Decision 3: 需要嵌套/并行 ? (left of D2) -->
  <g filter="url(#shadow)">
    <rect x="50" y="310" width="210" height="50" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="155" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">需要嵌套 / 并行状态？</text>
  <!-- Arrow from D2-yes to D3 -->
  <path d="M 155 260 L 155 306" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrowY)"/>

  <!-- D3 Yes: Spring StateMachine -->
  <line x1="155" y1="360" x2="155" y2="396" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="170" y="380" text-anchor="start" font-size="10" fill="#f59e0b" font-weight="600">是</text>
  <g filter="url(#shadow)">
    <rect x="50" y="400" width="210" height="40" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="155" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Spring StateMachine</text>

  <!-- D3 No: Spring StateMachine (simpler) or 枚举 -->
  <line x1="260" y1="335" x2="300" y2="335" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">否</text>
  <g filter="url(#shadow)">
    <rect x="300" y="315" width="200" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="400" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Spring StateMachine (简化)</text>

  <!-- No branch of D2: down -->
  <line x1="410" y1="285" x2="410" y2="315" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="425" y="305" text-anchor="start" font-size="10" fill="#64748b" font-weight="600">否</text>

  <!-- ===== Decision 4: 状态数 > 8 ? ===== -->
  <g filter="url(#shadow)">
    <rect x="300" y="320" width="220" height="50" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="410" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">状态数 > 8 或需可视化？</text>

  <!-- D4 Yes: right -> Squirrel -->
  <line x1="520" y1="345" x2="570" y2="345" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="545" y="338" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="600">是</text>
  <g filter="url(#shadow)">
    <rect x="575" y="325" width="210" height="40" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="680" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Squirrel-Foundation</text>

  <!-- D4 No: down -> 自研/策略模式 -->
  <line x1="410" y1="370" x2="410" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="425" y="390" text-anchor="start" font-size="10" fill="#64748b" font-weight="600">否</text>
  <g filter="url(#shadow)">
    <rect x="300" y="405" width="220" height="40" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="410" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">自研轻量级状态机（策略模式）</text>

  <!-- ===== Bottom: Framework Comparison ===== -->
  <rect x="40" y="470" width="740" height="70" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="410" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">框架速查</text>
  <text x="60" y="510" font-size="10" fill="#1d4ed8" font-weight="600">Spring StateMachine</text>
  <text x="60" y="525" font-size="9" fill="#64748b">重量级 | Spring生态 | 嵌套/并行</text>
  <text x="250" y="510" font-size="10" fill="#047857" font-weight="600">Squirrel-Foundation</text>
  <text x="250" y="525" font-size="9" fill="#64748b">轻量级 | 无依赖 | Fluent API</text>
  <text x="460" y="510" font-size="10" fill="#92400e" font-weight="600">Colon</text>
  <text x="460" y="525" font-size="9" fill="#64748b">超轻量 | 零依赖 | 极简API</text>
  <text x="600" y="510" font-size="10" fill="#5b21b6" font-weight="600">自研（策略模式）</text>
  <text x="600" y="525" font-size="9" fill="#64748b">零依赖 | 基于已有封装 | 灵活可控</text>
</svg>