<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="420" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">GraphRAG 索引构建流程</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">五步离线 pipeline · 从原始文档到知识图谱 + 社区摘要</text>

  <!-- ===== Step 1: Text Chunking ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="140" height="100" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="70" width="140" height="32" rx="10" fill="url(#blueG)"/>
  <rect x="30" y="90" width="140" height="12" fill="url(#blueG)"/>
  <text x="100" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="white">1. 文本切分</text>
  <text x="100" y="120" text-anchor="middle" font-size="10" fill="#1d4ed8">按 token 数切分</text>
  <text x="100" y="136" text-anchor="middle" font-size="10" fill="#1d4ed8">1200 tokens/chunk</text>
  <text x="100" y="152" text-anchor="middle" font-size="10" fill="#1d4ed8">重叠 100 tokens</text>
  <text x="100" y="165" text-anchor="middle" font-size="9" fill="#64748b">Chunking</text>

  <!-- Arrow 1→2 -->
  <line x1="170" y1="120" x2="206" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Step 2: Entity & Relation Extraction ===== -->
  <g filter="url(#shadow)">
    <rect x="210" y="70" width="140" height="100" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="210" y="70" width="140" height="32" rx="10" fill="url(#amberG)"/>
  <rect x="210" y="90" width="140" height="12" fill="url(#amberG)"/>
  <text x="280" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="white">2. 实体关系抽取</text>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#92400e">LLM 逐 chunk 抽取</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#92400e">Entity + Relation</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#92400e">Gleaning 迭代清洗</text>
  <text x="280" y="165" text-anchor="middle" font-size="9" fill="#64748b">Extraction</text>

  <!-- Arrow 2→3 -->
  <line x1="350" y1="120" x2="386" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Step 3: Graph Construction ===== -->
  <g filter="url(#shadow)">
    <rect x="390" y="70" width="140" height="100" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="390" y="70" width="140" height="32" rx="10" fill="url(#violetG)"/>
  <rect x="390" y="90" width="140" height="12" fill="url(#violetG)"/>
  <text x="460" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="white">3. 图构建</text>
  <text x="460" y="120" text-anchor="middle" font-size="10" fill="#5b21b6">实体 → 节点</text>
  <text x="460" y="136" text-anchor="middle" font-size="10" fill="#5b21b6">关系 → 加权边</text>
  <text x="460" y="152" text-anchor="middle" font-size="10" fill="#5b21b6">实体去重合并</text>
  <text x="460" y="165" text-anchor="middle" font-size="9" fill="#64748b">Graph Build</text>

  <!-- Arrow 3→4 -->
  <line x1="530" y1="120" x2="566" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Step 4: Community Detection ===== -->
  <g filter="url(#shadow)">
    <rect x="570" y="70" width="100" height="100" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="570" y="70" width="100" height="32" rx="10" fill="url(#amberG)"/>
  <rect x="570" y="90" width="100" height="12" fill="url(#amberG)"/>
  <text x="620" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="white">4. 社区检测</text>
  <text x="620" y="120" text-anchor="middle" font-size="10" fill="#92400e">Leiden 算法</text>
  <text x="620" y="136" text-anchor="middle" font-size="10" fill="#92400e">层次化社区</text>
  <text x="620" y="152" text-anchor="middle" font-size="9" fill="#64748b">max_levels=3</text>
  <text x="620" y="165" text-anchor="middle" font-size="9" fill="#64748b">Community</text>

  <!-- Arrow down -->
  <line x1="620" y1="170" x2="620" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Step 5: Community Reports ===== -->
  <g filter="url(#shadow)">
    <rect x="350" y="204" width="380" height="75" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="350" y="204" width="380" height="32" rx="10" fill="url(#greenG)"/>
  <rect x="350" y="224" width="380" height="12" fill="url(#greenG)"/>
  <text x="540" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="white">5. 社区报告生成</text>
  <text x="540" y="254" text-anchor="middle" font-size="10" fill="#047857">LLM 为每个社区生成摘要报告（标题 + 摘要 + 关键发现）</text>
  <text x="540" y="270" text-anchor="middle" font-size="10" fill="#047857">从最底层社区开始，逐层向上汇总</text>

  <!-- ===== Output: Parquet files ===== -->
  <line x1="540" y1="279" x2="540" y2="305" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="200" y="309" width="530" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  </g>
  <text x="465" y="330" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">索引产物（output/ 目录）</text>
  <text x="465" y="348" text-anchor="middle" font-size="10" fill="#64748b">final_nodes.parquet · final_entities.parquet · final_relationships.parquet</text>
  <text x="465" y="365" text-anchor="middle" font-size="10" fill="#64748b">final_text_units.parquet · final_communities.parquet · final_community_reports.parquet</text>
  <text x="465" y="382" text-anchor="middle" font-size="9" fill="#94a3b8">所有查询基于这些 Parquet 文件，无需重新调用 LLM</text>
</svg>
