<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="560" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Agent 工程的五层控制圈</text>
  <text x="410" y="52" text-anchor="middle" font-size="12" fill="#94a3b8">不是替代关系，而是不断向外扩大的嵌套控制圈</text>

  <!-- ===== Layer 5: Graph Engineering (outermost) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="760" height="440" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="30" y="70" width="760" height="36" rx="12" fill="url(#violetG)"/>
  <rect x="30" y="90" width="760" height="16" fill="url(#violetG)"/>
  <text x="50" y="93" font-size="14" font-weight="700" fill="white">Graph Engineering</text>
  <text x="770" y="93" text-anchor="end" font-size="11" fill="#ede9fe">一群 Agent 怎样一起做事</text>

  <!-- ===== Layer 4: Loop Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="700" height="360" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="60" y="120" width="700" height="32" rx="12" fill="url(#amberG)"/>
  <rect x="60" y="138" width="700" height="14" fill="url(#amberG)"/>
  <text x="80" y="141" font-size="13" font-weight="700" fill="white">Loop Engineering</text>
  <text x="740" y="141" text-anchor="end" font-size="11" fill="#fef3c7">Agent 怎样持续推进做事</text>

  <!-- ===== Layer 3: Harness Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="90" y="165" width="640" height="280" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="90" y="165" width="640" height="32" rx="12" fill="url(#blueG)"/>
  <rect x="90" y="183" width="640" height="14" fill="url(#blueG)"/>
  <text x="110" y="186" font-size="13" font-weight="700" fill="white">Harness Engineering</text>
  <text x="710" y="186" text-anchor="end" font-size="11" fill="#dbeafe">Agent 如何做事</text>

  <!-- ===== Layer 2: Context Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="120" y="210" width="580" height="200" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="120" y="210" width="580" height="32" rx="12" fill="url(#greenG)"/>
  <rect x="120" y="228" width="580" height="14" fill="url(#greenG)"/>
  <text x="140" y="231" font-size="13" font-weight="700" fill="white">Context Engineering</text>
  <text x="680" y="231" text-anchor="end" font-size="11" fill="#d1fae5">让模型看到什么</text>

  <!-- ===== Layer 1: Prompt Engineering (innermost) ===== -->
  <g filter="url(#shadow)">
    <rect x="280" y="270" width="260" height="100" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="280" y="270" width="260" height="34" rx="12" fill="url(#indigoG)"/>
  <rect x="280" y="288" width="260" height="16" fill="url(#indigoG)"/>
  <text x="410" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="white">Prompt Engineering</text>
  <text x="410" y="330" text-anchor="middle" font-size="11" fill="#475569">如何对模型说话</text>
  <text x="410" y="350" text-anchor="middle" font-size="10" fill="#64748b">优化措辞 · few-shot 示例</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="160" y="525" width="500" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="542" text-anchor="middle" font-size="11" fill="#15803d">💡 Agent 系统越复杂，五层能力越需要同时存在——不是替代，是嵌套</text>
</svg>
