<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Supervision 监督策略总览</text>
  <text x="410" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">子 Actor 崩溃时，父 Actor（监督者）的四种处理策略</text>

  <!-- ===== Top: Child Actor Crash ===== -->
  <g filter="url(#shadow)" transform="translate(310, 80)">
    <rect x="0" y="0" width="200" height="60" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="60" rx="3" fill="url(#redG)"/>
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">子 Actor 崩溃</text>
    <text x="100" y="44" text-anchor="middle" font-size="11" fill="#ef4444">⚠ 抛出异常 · 状态可能损坏</text>
  </g>

  <!-- Arrow down to supervisor -->
  <line x1="410" y1="140" x2="410" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Supervisor ===== -->
  <g filter="url(#shadow)" transform="translate(290, 168)">
    <rect x="0" y="0" width="240" height="50" rx="10" fill="#1e293b"/>
    <text x="120" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="white">父 Actor（监督者）</text>
    <text x="120" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">收到 Failure 通知 · 决策如何处理</text>
  </g>

  <!-- Arrows to four strategies -->
  <line x1="360" y1="218" x2="130" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="218" x2="340" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="218" x2="540" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="218" x2="730" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Strategy 1: Resume ===== -->
  <g filter="url(#shadow)" transform="translate(30, 265)">
    <rect x="0" y="0" width="200" height="150" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="265" width="200" height="38" rx="12" fill="url(#blueG)"/>
  <rect x="30" y="285" width="200" height="18" fill="url(#blueG)"/>
  <text x="130" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="white">Resume</text>
  <text x="130" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">恢复</text>
  <text x="130" y="342" text-anchor="middle" font-size="10" fill="#64748b">保留当前状态</text>
  <text x="130" y="358" text-anchor="middle" font-size="10" fill="#64748b">继续处理下一条消息</text>
  <rect x="50" y="372" width="160" height="28" rx="6" fill="#eff6ff"/>
  <text x="130" y="390" text-anchor="middle" font-size="10" fill="#3b82f6">临时性故障 · 状态有效</text>

  <!-- ===== Strategy 2: Restart ===== -->
  <g filter="url(#shadow)" transform="translate(250, 265)">
    <rect x="0" y="0" width="200" height="150" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="250" y="265" width="200" height="38" rx="12" fill="url(#greenG)"/>
  <rect x="250" y="285" width="200" height="18" fill="url(#greenG)"/>
  <text x="350" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="white">Restart</text>
  <text x="350" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">重启</text>
  <text x="350" y="342" text-anchor="middle" font-size="10" fill="#64748b">丢弃旧实例</text>
  <text x="350" y="358" text-anchor="middle" font-size="10" fill="#64748b">创建新实例 · 状态重置</text>
  <rect x="270" y="372" width="160" height="28" rx="6" fill="#ecfdf5"/>
  <text x="350" y="390" text-anchor="middle" font-size="10" fill="#10b981">状态损坏 · 需要重置</text>

  <!-- ===== Strategy 3: Stop ===== -->
  <g filter="url(#shadow)" transform="translate(470, 265)">
    <rect x="0" y="0" width="200" height="150" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="470" y="265" width="200" height="38" rx="12" fill="url(#amberG)"/>
  <rect x="470" y="285" width="200" height="18" fill="url(#amberG)"/>
  <text x="570" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="white">Stop</text>
  <text x="570" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">停止</text>
  <text x="570" y="342" text-anchor="middle" font-size="10" fill="#64748b">永久终止子 Actor</text>
  <text x="570" y="358" text-anchor="middle" font-size="10" fill="#64748b">不再接收消息</text>
  <rect x="490" y="372" width="160" height="28" rx="6" fill="#fffbeb"/>
  <text x="570" y="390" text-anchor="middle" font-size="10" fill="#f59e0b">职责结束 · 无法恢复</text>

  <!-- ===== Strategy 4: Escalate ===== -->
  <g filter="url(#shadow)" transform="translate(690, 265)">
    <rect x="0" y="0" width="100" height="150" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="690" y="265" width="100" height="38" rx="12" fill="url(#violetG)"/>
  <rect x="690" y="285" width="100" height="18" fill="url(#violetG)"/>
  <text x="740" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="white">Escalate</text>
  <text x="740" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">上报</text>
  <text x="740" y="342" text-anchor="middle" font-size="9" fill="#64748b">自己处理不了</text>
  <text x="740" y="358" text-anchor="middle" font-size="9" fill="#64748b">交给上层</text>
  <text x="740" y="374" text-anchor="middle" font-size="9" fill="#64748b">监督者决策</text>

  <!-- ===== Bottom: Supervision Strategy Modes ===== -->
  <line x1="40" y1="438" x2="780" y2="438" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">两种策略模式</text>

  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="310" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="155" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">OneForOneStrategy</text>
    <text x="155" y="32" text-anchor="middle" font-size="9" fill="#64748b">只对崩溃的子 Actor 执行策略 · 子 Actor 独立</text>
  </g>

  <g transform="translate(430, 470)">
    <rect x="0" y="0" width="310" height="40" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="155" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">AllForOneStrategy</text>
    <text x="155" y="32" text-anchor="middle" font-size="9" fill="#64748b">对所有子 Actor 执行策略 · 子 Actor 紧密耦合</text>
  </g>
</svg>