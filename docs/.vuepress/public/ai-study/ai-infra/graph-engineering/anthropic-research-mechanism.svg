<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="540" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Anthropic 多 Agent 研究系统</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">Orchestrator-Worker 模式：Lead Agent 协调 + Subagent 并行搜索</text>

  <!-- ===== User Query ===== -->
  <rect x="340" y="65" width="140" height="30" rx="15" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">用户查询</text>

  <line x1="410" y1="95" x2="410" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== LeadResearcher (top) ===== -->
  <g filter="url(#shadow)">
    <rect x="270" y="120" width="280" height="50" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="270" y="120" width="280" height="24" rx="10" fill="url(#indigoG)"/>
  <rect x="270" y="134" width="280" height="10" fill="url(#indigoG)"/>
  <text x="410" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="white">LeadResearcher Agent</text>
  <text x="410" y="160" text-anchor="middle" font-size="10" fill="#64748b">分析查询 · 制定策略 · 保存计划到 Memory</text>

  <!-- Branch lines: Lead → 4 Subagents -->
  <path d="M 330 170 L 330 195 L 130 195 L 130 218" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <path d="M 370 170 L 370 195 L 290 195 L 290 218" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <path d="M 430 170 L 430 195 L 490 195 L 490 218" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <path d="M 470 170 L 470 195 L 670 195 L 670 218" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>

  <text x="220" y="212" text-anchor="middle" font-size="9" fill="#3b82f6" font-weight="600">创建并行子 Agent</text>

  <!-- ===== 4 Subagents ===== -->
  <g filter="url(#shadow)">
    <rect x="70" y="222" width="120" height="42" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <rect x="70" y="222" width="120" height="20" rx="8" fill="url(#blueG)"/>
  <rect x="70" y="234" width="120" height="8" fill="url(#blueG)"/>
  <text x="130" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="white">Subagent 1</text>
  <text x="130" y="258" text-anchor="middle" font-size="9" fill="#64748b">独立搜索 + 评估</text>

  <g filter="url(#shadow)">
    <rect x="230" y="222" width="120" height="42" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <rect x="230" y="222" width="120" height="20" rx="8" fill="url(#blueG)"/>
  <rect x="230" y="234" width="120" height="8" fill="url(#blueG)"/>
  <text x="290" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="white">Subagent 2</text>
  <text x="290" y="258" text-anchor="middle" font-size="9" fill="#64748b">独立搜索 + 评估</text>

  <g filter="url(#shadow)">
    <rect x="430" y="222" width="120" height="42" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <rect x="430" y="222" width="120" height="20" rx="8" fill="url(#blueG)"/>
  <rect x="430" y="234" width="120" height="8" fill="url(#blueG)"/>
  <text x="490" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="white">Subagent 3</text>
  <text x="490" y="258" text-anchor="middle" font-size="9" fill="#64748b">独立搜索 + 评估</text>

  <g filter="url(#shadow)">
    <rect x="610" y="222" width="120" height="42" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <rect x="610" y="222" width="120" height="20" rx="8" fill="url(#blueG)"/>
  <rect x="610" y="234" width="120" height="8" fill="url(#blueG)"/>
  <text x="670" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="white">Subagent N</text>
  <text x="670" y="258" text-anchor="middle" font-size="9" fill="#64748b">独立搜索 + 评估</text>

  <!-- Merge lines: Subagents → LeadResearcher (bottom) -->
  <path d="M 130 264 L 130 295 L 330 295 L 330 318" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 290 264 L 290 295 L 370 295 L 370 318" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 490 264 L 490 295 L 430 295 L 430 318" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 670 264 L 670 295 L 470 295 L 470 318" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="410" y="288" text-anchor="middle" font-size="9" fill="#64748b">返回结果</text>

  <!-- ===== LeadResearcher (bottom) ===== -->
  <g filter="url(#shadow)">
    <rect x="270" y="320" width="280" height="50" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="270" y="320" width="280" height="24" rx="10" fill="url(#indigoG)"/>
  <rect x="270" y="334" width="280" height="10" fill="url(#indigoG)"/>
  <text x="410" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="white">LeadResearcher Agent</text>
  <text x="410" y="360" text-anchor="middle" font-size="10" fill="#64748b">综合结果 · 决定是否需要更多研究</text>

  <line x1="410" y1="370" x2="410" y2="396" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="420" y="388" text-anchor="start" font-size="9" fill="#64748b">研究完成</text>

  <!-- ===== CitationAgent ===== -->
  <g filter="url(#shadow)">
    <rect x="290" y="400" width="240" height="42" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="290" y="400" width="240" height="22" rx="10" fill="url(#greenG)"/>
  <rect x="290" y="414" width="240" height="8" fill="url(#greenG)"/>
  <text x="410" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="white">CitationAgent</text>
  <text x="410" y="436" text-anchor="middle" font-size="9" fill="#64748b">处理引用 · 标注来源</text>

  <line x1="410" y1="442" x2="410" y2="468" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- ===== Final Report ===== -->
  <rect x="330" y="472" width="160" height="30" rx="15" fill="#d1fae5" stroke="#86efac" stroke-width="1.5"/>
  <text x="410" y="492" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">最终报告</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="100" y="515" width="620" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="529" text-anchor="middle" font-size="11" fill="#15803d">💡 多 Agent 系统在内部研究评估中比单 Agent 高出 90.2%</text>
</svg>
