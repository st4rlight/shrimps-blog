<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="400" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Loop Engineering vs Graph Engineering</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">同样有 Loop，但关注的层次不同</text>

  <!-- ===== Left: Loop Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="65" width="370" height="290" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="30" y="65" width="370" height="34" rx="12" fill="url(#amberG)"/>
  <rect x="30" y="83" width="370" height="16" fill="url(#amberG)"/>
  <text x="215" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="white">Loop Engineering</text>
  <text x="215" y="118" text-anchor="middle" font-size="11" fill="#92400e">一个 Agent 如何持续推进工作</text>

  <!-- Loop flow -->
  <rect x="130" y="135" width="170" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="215" y="154" text-anchor="middle" font-size="10" fill="#92400e">接收任务</text>

  <line x1="215" y1="163" x2="215" y2="186" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="190" width="170" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="215" y="209" text-anchor="middle" font-size="10" fill="#92400e">写代码</text>

  <line x1="215" y1="218" x2="215" y2="241" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="245" width="170" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="215" y="264" text-anchor="middle" font-size="10" fill="#92400e">跑测试</text>

  <!-- Decision diamond -->
  <line x1="215" y1="273" x2="215" y2="286" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="215,288 265,308 215,328 165,308" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="215" y="312" text-anchor="middle" font-size="9" fill="#92400e">测试失败?</text>

  <!-- Yes branch: loops back to write code -->
  <path d="M 165 308 L 80 308 L 80 204 L 126 204" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrowR)"/>
  <text x="72" y="260" text-anchor="end" font-size="9" fill="#ef4444" font-weight="600">是</text>
  <rect x="50" y="195" width="30" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="65" y="208" text-anchor="middle" font-size="8" fill="#991b1b">修复</text>

  <!-- No branch: done -->
  <path d="M 265 308 L 350 308 L 350 278 L 350 259" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="355" y="290" text-anchor="start" font-size="9" fill="#10b981" font-weight="600">否</text>

  <rect x="310" y="225" width="80" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="350" y="244" text-anchor="middle" font-size="10" fill="#047857">完成</text>

  <!-- ===== Right: Graph Engineering ===== -->
  <g filter="url(#shadow)">
    <rect x="420" y="65" width="370" height="290" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="420" y="65" width="370" height="34" rx="12" fill="url(#violetG)"/>
  <rect x="420" y="83" width="370" height="16" fill="url(#violetG)"/>
  <text x="605" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="white">Graph Engineering</text>
  <text x="605" y="118" text-anchor="middle" font-size="11" fill="#5b21b6">多个 Agent 如何协同运行</text>

  <!-- Graph: 3 agents in a pipeline with feedback loop -->
  <!-- Researcher -->
  <rect x="445" y="140" width="140" height="36" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="515" y="163" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="600">Researcher</text>

  <line x1="585" y1="158" x2="616" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Writer -->
  <rect x="620" y="140" width="140" height="36" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="690" y="163" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="600">Writer</text>

  <!-- Writer to Reviewer -->
  <line x1="690" y1="176" x2="690" y2="206" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reviewer -->
  <rect x="620" y="210" width="140" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="690" y="233" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">Reviewer</text>

  <!-- Pass: Reviewer → Publish -->
  <path d="M 760 228 L 780 228 L 780 290 L 690 290" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="785" y="262" text-anchor="start" font-size="9" fill="#10b981" font-weight="600">通过</text>

  <rect x="590" y="275" width="100" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="294" text-anchor="middle" font-size="10" fill="#047857">发布</text>

  <!-- Fail: Reviewer → back to Writer -->
  <path d="M 620 228 L 515 228 L 515 176" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrowR)"/>
  <text x="540" y="205" text-anchor="end" font-size="9" fill="#ef4444" font-weight="600">不通过</text>

  <!-- Researcher to Writer connection (bottom) -->
  <path d="M 515 176 L 515 310 L 620 310 L 690 310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  <text x="560" y="325" text-anchor="middle" font-size="9" fill="#64748b">State 传递</text>

  <!-- Annotation -->
  <text x="605" y="350" text-anchor="middle" font-size="10" fill="#64748b">谁交给谁 · 谁审核 · 失败回到哪</text>

  <!-- ===== Center VS ===== -->
  <circle cx="410" cy="210" r="22" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">vs</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="120" y="372" width="580" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="387" text-anchor="middle" font-size="11" fill="#15803d">💡 Loop 关注"一个 Agent 如何持续推进"；Graph 关注"多个 Agent 如何协同"</text>
</svg>
