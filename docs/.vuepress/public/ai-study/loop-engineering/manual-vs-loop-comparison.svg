<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">手动提示 vs 循环驱动</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">从 Human-in-the-Loop 到 Human-on-the-Loop</text>

  <!-- ===== LEFT: Manual Prompting ===== -->
  <g filter="url(#shadow)">
    <rect x="25" y="65" width="340" height="310" rx="10" fill="white" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <rect x="25" y="65" width="340" height="34" rx="10" fill="url(#redG)"/>
  <rect x="25" y="85" width="340" height="14" fill="url(#redG)"/>
  <text x="195" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="white">❌ 手动提示（Human-in-the-Loop）</text>

  <!-- Manual flow: zigzag pattern showing human interruptions -->
  <rect x="55" y="115" width="280" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="195" y="134" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">👤 人写 Prompt</text>

  <line x1="195" y1="143" x2="195" y2="153" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="156" width="280" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="195" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">🤖 Agent 执行 → 结果</text>

  <line x1="195" y1="184" x2="195" y2="194" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="197" width="280" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="195" y="216" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">👤 人检查 → 发现问题</text>

  <line x1="195" y1="225" x2="195" y2="235" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="238" width="280" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="195" y="257" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">👤 人写新 Prompt 修正</text>

  <line x1="195" y1="266" x2="195" y2="276" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="279" width="280" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="195" y="298" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">🤖 Agent 再次执行 → 又出错</text>

  <line x1="195" y1="307" x2="195" y2="317" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="320" width="280" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="195" y="339" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">... 循环往复，人最忙</text>

  <!-- Pain points -->
  <rect x="55" y="356" width="280" height="12" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="195" y="365" text-anchor="middle" font-size="9" font-weight="500" fill="#92400e">⚠ 注意力不断被打断，人成了瓶颈</text>

  <!-- ===== VS Circle ===== -->
  <circle cx="400" cy="220" r="22" fill="url(#amberG)" filter="url(#shadow)"/>
  <text x="400" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="white">VS</text>

  <!-- ===== RIGHT: Loop Driven ===== -->
  <g filter="url(#shadowLg)">
    <rect x="435" y="65" width="340" height="310" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="435" y="65" width="340" height="34" rx="10" fill="url(#greenG)"/>
  <rect x="435" y="85" width="340" height="14" fill="url(#greenG)"/>
  <text x="605" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="white">✅ 循环驱动（Human-on-the-Loop）</text>

  <!-- Loop driven flow: automated cycle -->
  <rect x="465" y="115" width="280" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="605" y="134" text-anchor="middle" font-size="11" font-weight="500" fill="#047857">👤 人设定目标 + 边界</text>

  <line x1="605" y1="143" x2="605" y2="153" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="465" y="156" width="280" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="605" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#1d4ed8">⏰ 循环自动触发 Agent</text>

  <line x1="605" y1="184" x2="605" y2="194" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="465" y="197" width="280" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="605" y="216" text-anchor="middle" font-size="11" font-weight="500" fill="#047857">🤖 Agent 执行 → 自动验证</text>

  <line x1="605" y1="225" x2="605" y2="235" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="465" y="238" width="280" height="28" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="605" y="257" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">✓ 验证通过？是 → 交付</text>

  <!-- No branch feedback -->
  <line x1="465" y1="252" x2="435" y2="252" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="435" y1="252" x2="435" y2="170" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="435" y1="170" x2="463" y2="170" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="425" y="210" text-anchor="end" font-size="9" font-weight="600" fill="#ef4444">否·自动反馈</text>

  <line x1="605" y1="266" x2="605" y2="276" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="465" y="279" width="280" height="28" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="605" y="298" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">🧠 经验自动沉淀到 Skills</text>

  <line x1="605" y1="307" x2="605" y2="317" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="465" y="320" width="280" height="28" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="605" y="339" text-anchor="middle" font-size="11" font-weight="500" fill="#047857">🔄 循环持续运转，人只在需要时介入</text>

  <!-- Benefits -->
  <rect x="465" y="356" width="280" height="12" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.5"/>
  <text x="605" y="365" text-anchor="middle" font-size="9" font-weight="500" fill="#15803d">✓ 人专注设计与判断，Agent 自主推进</text>

  <!-- Bottom comparison -->
  <g filter="url(#shadow)">
    <rect x="25" y="390" width="750" height="56" rx="10" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <rect x="25" y="390" width="750" height="26" rx="10" fill="url(#amberG)"/>
  <rect x="25" y="406" width="750" height="10" fill="url(#amberG)"/>
  <text x="400" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">核心转变</text>

  <text x="195" y="432" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">人在循环里 → 每步确认介入</text>
  <text x="605" y="432" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">人在循环上 → 设目标划边界</text>
</svg>
