<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="820" height="560" fill="#f8fafc" rx="12"/>

  <text x="410" y="30" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">MLA 低秩压缩机制 — naive vs absorb</text>

  <!-- Naive 模式 (左半) -->
  <g filter="url(#shadow)">
    <rect x="30" y="55" width="370" height="470" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="30" y="55" width="370" height="40" rx="10" fill="#fee2e2" stroke="none"/>
    <text x="215" y="80" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">naive 模式（调试用）</text>
  </g>

  <text x="50" y="115" font-size="11" font-weight="600" fill="#374151">缓存完整 K/V — 每个 head 独立存储</text>

  <!-- K cache boxes -->
  <g>
    <rect x="50" y="130" width="40" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="155" font-size="9" fill="#1d4ed8" text-anchor="middle">K₀</text>
    <rect x="95" y="130" width="40" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="115" y="155" font-size="9" fill="#1d4ed8" text-anchor="middle">K₁</text>
    <rect x="140" y="130" width="40" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="155" font-size="9" fill="#1d4ed8" text-anchor="middle">K₂</text>
    <text x="195" y="148" font-size="10" fill="#64748b">...</text>
    <rect x="220" y="130" width="40" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="240" y="155" font-size="9" fill="#1d4ed8" text-anchor="middle">K₁₂₇</text>
  </g>
  <text x="50" y="185" font-size="10" fill="#64748b">K cache: (batch, seq, 128 heads, 192 dim)</text>

  <!-- V cache boxes -->
  <g>
    <rect x="50" y="200" width="40" height="40" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="225" font-size="9" fill="#047857" text-anchor="middle">V₀</text>
    <rect x="95" y="200" width="40" height="40" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="115" y="225" font-size="9" fill="#047857" text-anchor="middle">V₁</text>
    <rect x="140" y="200" width="40" height="40" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="225" font-size="9" fill="#047857" text-anchor="middle">V₂</text>
    <text x="195" y="218" font-size="10" fill="#64748b">...</text>
    <rect x="220" y="200" width="40" height="40" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="240" y="225" font-size="9" fill="#047857" text-anchor="middle">V₁₂₇</text>
  </g>
  <text x="50" y="255" font-size="10" fill="#64748b">V cache: (batch, seq, 128 heads, 128 dim)</text>

  <!-- naive 计算 -->
  <g filter="url(#shadow)">
    <rect x="50" y="280" width="320" height="65" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="300" font-size="11" font-weight="600" fill="#92400e">标准注意力计算</text>
    <text x="70" y="318" font-size="10" fill="#374151">Q × K → softmax → × V</text>
    <text x="70" y="334" font-size="10" fill="#64748b">完整解压后再做注意力</text>
  </g>

  <!-- naive 缓存大小 -->
  <g filter="url(#shadow)">
    <rect x="50" y="370" width="320" height="75" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="390" font-size="11" font-weight="600" fill="#991b1b">每 token 每 head 缓存: 256</text>
    <text x="70" y="408" font-size="11" font-weight="600" fill="#991b1b">总缓存 (128 heads): 32,768</text>
    <text x="70" y="430" font-size="14" font-weight="700" fill="#dc2626">压缩比: 1×</text>
  </g>

  <text x="50" y="475" font-size="10" fill="#94a3b8">适用场景: 正确性验证、调试</text>
  <text x="50" y="495" font-size="10" fill="#94a3b8">qk_head_dim=192, v_head_dim=128</text>

  <!-- absorb 模式 (右半) -->
  <g filter="url(#shadow)">
    <rect x="420" y="55" width="370" height="470" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="420" y="55" width="370" height="40" rx="10" fill="#ede9fe" stroke="none"/>
    <text x="605" y="80" font-size="13" font-weight="600" fill="#5b21b6" text-anchor="middle">absorb 模式（生产推理，默认）</text>
  </g>

  <text x="440" y="115" font-size="11" font-weight="600" fill="#374151">缓存压缩 latent — 与 head 数无关</text>

  <!-- kv_cache (压缩) -->
  <g>
    <rect x="440" y="130" width="70" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="475" y="155" font-size="10" font-weight="600" fill="#5b21b6" text-anchor="middle">kv_cache</text>
    <text x="475" y="170" font-size="9" fill="#7c3aed" text-anchor="middle">dim=512</text>
  </g>
  <text x="440" y="200" font-size="10" fill="#64748b">kv_cache: (batch, seq, kv_lora_rank=512)</text>

  <!-- pe_cache (RoPE) -->
  <g>
    <rect x="440" y="220" width="70" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="475" y="245" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">pe_cache</text>
    <text x="475" y="260" font-size="9" fill="#b45309" text-anchor="middle">dim=64</text>
  </g>
  <text x="440" y="290" font-size="10" fill="#64748b">pe_cache: (batch, seq, qk_rope_head_dim=64)</text>

  <!-- absorb 计算 -->
  <g filter="url(#shadow)">
    <rect x="440" y="310" width="320" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="460" y="330" font-size="11" font-weight="600" fill="#1d4ed8">吸收投影矩阵的注意力</text>
    <text x="460" y="348" font-size="10" fill="#374151">wkv_b 被吸收到 softmax 计算中</text>
    <text x="460" y="364" font-size="10" fill="#64748b">不解压直接用压缩表示做注意力</text>
  </g>

  <!-- absorb 缓存大小 -->
  <g filter="url(#shadow)">
    <rect x="440" y="400" width="320" height="75" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="460" y="420" font-size="11" font-weight="600" fill="#047857">每 token 缓存: 512 + 64 = 576</text>
    <text x="460" y="438" font-size="11" font-weight="600" fill="#047857">总缓存: 576 (不依赖 head 数)</text>
    <text x="460" y="460" font-size="14" font-weight="700" fill="#059669">压缩比: ~57×  (32768 / 576)</text>
  </g>

  <text x="440" y="475" font-size="10" fill="#94a3b8">适用场景: 生产推理（默认）</text>
  <text x="440" y="495" font-size="10" fill="#94a3b8">kv_lora_rank=512, qk_rope_head_dim=64</text>

  <!-- 中间对比箭头 -->
  <line x1="410" y1="280" x2="410" y2="280" stroke="#94a3b8" stroke-width="2"/>
</svg>
