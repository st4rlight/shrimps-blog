<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">审批流引擎选型决策图</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#94a3b8">FlowLong vs Activiti / Flowable</text>

  <!-- Start node -->
  <g filter="url(#shadow)">
    <rect x="300" y="65" width="200" height="38" rx="19" fill="url(#indigoG)"/>
  </g>
  <text x="400" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="white">需要审批流功能</text>

  <!-- Arrow down -->
  <line x1="400" y1="107" x2="400" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- Decision 1: 需要 BPMN 2.0 标准兼容？ -->
  <polygon points="400,125 580,175 400,225 220,175" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">需要 BPMN 2.0</text>
  <text x="400" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">标准兼容？</text>

  <!-- Yes → Flowable -->
  <line x1="580" y1="175" x2="640" y2="175" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowY)"/>
  <text x="610" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">是</text>

  <g filter="url(#shadow)">
    <rect x="645" y="155" width="130" height="42" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="645" y="155" width="130" height="22" rx="10" fill="url(#violetG)"/>
  <rect x="645" y="167" width="130" height="10" fill="url(#violetG)"/>
  <text x="710" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="white">Activiti / Flowable</text>
  <text x="710" y="189" text-anchor="middle" font-size="9" fill="#64748b">BPMN 标准 · 企业级</text>

  <!-- No → next decision -->
  <line x1="400" y1="225" x2="400" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrowN)"/>
  <text x="415" y="240" font-size="11" font-weight="600" fill="#64748b">否</text>

  <!-- Decision 2: 需要可视化流程设计器？ -->
  <polygon points="400,250 570,295 400,340 230,295" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">需要可视化</text>
  <text x="400" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">流程设计器？</text>

  <!-- Yes → Flowable -->
  <line x1="570" y1="295" x2="640" y2="295" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowY)"/>
  <text x="605" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">是</text>

  <g filter="url(#shadow)">
    <rect x="645" y="275" width="130" height="42" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="645" y="275" width="130" height="22" rx="10" fill="url(#violetG)"/>
  <rect x="645" y="287" width="130" height="10" fill="url(#violetG)"/>
  <text x="710" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="white">Flowable Modeler</text>
  <text x="710" y="309" text-anchor="middle" font-size="9" fill="#64748b">拖拽设计 · 流程治理</text>

  <!-- No → next decision -->
  <line x1="400" y1="340" x2="400" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrowN)"/>
  <text x="415" y="355" font-size="11" font-weight="600" fill="#64748b">否</text>

  <!-- Decision 3: 流程复杂度高（子流程/定时任务/信号）？ -->
  <polygon points="400,365 580,410 400,455 220,410" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="403" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">需要子流程/</text>
  <text x="400" y="419" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">定时任务/信号？</text>

  <!-- Yes → Flowable -->
  <line x1="580" y1="410" x2="640" y2="410" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowY)"/>
  <text x="610" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">是</text>

  <g filter="url(#shadow)">
    <rect x="645" y="390" width="130" height="42" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="645" y="390" width="130" height="22" rx="10" fill="url(#violetG)"/>
  <rect x="645" y="402" width="130" height="10" fill="url(#violetG)"/>
  <text x="710" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="white">Activiti / Flowable</text>
  <text x="710" y="424" text-anchor="middle" font-size="9" fill="#64748b">完整 BPM 特性</text>

  <!-- No → FlowLong -->
  <line x1="220" y1="410" x2="160" y2="410" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="190" y="403" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">否</text>

  <g filter="url(#shadow)">
    <rect x="20" y="388" width="140" height="46" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="20" y="388" width="140" height="24" rx="10" fill="url(#greenG)"/>
  <rect x="20" y="400" width="140" height="12" fill="url(#greenG)"/>
  <text x="90" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="white">✅ FlowLong</text>
  <text x="90" y="424" text-anchor="middle" font-size="9" fill="#64748b">极简 · JSON · 快速上手</text>

  <!-- FlowLong benefits -->
  <rect x="20" y="450" width="140" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="90" y="466" text-anchor="middle" font-size="9" fill="#047857">✓ ~1MB 极简依赖</text>
  <text x="90" y="479" text-anchor="middle" font-size="9" fill="#047857">✓ JSON 定义流程</text>
  <text x="90" y="492" text-anchor="middle" font-size="9" fill="#047857">✓ 5 分钟上手</text>
  <text x="90" y="505" text-anchor="middle" font-size="9" fill="#047857">✓ MyBatis-Plus 生态</text>

  <!-- Bottom tip -->
  <rect x="220" y="470" width="540" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="490" y="488" text-anchor="middle" font-size="11" fill="#1d4ed8">💡 90% 的审批场景不需要 BPMN 的复杂性</text>
  <text x="490" y="502" text-anchor="middle" font-size="10" fill="#1d4ed8">FlowLong 用最小的代价解决最高频的审批需求</text>
</svg>
