<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">CompileFlow 编译执行机制</text>
  <text x="400" y="55" text-anchor="middle" font-size="11" fill="#94a3b8">流程文件 → Java 代码 → 字节码 → 原生执行，零解析开销</text>

  <!-- Stage 1: Parse -->
  <g filter="url(#shadow)">
    <rect x="30" y="75" width="160" height="120" rx="12" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="110" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">1. 解析阶段</text>
  <text x="110" y="115" text-anchor="middle" font-size="9" fill="#64748b">Parser</text>
  <rect x="50" y="125" width="120" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="141" text-anchor="middle" font-size="9" font-weight="500" fill="#1d4ed8">XML → FlowModel</text>
  <text x="50" y="165" font-size="9" fill="#374151">• 解析节点定义</text>
  <text x="50" y="179" font-size="9" fill="#374151">• 解析连线与表达式</text>

  <!-- Arrow 1→2 -->
  <line x1="194" y1="135" x2="226" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Stage 2: Code Gen -->
  <g filter="url(#shadow)">
    <rect x="230" y="75" width="160" height="120" rx="12" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="310" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">2. 代码生成</text>
  <text x="310" y="115" text-anchor="middle" font-size="9" fill="#64748b">Generator</text>
  <rect x="250" y="125" width="120" height="26" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="310" y="141" text-anchor="middle" font-size="9" font-weight="500" fill="#92400e">FlowModel → .java</text>
  <text x="250" y="165" font-size="9" fill="#374151">• 生成 Java 类</text>
  <text x="250" y="179" font-size="9" fill="#374151">• 方法调用链</text>

  <!-- Arrow 2→3 -->
  <line x1="394" y1="135" x2="426" y2="135" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <!-- Stage 3: Compile -->
  <g filter="url(#shadow)">
    <rect x="430" y="75" width="160" height="120" rx="12" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="510" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">3. 编译阶段</text>
  <text x="510" y="115" text-anchor="middle" font-size="9" fill="#64748b">Janino Compiler</text>
  <rect x="450" y="125" width="120" height="26" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="510" y="141" text-anchor="middle" font-size="9" font-weight="500" fill="#5b21b6">.java → .class</text>
  <text x="450" y="165" font-size="9" fill="#374151">• 动态编译字节码</text>
  <text x="450" y="179" font-size="9" fill="#374151">• 类加载器加载</text>

  <!-- Arrow 3→4 -->
  <line x1="594" y1="135" x2="626" y2="135" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <!-- Stage 4: Execute -->
  <g filter="url(#shadow)">
    <rect x="630" y="75" width="150" height="120" rx="12" fill="white" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="705" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">4. 执行阶段</text>
  <text x="705" y="115" text-anchor="middle" font-size="9" fill="#64748b">Executor</text>
  <rect x="650" y="125" width="110" height="26" rx="5" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="705" y="141" text-anchor="middle" font-size="9" font-weight="500" fill="#047857">字节码 → JVM</text>
  <text x="650" y="165" font-size="9" fill="#374151">• 原生 Java 性能</text>
  <text x="650" y="179" font-size="9" fill="#374151">• 无反射开销</text>

  <!-- Divider -->
  <line x1="40" y1="215" x2="760" y2="215" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">对比：解释执行 vs 编译执行</text>

  <!-- Interpreted (LiteFlow) -->
  <g filter="url(#shadow)">
    <rect x="50" y="250" width="330" height="110" rx="12" fill="white" stroke="#94a3b8" stroke-width="1"/>
  </g>
  <text x="215" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">解释执行（LiteFlow 模式）</text>
  <text x="70" y="295" font-size="10" fill="#374151">每次请求：解析 DSL → 调度组件 → 执行</text>
  <text x="70" y="315" font-size="10" fill="#374151">• 有解析开销（微秒级）</text>
  <text x="70" y="332" font-size="10" fill="#374151">• 灵活，支持运行时脚本</text>
  <text x="70" y="349" font-size="10" fill="#374151">• 变更即时生效，无需编译</text>

  <!-- Compiled (CompileFlow) -->
  <g filter="url(#shadow)">
    <rect x="420" y="250" width="340" height="110" rx="12" fill="white" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="590" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">编译执行（CompileFlow 模式）</text>
  <text x="440" y="295" font-size="10" fill="#374151">首次：编译流程文件 → 生成字节码 → 缓存</text>
  <text x="440" y="315" font-size="10" fill="#374151">后续请求：直接执行编译后的字节码</text>
  <text x="440" y="332" font-size="10" fill="#374151">• 无解析开销（纳秒级调用）</text>
  <text x="440" y="349" font-size="10" fill="#374151">• 变更需重新编译流程文件</text>

  <!-- Bottom tip -->
  <rect x="130" y="372" width="540" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="387" text-anchor="middle" font-size="10" fill="#15803d">💡 CompileFlow 的 Tooling Service 可以查看生成的 Java 源码 — 调试利器</text>
</svg>
