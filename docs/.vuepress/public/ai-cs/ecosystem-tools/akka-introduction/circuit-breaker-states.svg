<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow markers (userSpaceOnUse for consistent size) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="460" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Circuit Breaker 状态机</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">Closed → Open → Half-Open：失败率触发熔断，试探请求决定恢复</text>

  <!-- ===== 1. Closed ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="200" height="120" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="40" y="90" width="200" height="40" rx="12" fill="url(#greenG)"/>
  <rect x="40" y="114" width="200" height="16" fill="url(#greenG)"/>
  <text x="140" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="white">① Closed（关闭）</text>
  <text x="140" y="150" text-anchor="middle" font-size="11" fill="#374151">正常放行请求</text>
  <text x="140" y="168" text-anchor="middle" font-size="10" fill="#64748b">统计失败次数与失败率</text>
  <text x="140" y="184" text-anchor="middle" font-size="10" fill="#64748b">调用下游服务</text>
  <text x="140" y="200" text-anchor="middle" font-size="10" fill="#64748b">维护滑动窗口计数</text>

  <!-- ===== 2. Open ===== -->
  <g filter="url(#shadow)">
    <rect x="300" y="90" width="200" height="120" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="300" y="90" width="200" height="40" rx="12" fill="url(#redG)"/>
  <rect x="300" y="114" width="200" height="16" fill="url(#redG)"/>
  <text x="400" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="white">② Open（打开）</text>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="#374151">快速失败，不调用下游</text>
  <text x="400" y="168" text-anchor="middle" font-size="10" fill="#64748b">直接返回 CircuitBreakerOpen</text>
  <text x="400" y="184" text-anchor="middle" font-size="10" fill="#64748b">异常或降级响应</text>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#64748b">等待复位时间超时</text>

  <!-- ===== 3. Half-Open ===== -->
  <g filter="url(#shadow)">
    <rect x="560" y="90" width="200" height="120" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="560" y="90" width="200" height="40" rx="12" fill="url(#amberG)"/>
  <rect x="560" y="114" width="200" height="16" fill="url(#amberG)"/>
  <text x="660" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="white">③ Half-Open（半开）</text>
  <text x="660" y="150" text-anchor="middle" font-size="11" fill="#374151">放行少量试探请求</text>
  <text x="660" y="168" text-anchor="middle" font-size="10" fill="#64748b">限制并发调用数</text>
  <text x="660" y="184" text-anchor="middle" font-size="10" fill="#64748b">探测下游是否恢复</text>
  <text x="660" y="200" text-anchor="middle" font-size="10" fill="#64748b">根据结果决定状态转换</text>

  <!-- ===== Arrow: Closed → Open (failure rate exceeds threshold) ===== -->
  <!-- Source: x=40, w=200 → right edge=240. Target: x=300, left edge=300. Gap=60, arrow x2=296 (300-4) -->
  <line x1="240" y1="150" x2="296" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="268" y="140" text-anchor="middle" font-size="9" fill="#ef4444" font-weight="600">失败率超阈值</text>

  <!-- ===== Arrow: Open → Half-Open (reset timeout) ===== -->
  <!-- Source: x=300, w=200 → right edge=500. Target: x=560, left edge=560. Gap=60, arrow x2=556 (560-4) -->
  <line x1="500" y1="150" x2="556" y2="150" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="528" y="140" text-anchor="middle" font-size="9" fill="#f59e0b" font-weight="600">复位超时</text>

  <!-- ===== Arrow: Half-Open → Closed (test requests succeed) ===== -->
  <!-- Path: from Half-Open bottom (x=600, y=210) → down to y=245 → left to x=140 → up to y=214 (210+4 gap) -->
  <path d="M 600 210 L 600 245 L 140 245 L 140 214" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="370" y="237" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">✓ 试探请求成功</text>

  <!-- ===== Arrow: Half-Open → Open (test requests fail) ===== -->
  <!-- Path: from Half-Open bottom (x=720, y=210) → down to y=280 → left to x=400 → up to y=214 (210+4 gap) -->
  <path d="M 720 210 L 720 280 L 400 280 L 400 214" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)" stroke-dasharray="5 3"/>
  <text x="560" y="272" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">✗ 试探请求失败</text>

  <!-- ===== Bottom: Key Parameters ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="305" width="720" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <text x="60" y="329" font-size="12" font-weight="600" fill="#475569">关键参数</text>

  <!-- Param 1 -->
  <g transform="translate(60, 339)">
    <rect x="0" y="0" width="210" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">maxFailures</text>
    <text x="105" y="37" text-anchor="middle" font-size="10" fill="#64748b">触发熔断的最大失败次数</text>
    <text x="105" y="51" text-anchor="middle" font-size="10" fill="#64748b">默认 5 次</text>
  </g>

  <!-- Param 2 -->
  <g transform="translate(295, 339)">
    <rect x="0" y="0" width="210" height="55" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">callTimeout / resetTimeout</text>
    <text x="105" y="37" text-anchor="middle" font-size="10" fill="#64748b">调用超时 / 复位等待</text>
    <text x="105" y="51" text-anchor="middle" font-size="10" fill="#64748b">决定何时进入 Half-Open</text>
  </g>

  <!-- Param 3 -->
  <g transform="translate(530, 339)">
    <rect x="0" y="0" width="210" height="55" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">maxResetRetries</text>
    <text x="105" y="37" text-anchor="middle" font-size="10" fill="#64748b">Half-Open 阶段放行数</text>
    <text x="105" y="51" text-anchor="middle" font-size="10" fill="#64748b">成功 → Closed，失败 → Open</text>
  </g>

  <!-- ===== Bottom tip ===== -->
  <rect x="170" y="420" width="460" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="400" y="434" text-anchor="middle" font-size="10" fill="#92400e">💡 熔断器是「闸门」而非「重试」—— 快速失败保护上游，避免级联雪崩</text>
</svg>
