<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="660" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Graph Engineering 实践建议</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">从「不用 Graph」到「考虑 Graph」到「常见踩坑」的决策路径</text>

  <!-- ===== Step 1: 不用 Graph ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="65" width="760" height="120" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="30" y="65" width="760" height="30" rx="10" fill="url(#greenG)"/>
  <rect x="30" y="83" width="760" height="12" fill="url(#greenG)"/>
  <text x="50" y="86" font-size="13" font-weight="700" fill="white">✅ 什么时候不用 Graph</text>

  <!-- 4 items in a row -->
  <rect x="50" y="108" width="170" height="30" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="135" y="128" text-anchor="middle" font-size="10" fill="#047857">目标单一、有验收标准</text>

  <rect x="240" y="108" width="170" height="30" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="325" y="128" text-anchor="middle" font-size="10" fill="#047857">可被验证器闭环</text>

  <rect x="430" y="108" width="170" height="30" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="515" y="128" text-anchor="middle" font-size="10" fill="#047857">没有并行需要</text>

  <rect x="620" y="108" width="155" height="30" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="697" y="128" text-anchor="middle" font-size="10" fill="#047857">单次会话可完成</text>

  <text x="410" y="165" text-anchor="middle" font-size="10" fill="#64748b">→ 一个好 Agent 或 Loop 已经足够</text>

  <!-- Arrow down -->
  <line x1="410" y1="185" x2="410" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="202" text-anchor="start" font-size="9" fill="#94a3b8">观察到信号？</text>

  <!-- ===== Step 2: 考虑 Graph ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="215" width="760" height="180" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="30" y="215" width="760" height="30" rx="10" fill="url(#amberG)"/>
  <rect x="30" y="233" width="760" height="12" fill="url(#amberG)"/>
  <text x="50" y="236" font-size="13" font-weight="700" fill="white">⚠️ 什么时候开始考虑 Graph</text>

  <!-- 6 signal items in 2 columns x 3 rows -->
  <rect x="50" y="258" width="350" height="32" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="279" font-size="10" fill="#92400e">⚠️ Agent 频繁切换身份 → 拆成多个节点</text>

  <rect x="420" y="258" width="350" height="32" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="430" y="279" font-size="10" fill="#92400e">⚠️ 有可并行子任务 → 用并行边</text>

  <rect x="50" y="298" width="350" height="32" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="319" font-size="10" fill="#92400e">⚠️ 不同步骤需不同模型/权限 → 节点级配置</text>

  <rect x="420" y="298" width="350" height="32" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="430" y="319" font-size="10" fill="#92400e">⚠️ 需要审计决策路径 → 显式 Graph</text>

  <rect x="50" y="338" width="350" height="32" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="359" font-size="10" fill="#92400e">⚠️ 执行和验证混在一起 → 独立验证节点</text>

  <rect x="420" y="338" width="350" height="32" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="430" y="359" font-size="10" fill="#92400e">⚠️ 需要中途暂停和恢复 → 状态持久化</text>

  <text x="410" y="388" text-anchor="middle" font-size="10" fill="#64748b">→ 开始设计 Graph，但注意避开常见踩坑</text>

  <!-- Arrow down -->
  <line x1="410" y1="395" x2="410" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 3: 常见踩坑 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="425" width="760" height="210" rx="10" fill="white" stroke="#f43f5e" stroke-width="2"/>
  </g>
  <rect x="30" y="425" width="760" height="30" rx="10" fill="url(#roseG)"/>
  <rect x="30" y="443" width="760" height="12" fill="url(#roseG)"/>
  <text x="50" y="446" font-size="13" font-weight="700" fill="white">❌ 常见踩坑</text>

  <!-- 6 pitfall items in 2 columns x 3 rows -->
  <rect x="50" y="468" width="350" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="60" y="486" font-size="10" fill="#991b1b" font-weight="600">1. 过度图化</text>
  <text x="60" y="503" font-size="9" fill="#b91c1c">3 步简单流程不需要 Graph，Chain/Loop 更合适</text>

  <rect x="420" y="468" width="350" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="430" y="486" font-size="10" fill="#991b1b" font-weight="600">2. 节点粒度不当</text>
  <text x="430" y="503" font-size="9" fill="#b91c1c">太细→函数编排，太粗→退化为单 Agent</text>

  <rect x="50" y="522" width="350" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="60" y="540" font-size="10" fill="#991b1b" font-weight="600">3. State 设计混乱</text>
  <text x="60" y="557" font-size="9" fill="#b91c1c">State 是节点间通信通道，不是全局变量</text>

  <rect x="420" y="522" width="350" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="430" y="540" font-size="10" fill="#991b1b" font-weight="600">4. 忽视成本</text>
  <text x="430" y="557" font-size="9" fill="#b91c1c">多 Agent token ~15×，任务价值必须覆盖成本</text>

  <rect x="50" y="576" width="350" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="60" y="594" font-size="10" fill="#991b1b" font-weight="600">5. 循环无终点</text>
  <text x="60" y="611" font-size="9" fill="#b91c1c">带环 Graph 必须有明确终止条件</text>

  <rect x="420" y="576" width="350" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="430" y="594" font-size="10" fill="#991b1b" font-weight="600">6. 忽视可观测性</text>
  <text x="430" y="611" font-size="9" fill="#b91c1c">Graph 路径比线性链难追踪，需记录走了哪条路</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="190" y="642" width="440" height="14" rx="7" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="653" text-anchor="middle" font-size="10" fill="#15803d">💡 先确认"是否需要 Graph"，再考虑"怎么设计 Graph"</text>
</svg>
