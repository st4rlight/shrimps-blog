<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="440" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">共享内存 + 锁 vs Actor 模型</text>

  <!-- ===== Left: Shared Memory + Lock ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="60" width="340" height="350" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="30" y="60" width="340" height="46" rx="12" fill="url(#redGrad)"/>
  <rect x="30" y="90" width="340" height="16" fill="url(#redGrad)"/>
  <text x="200" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="white">共享内存 + 锁</text>

  <!-- Shared state -->
  <rect x="130" y="122" width="140" height="32" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">共享可变状态</text>

  <!-- Thread 1 -->
  <g transform="translate(50, 168)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Thread 1</text>
    <text x="70" y="38" text-anchor="middle" font-size="10" fill="#64748b">lock() → 修改</text>
    <text x="70" y="54" text-anchor="middle" font-size="10" fill="#64748b">→ unlock()</text>
    <text x="70" y="68" text-anchor="middle" font-size="9" fill="#ef4444">~1MB 栈空间</text>
  </g>

  <!-- Thread 2 -->
  <g transform="translate(210, 168)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Thread 2</text>
    <text x="70" y="38" text-anchor="middle" font-size="10" fill="#64748b">等待锁...</text>
    <text x="70" y="54" text-anchor="middle" font-size="10" fill="#64748b">→ 获取锁</text>
    <text x="70" y="68" text-anchor="middle" font-size="9" fill="#ef4444">阻塞 / 上下文切换</text>
  </g>

  <!-- Lock icon -->
  <g transform="translate(185, 175)">
    <rect x="0" y="8" width="30" height="22" rx="4" fill="#ef4444"/>
    <path d="M 5 8 L 5 4 Q 5 -2 15 -2 Q 25 -2 25 4 L 25 8" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <text x="15" y="24" text-anchor="middle" font-size="10" fill="white">🔒</text>
  </g>

  <!-- Problems -->
  <line x1="50" y1="255" x2="350" y2="255" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="273" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">问题</text>
  <g transform="translate(50, 285)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="11" fill="#64748b">锁竞争：上下文切换开销剧增</text>
  </g>
  <g transform="translate(50, 305)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="11" fill="#64748b">死锁风险：多锁顺序不一致</text>
  </g>
  <g transform="translate(50, 325)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="11" fill="#64748b">竞态条件：难以复现和调试</text>
  </g>
  <g transform="translate(50, 345)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="11" fill="#64748b">线程开销：数万线程 = 数十 GB</text>
  </g>
  <g transform="translate(50, 365)">
    <circle cx="6" cy="6" r="6" fill="#fee2e2"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#ef4444">✗</text>
    <text x="20" y="10" font-size="11" fill="#64748b">防御式编程：到处 try-catch</text>
  </g>

  <!-- VS circle -->
  <circle cx="390" cy="235" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="390" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">VS</text>

  <!-- ===== Right: Actor Model ===== -->
  <g filter="url(#shadow)">
    <rect x="410" y="60" width="340" height="350" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="410" y="60" width="340" height="46" rx="12" fill="url(#greenGrad)"/>
  <rect x="410" y="90" width="340" height="16" fill="url(#greenGrad)"/>
  <text x="580" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="white">Actor 模型</text>

  <!-- No shared state -->
  <rect x="510" y="122" width="140" height="32" rx="8" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="580" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">不共享 · 只传消息</text>

  <!-- Actor 1 -->
  <g transform="translate(430, 168)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Actor 1</text>
    <text x="70" y="38" text-anchor="middle" font-size="10" fill="#64748b">私有状态</text>
    <text x="70" y="54" text-anchor="middle" font-size="10" fill="#64748b">→ 发送消息 →</text>
    <text x="70" y="68" text-anchor="middle" font-size="9" fill="#10b981">~300 字节</text>
  </g>

  <!-- Actor 2 -->
  <g transform="translate(590, 168)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Actor 2</text>
    <text x="70" y="38" text-anchor="middle" font-size="10" fill="#64748b">Mailbox 排队</text>
    <text x="70" y="54" text-anchor="middle" font-size="10" fill="#64748b">串行处理</text>
    <text x="70" y="68" text-anchor="middle" font-size="9" fill="#10b981">无阻塞 · 无锁</text>
  </g>

  <!-- Message arrow -->
  <line x1="570" y1="190" x2="590" y2="190" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Advantages -->
  <line x1="430" y1="255" x2="730" y2="255" stroke="#e2e8f0" stroke-width="1"/>
  <text x="580" y="273" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">优势</text>
  <g transform="translate(430, 285)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="11" fill="#64748b">无锁：状态私有，天然线程安全</text>
  </g>
  <g transform="translate(430, 305)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="11" fill="#64748b">无死锁：不共享就不会死锁</text>
  </g>
  <g transform="translate(430, 325)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="11" fill="#64748b">极轻量：单 JVM 百万级 Actor</text>
  </g>
  <g transform="translate(430, 345)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="11" fill="#64748b">Let-It-Crash：监督者自动恢复</text>
  </g>
  <g transform="translate(430, 365)">
    <circle cx="6" cy="6" r="6" fill="#d1fae5"/>
    <text x="6" y="9" text-anchor="middle" font-size="8" fill="#10b981">✓</text>
    <text x="20" y="10" font-size="11" fill="#64748b">位置透明：本地/远程无感</text>
  </g>

  <!-- Arrow marker for green -->
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Bottom tip -->
  <rect x="140" y="422" width="500" height="16" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="390" y="433" text-anchor="middle" font-size="10" fill="#15803d">💡 核心转变：从"共享 + 锁"到"隔离 + 消息"——不共享就不会有竞争</text>
</svg>