<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Agent 协议栈全景</text>
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">三大开放协议各司其职，协同工作</text>

  <!-- ===== Layer 1: User (Top) ===== -->
  <g filter="url(#shadow)">
    <rect x="290" y="80" width="240" height="50" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="290" y="80" width="240" height="22" rx="10" fill="url(#indigoG)"/>
  <rect x="290" y="92" width="240" height="10" fill="url(#indigoG)"/>
  <text x="410" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="white">👤 用户 / 前端应用</text>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#64748b">浏览器 · 移动端 · 桌面应用</text>

  <!-- Arrow: User → AG-UI -->
  <line x1="410" y1="130" x2="410" y2="165" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <!-- ===== Layer 2: AG-UI ===== -->
  <g filter="url(#shadow)">
    <rect x="100" y="170" width="620" height="100" rx="12" fill="white" stroke="#3b82f6" stroke-width="2.5"/>
  </g>
  <rect x="100" y="170" width="620" height="36" rx="12" fill="url(#blueG)"/>
  <rect x="100" y="190" width="620" height="16" fill="url(#blueG)"/>
  <text x="410" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="white">AG-UI  Agent ↔ User Interaction</text>
  <text x="410" y="230" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">Agent 怎么把结果推给用户、用户怎么在流程中插手</text>
  <text x="410" y="250" text-anchor="middle" font-size="11" fill="#64748b">事件流 · 流式输出 · Human-in-the-Loop · 状态同步</text>
  <!-- Tags -->
  <rect x="160" y="232" width="70" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="195" y="246" text-anchor="middle" font-size="9" fill="#1d4ed8">CopilotKit</text>
  <rect x="590" y="232" width="70" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="625" y="246" text-anchor="middle" font-size="9" fill="#1d4ed8">2025.05</text>

  <!-- Arrow: AG-UI → A2A (left down) -->
  <line x1="250" y1="270" x2="250" y2="305" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <!-- Arrow: AG-UI → MCP (right down) -->
  <line x1="570" y1="270" x2="570" y2="305" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowV)"/>

  <!-- ===== Layer 3 Left: A2A ===== -->
  <g filter="url(#shadow)">
    <rect x="60" y="310" width="380" height="90" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="60" y="310" width="380" height="32" rx="12" fill="url(#greenG)"/>
  <rect x="60" y="328" width="380" height="14" fill="url(#greenG)"/>
  <text x="250" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="white">A2A  Agent ↔ Agent</text>
  <text x="250" y="364" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">多个 Agent 之间怎么协调、分工</text>
  <text x="250" y="382" text-anchor="middle" font-size="10" fill="#64748b">Agent Card · 任务生命周期 · JSON-RPC</text>
  <rect x="80" y="362" width="60" height="18" rx="4" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="110" y="375" text-anchor="middle" font-size="9" fill="#047857">Google</text>

  <!-- ===== Layer 3 Right: MCP ===== -->
  <g filter="url(#shadow)">
    <rect x="380" y="310" width="380" height="90" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="380" y="310" width="380" height="32" rx="12" fill="url(#violetG)"/>
  <rect x="380" y="328" width="380" height="14" fill="url(#violetG)"/>
  <text x="570" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="white">MCP  Agent ↔ Tool / Data</text>
  <text x="570" y="364" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="600">Agent 怎么安全地调用外部工具、获取上下文</text>
  <text x="570" y="382" text-anchor="middle" font-size="10" fill="#64748b">Tools · Resources · Prompts · SSE/stdio</text>
  <rect x="400" y="362" width="70" height="18" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="435" y="375" text-anchor="middle" font-size="9" fill="#5b21b6">Anthropic</text>

  <!-- ===== Layer 4: Bottom - Agent Backends ===== -->
  <text x="410" y="434" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="500">Agent 后端框架（可同时使用三个协议）</text>

  <g filter="url(#shadow)">
    <rect x="80" y="445" width="120" height="40" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="140" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">LangGraph</text>

  <g filter="url(#shadow)">
    <rect x="220" y="445" width="120" height="40" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="280" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">CrewAI</text>

  <g filter="url(#shadow)">
    <rect x="360" y="445" width="120" height="40" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="420" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Mastra</text>

  <g filter="url(#shadow)">
    <rect x="500" y="445" width="120" height="40" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="560" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">AG2</text>

  <g filter="url(#shadow)">
    <rect x="640" y="445" width="120" height="40" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="700" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">LlamaIndex</text>

  <!-- Dashed lines from A2A and MCP to backends -->
  <line x1="250" y1="400" x2="250" y2="430" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="570" y1="400" x2="570" y2="430" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="140" y1="445" x2="140" y2="425" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="700" y1="445" x2="700" y2="425" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ===== Bottom tip ===== -->
  <rect x="120" y="515" width="580" height="30" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="534" text-anchor="middle" font-size="11" fill="#64748b">💡 MCP 管"向下连工具"，A2A 管"横向连同伴"，AG-UI 管"向上连用户" —— 不是三选一，而是协同工作</text>
</svg>