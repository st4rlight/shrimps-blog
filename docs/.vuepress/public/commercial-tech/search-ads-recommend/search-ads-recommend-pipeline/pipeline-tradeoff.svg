<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="700" height="400" rx="14" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">搜广推系统核心权衡</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">漏斗各层在多个维度的取舍策略</text>

  <!-- ===== Axes ===== -->
  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="30" y="220" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600" transform="rotate(-90 30 220)">模型复杂度 / 计算成本</text>

  <!-- X-axis -->
  <line x1="60" y1="360" x2="660" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="392" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">候选数量 →</text>

  <!-- Grid lines (dashed) -->
  <line x1="80" y1="150" x2="640" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="80" y1="220" x2="640" y2="220" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="80" y1="290" x2="640" y2="290" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="200" y1="80" x2="200" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="360" y1="80" x2="360" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="500" y1="80" x2="500" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== Tradeoff curve ===== -->
  <!-- Hyperbolic-like curve: more candidates = less complex model per candidate -->
  <path d="M 120 100 C 160 130, 220 180, 300 230 C 380 280, 480 320, 620 345"
        fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="140" y="96" font-size="10" fill="#3b82f6" font-weight="600">精排</text>
  <text x="620" y="340" font-size="10" fill="#3b82f6" font-weight="600">召回</text>

  <!-- ===== Optimal zone ===== -->
  <rect x="200" y="190" width="160" height="80" rx="8" fill="#dcfce7" fill-opacity="0.5" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">最佳实践区</text>
  <text x="280" y="235" text-anchor="middle" font-size="10" fill="#64748b">粗排处于效率与效果</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#64748b">的平衡点</text>

  <!-- ===== Data points for each stage ===== -->
  <!-- Recall: many candidates, low complexity -->
  <circle cx="580" cy="330" r="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="580" y="334" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">召回</text>

  <!-- Pre-Ranking: medium candidates, medium complexity -->
  <circle cx="350" cy="250" r="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="254" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">粗排</text>

  <!-- Ranking: few candidates, high complexity -->
  <circle cx="160" cy="130" r="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">精排</text>

  <!-- Re-Ranking: few candidates, medium-high complexity -->
  <circle cx="120" cy="170" r="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="120" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#5b21b6">重排</text>

  <!-- ===== Annotations ===== -->
  <!-- Recall annotation -->
  <line x1="580" y1="320" x2="580" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="580" y="294" text-anchor="middle" font-size="9" fill="#64748b">亿级候选</text>
  <text x="580" y="306" text-anchor="middle" font-size="9" fill="#64748b">毫秒级延迟</text>

  <!-- Ranking annotation -->
  <line x1="160" y1="120" x2="160" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="160" y="94" text-anchor="middle" font-size="9" fill="#64748b">数十候选</text>
  <text x="160" y="106" text-anchor="middle" font-size="9" fill="#64748b">最贵模型</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="150" y="375" width="400" height="20" rx="10" fill="#f1f5f9"/>
  <text x="350" y="389" text-anchor="middle" font-size="10" fill="#64748b">💡 每层用"刚好够用"的模型复杂度，把最贵的计算留给最少的候选</text>
</svg>
