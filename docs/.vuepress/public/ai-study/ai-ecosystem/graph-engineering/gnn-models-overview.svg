<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="420" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">GNN 三大模型架构对比</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">GCN · GraphSAGE · GAT 的消息传递机制</text>

  <!-- ===== Card 1: GCN ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="235" height="290" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="235" height="35" rx="10" fill="url(#blueG)"/>
  <rect x="30" y="95" width="235" height="20" fill="url(#blueG)"/>
  <text x="147" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="white">GCN</text>

  <text x="147" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">图卷积网络</text>
  <text x="147" y="153" text-anchor="middle" font-size="10" fill="#64748b">谱图卷积一阶近似</text>

  <!-- Node diagram -->
  <circle cx="147" cy="200" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="147" y="204" text-anchor="middle" font-size="10" fill="#1d4ed8">v</text>
  <circle cx="110" cy="185" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="110" y="189" text-anchor="middle" font-size="8" fill="#3b82f6">u1</text>
  <circle cx="184" cy="185" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="184" y="189" text-anchor="middle" font-size="8" fill="#3b82f6">u2</text>
  <circle cx="120" cy="225" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="120" y="229" text-anchor="middle" font-size="8" fill="#3b82f6">u3</text>
  <circle cx="174" cy="225" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="174" y="229" text-anchor="middle" font-size="8" fill="#3b82f6">u4</text>

  <text x="147" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">聚合：归一化均值</text>
  <text x="147" y="280" text-anchor="middle" font-size="10" fill="#64748b">h' = σ(D̃⁻¹ᐟ² Ã D̃⁻¹ᐟ² hW)</text>

  <rect x="50" y="295" width="195" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="312" font-size="9" fill="#10b981">✓ 简洁有效</text>
  <text x="60" y="327" font-size="9" fill="#10b981">✓ 两层即可好效果</text>
  <text x="60" y="342" font-size="9" fill="#ef4444">✗ 转导式（需全图）</text>

  <!-- ===== Card 2: GraphSAGE ===== -->
  <g filter="url(#shadow)">
    <rect x="285" y="80" width="235" height="290" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="285" y="80" width="235" height="35" rx="10" fill="url(#greenG)"/>
  <rect x="285" y="95" width="235" height="20" fill="url(#greenG)"/>
  <text x="402" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="white">GraphSAGE</text>

  <text x="402" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">归纳式图学习</text>
  <text x="402" y="153" text-anchor="middle" font-size="10" fill="#64748b">采样 + 聚合</text>

  <!-- Node diagram with sampling -->
  <circle cx="402" cy="200" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="402" y="204" text-anchor="middle" font-size="10" fill="#047857">v</text>
  <circle cx="365" cy="185" r="14" fill="#d1fae5" stroke="#86efac" stroke-width="1.5"/>
  <text x="365" y="189" text-anchor="middle" font-size="8" fill="#10b981">u1</text>
  <circle cx="439" cy="185" r="14" fill="#d1fae5" stroke="#86efac" stroke-width="1.5"/>
  <text x="439" y="189" text-anchor="middle" font-size="8" fill="#10b981">u2</text>
  <!-- Sampled (dashed) nodes -->
  <circle cx="365" cy="225" r="12" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="365" y="229" text-anchor="middle" font-size="8" fill="#64748b">u3</text>
  <circle cx="439" cy="225" r="12" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="439" y="229" text-anchor="middle" font-size="8" fill="#64748b">u4</text>
  <text x="402" y="252" text-anchor="middle" font-size="8" fill="#64748b">虚线=采样K个</text>

  <text x="402" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">聚合：采样+均值/LSTM</text>
  <text x="402" y="288" text-anchor="middle" font-size="9" fill="#64748b">h' = σ(W · [h_v || agg(N)])</text>

  <rect x="305" y="295" width="195" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="315" y="312" font-size="9" fill="#10b981">✓ 归纳式（可推理新节点）</text>
  <text x="315" y="327" font-size="9" fill="#10b981">✓ 邻居采样控规模</text>
  <text x="315" y="342" font-size="9" fill="#10b981">✓ 工业界首选 (PinSage)</text>

  <!-- ===== Card 3: GAT ===== -->
  <g filter="url(#shadow)">
    <rect x="540" y="80" width="235" height="290" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="540" y="80" width="235" height="35" rx="10" fill="url(#amberG)"/>
  <rect x="540" y="95" width="235" height="20" fill="url(#amberG)"/>
  <text x="657" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="white">GAT</text>

  <text x="657" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">图注意力网络</text>
  <text x="657" y="153" text-anchor="middle" font-size="10" fill="#64748b">注意力机制学习权重</text>

  <!-- Node diagram with attention weights -->
  <circle cx="657" cy="200" r="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="657" y="204" text-anchor="middle" font-size="10" fill="#92400e">v</text>
  <circle cx="620" cy="185" r="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="620" y="189" text-anchor="middle" font-size="8" fill="#92400e">u1</text>
  <text x="615" y="172" text-anchor="end" font-size="9" font-weight="700" fill="#f59e0b">0.6</text>
  <circle cx="694" cy="185" r="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="694" y="189" text-anchor="middle" font-size="8" fill="#92400e">u2</text>
  <text x="699" y="172" font-size="9" font-weight="700" fill="#f59e0b">0.3</text>
  <circle cx="630" cy="225" r="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="630" y="229" text-anchor="middle" font-size="8" fill="#92400e">u3</text>
  <text x="625" y="242" text-anchor="end" font-size="9" font-weight="700" fill="#f59e0b">0.1</text>

  <text x="657" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">聚合：注意力加权求和</text>
  <text x="657" y="280" text-anchor="middle" font-size="9" fill="#64748b">α = softmax(LeakyReLU(aᵀ[Wh||Wh]))</text>

  <rect x="560" y="295" width="195" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="570" y="312" font-size="9" fill="#10b981">✓ 可解释（注意力权重）</text>
  <text x="570" y="327" font-size="9" fill="#10b981">✓ 区分邻居重要性</text>
  <text x="570" y="342" font-size="9" fill="#ef4444">✗ 计算开销较大</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="385" width="540" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#15803d">💡 GCN 简洁基线 · GraphSAGE 工业首选 · GAT 可解释性</text>
</svg>
