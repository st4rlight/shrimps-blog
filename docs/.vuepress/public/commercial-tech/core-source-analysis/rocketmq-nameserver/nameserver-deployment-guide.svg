<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowY" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowN" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="540" rx="16" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">NameServer 运维部署决策指南</text>
  <text x="410" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">根据场景选择合适的部署方案与参数配置</text>

  <!-- ===== Start node ===== -->
  <rect x="300" y="85" width="220" height="40" rx="20" fill="url(#indigoG)" filter="url(#shadow)"/>
  <text x="410" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="white">确定部署场景</text>

  <!-- Arrow to decision 1 -->
  <line x1="410" y1="125" x2="410" y2="156" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- ===== Decision 1: 环境类型 ===== -->
  <polygon points="410,160 560,200 410,240 260,200" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">环境类型？</text>
  <text x="410" y="212" text-anchor="middle" font-size="11" fill="#92400e">(生产/开发)</text>

  <!-- Arrow: 否 (left) → 开发方案 -->
  <line x1="260" y1="200" x2="194" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="225" y="192" text-anchor="middle" font-size="10" fill="#64748b">否</text>

  <!-- Arrow: 是 (down) → decision 2 -->
  <line x1="410" y1="240" x2="410" y2="271" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="418" y="258" font-size="10" font-weight="600" fill="#f59e0b">是</text>

  <!-- ===== 开发/测试方案 (left) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="175" width="165" height="90" rx="10" fill="white" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <rect x="30" y="175" width="165" height="28" rx="10" fill="url(#greenG)"/>
  <rect x="30" y="189" width="165" height="14" fill="url(#greenG)"/>
  <text x="112" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="white">开发/测试</text>
  <text x="112" y="225" text-anchor="middle" font-size="11" fill="#374151">1 个 NameServer</text>
  <text x="112" y="245" text-anchor="middle" font-size="11" fill="#64748b">简化部署，低资源</text>

  <!-- ===== Decision 2: 集群规模 ===== -->
  <polygon points="410,275 570,315 410,355 250,315" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">集群规模大？</text>
  <text x="410" y="327" text-anchor="middle" font-size="11" fill="#92400e">(多机房/高可用)</text>

  <!-- Arrow: 否 (left) → 标准方案 -->
  <line x1="250" y1="315" x2="234" y2="315" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <text x="240" y="307" text-anchor="middle" font-size="10" fill="#64748b">否</text>

  <!-- Arrow: 是 (right) → 大规模方案 -->
  <line x1="570" y1="315" x2="586" y2="315" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="580" y="307" text-anchor="middle" font-size="10" font-weight="600" fill="#f59e0b">是</text>

  <!-- ===== 标准生产方案 (center-left) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="290" width="200" height="90" rx="10" fill="white" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <rect x="30" y="290" width="200" height="28" rx="10" fill="url(#greenG)"/>
  <rect x="30" y="304" width="200" height="14" fill="url(#greenG)"/>
  <text x="130" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="white">标准生产</text>
  <text x="130" y="340" text-anchor="middle" font-size="11" fill="#374151">2 个 NameServer</text>
  <text x="130" y="360" text-anchor="middle" font-size="11" fill="#64748b">独立部署，避免单点故障</text>

  <!-- ===== 大规模方案 (right) ===== -->
  <g filter="url(#shadow)">
    <rect x="590" y="290" width="200" height="90" rx="10" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <rect x="590" y="290" width="200" height="28" rx="10" fill="url(#amberG)"/>
  <rect x="590" y="304" width="200" height="14" fill="url(#amberG)"/>
  <text x="690" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="white">大规模集群</text>
  <text x="690" y="340" text-anchor="middle" font-size="11" fill="#374151">3+ NameServer</text>
  <text x="690" y="360" text-anchor="middle" font-size="11" fill="#64748b">分散到不同机房，防机房级故障</text>

  <!-- ===== 参数建议区 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="410" width="380" height="100" rx="10" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <rect x="30" y="410" width="380" height="28" rx="10" fill="#3b82f6"/>
  <rect x="30" y="424" width="380" height="14" fill="#3b82f6"/>
  <text x="220" y="429" text-anchor="middle" font-size="12" font-weight="700" fill="white">关键参数调优</text>
  <text x="50" y="455" font-size="10" fill="#374151">• serverWorkerThreads: 默认8，高负载→16</text>
  <text x="50" y="472" font-size="10" fill="#374151">• serverSelectorThreads: 默认8，高并发→16</text>
  <text x="50" y="489" font-size="10" fill="#374151">• brokerHeartbeatMaxExpire: 默认120s（保持默认）</text>
  <text x="50" y="506" font-size="10" fill="#374151">• brokerHeartbeatInterval: 默认30s（不建议改）</text>

  <!-- ===== 故障排查区 ===== -->
  <g filter="url(#shadow)">
    <rect x="430" y="410" width="360" height="100" rx="10" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <rect x="430" y="410" width="360" height="28" rx="10" fill="#8b5cf6"/>
  <rect x="430" y="424" width="360" height="14" fill="#8b5cf6"/>
  <text x="610" y="429" text-anchor="middle" font-size="12" font-weight="700" fill="white">常见故障排查</text>
  <text x="450" y="455" font-size="10" fill="#374151">• No Topic Route Info → 检查Broker注册</text>
  <text x="450" y="472" font-size="10" fill="#374151">• 消费延迟 → 检查心跳时间戳和网络</text>
  <text x="450" y="489" font-size="10" fill="#374151">• 路由不一致 → 对比各NS节点路由表</text>
  <text x="450" y="506" font-size="10" fill="#374151">• Broker频繁上下线 → 查GC日志/网络</text>
</svg>
