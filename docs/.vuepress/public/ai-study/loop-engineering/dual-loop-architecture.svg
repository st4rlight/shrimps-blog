<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">双层循环架构</text>
  <text x="410" y="50" text-anchor="middle" font-size="12" fill="#94a3b8">内循环把任务做好，外循环决定做什么并持续改进</text>

  <!-- ===== Outer Loop Container ===== -->
  <g filter="url(#shadowLg)">
    <rect x="20" y="68" width="780" height="420" rx="12" fill="white" stroke="#6366f1" stroke-width="2.5"/>
  </g>
  <rect x="20" y="68" width="780" height="34" rx="12" fill="url(#indigoG)"/>
  <rect x="20" y="88" width="780" height="14" fill="url(#indigoG)"/>
  <text x="40" y="90" text-anchor="start" font-size="14" font-weight="700" fill="white">🔄 外循环（Outer Loop）</text>
  <text x="780" y="90" text-anchor="end" font-size="11" font-weight="500" fill="white">Agent 接下来应该做什么？</text>

  <!-- Outer Loop: 5 phases arranged around the inner loop -->
  <!-- Phase 1: Trigger -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="130" height="50" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="40" y="120" width="130" height="20" rx="8" fill="url(#amberG)"/>
  <rect x="40" y="132" width="130" height="8" fill="url(#amberG)"/>
  <text x="105" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="white">① 触发</text>
  <text x="105" y="156" text-anchor="middle" font-size="9" fill="#64748b">定时 / 事件 / 心跳</text>

  <!-- Phase 5: Improve (top right) -->
  <g filter="url(#shadow)">
    <rect x="650" y="120" width="130" height="50" rx="8" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="650" y="120" width="130" height="20" rx="8" fill="url(#greenG)"/>
  <rect x="650" y="132" width="130" height="8" fill="url(#greenG)"/>
  <text x="715" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="white">⑤ 持续改进</text>
  <text x="715" y="156" text-anchor="middle" font-size="9" fill="#64748b">经验沉淀 / 技能更新</text>

  <!-- Phase 4: Monitor (bottom right) -->
  <g filter="url(#shadow)">
    <rect x="650" y="400" width="130" height="50" rx="8" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="650" y="400" width="130" height="20" rx="8" fill="url(#violetG)"/>
  <rect x="650" y="412" width="130" height="8" fill="url(#violetG)"/>
  <text x="715" y="414" text-anchor="middle" font-size="10" font-weight="600" fill="white">④ 结果监控</text>
  <text x="715" y="436" text-anchor="middle" font-size="9" fill="#64748b">评分 / 审核 / 验证</text>

  <!-- Phase 2: State (bottom left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="400" width="130" height="50" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="40" y="400" width="130" height="20" rx="8" fill="url(#blueG)"/>
  <rect x="40" y="412" width="130" height="8" fill="url(#blueG)"/>
  <text x="105" y="414" text-anchor="middle" font-size="10" font-weight="600" fill="white">② 状态保持</text>
  <text x="105" y="436" text-anchor="middle" font-size="9" fill="#64748b">记忆 / 进度 / 经验</text>

  <!-- Outer loop arrows: 1→Inner→2→3→4→5→1 -->
  <!-- 1 → Inner Loop (top) -->
  <line x1="170" y1="145" x2="195" y2="145" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowA)"/>
  <!-- Inner → 2 (bottom left) -->
  <line x1="195" y1="425" x2="175" y2="425" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowB)"/>
  <!-- 2 → 3 (bottom, state to info share) -->
  <line x1="170" y1="425" x2="195" y2="425" stroke="#3b82f6" stroke-width="2"/>
  <!-- 3 (info share, bottom center) -->
  <g filter="url(#shadow)">
    <rect x="330" y="455" width="160" height="38" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="410" y="479" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">③ 信息共享</text>
  <line x1="170" y1="425" x2="320" y2="425" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="320" y1="425" x2="350" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <!-- 3 → 4 -->
  <line x1="490" y1="474" x2="510" y2="425" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="510" y1="425" x2="648" y2="425" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 4 → 5 (right side) -->
  <line x1="715" y1="400" x2="715" y2="172" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- 5 → 1 (top, via arrow) -->
  <path d="M 650 145 Q 400 100 172 145" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <text x="410" y="110" text-anchor="middle" font-size="9" fill="#10b981">外循环闭环</text>

  <!-- ===== Inner Loop Container ===== -->
  <g filter="url(#shadowLg)">
    <rect x="195" y="185" width="430" height="200" rx="10" fill="white" stroke="#10b981" stroke-width="2.5"/>
  </g>
  <rect x="195" y="185" width="430" height="32" rx="10" fill="url(#greenG)"/>
  <rect x="195" y="205" width="430" height="12" fill="url(#greenG)"/>
  <text x="410" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="white">⚙️ 内循环（Agent Loop）—— 把给定任务做好</text>

  <!-- Inner Loop Steps -->
  <!-- Step A: Read Context -->
  <g filter="url(#shadow)">
    <rect x="215" y="232" width="120" height="42" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="275" y="251" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">读取上下文</text>
  <text x="275" y="265" text-anchor="middle" font-size="9" fill="#64748b">Context + Skills</text>

  <!-- Arrow A→B -->
  <line x1="335" y1="253" x2="355" y2="253" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step B: LLM Reason -->
  <g filter="url(#shadow)">
    <rect x="360" y="225" width="100" height="56" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="410" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">🧠 LLM</text>
  <text x="410" y="264" text-anchor="middle" font-size="9" fill="#64748b">推理 + 决策</text>

  <!-- Arrow B→C -->
  <line x1="460" y1="253" x2="480" y2="253" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step C: Execute Tool -->
  <g filter="url(#shadow)">
    <rect x="485" y="232" width="120" height="42" rx="8" fill="#d1fae5" stroke="#86efac" stroke-width="1.5"/>
  </g>
  <text x="545" y="251" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">调用工具</text>
  <text x="545" y="265" text-anchor="middle" font-size="9" fill="#64748b">执行 → 结果</text>

  <!-- Arrow C→D (down) -->
  <line x1="545" y1="274" x2="545" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step D: Check Complete -->
  <g filter="url(#shadow)">
    <polygon points="410,300 500,335 410,370 320,335" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="410" y="333" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">任务</text>
  <text x="410" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">完成?</text>

  <!-- No branch: back to Step A -->
  <line x1="320" y1="335" x2="275" y2="335" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="275" y1="335" x2="275" y2="276" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="290" y="328" text-anchor="end" font-size="9" font-weight="600" fill="#ef4444">否</text>

  <!-- Yes branch: output to outer loop -->
  <line x1="500" y1="335" x2="545" y2="335" stroke="#10b981" stroke-width="1.5"/>
  <line x1="545" y1="335" x2="545" y2="355" stroke="#10b981" stroke-width="1.5"/>
  <text x="525" y="328" text-anchor="start" font-size="9" font-weight="600" fill="#10b981">是</text>

  <!-- Output to outer loop -->
  <rect x="480" y="355" width="130" height="22" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="545" y="370" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">→ 交付外循环</text>

  <!-- Inner loop label -->
  <text x="410" y="392" text-anchor="middle" font-size="9" fill="#94a3b8">内循环回答：给定任务，如何可靠完成？</text>

  <!-- Bottom tip -->
  <rect x="120" y="500" width="580" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="410" y="516" text-anchor="middle" font-size="10" fill="#4338ca">💡 分层弹性：内循环做局部重试（工具失败就重试），外循环做全局调整（方向偏了就重新规划）</text>

  <!-- Bottom subtitle -->
  <rect x="220" y="532" width="380" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="410" y="546" text-anchor="middle" font-size="9" fill="#64748b">外循环 = 触发 + 状态 + 共享 + 监控 + 改进 ｜ 内循环 = 上下文 + 推理 + 工具 + 判断</text>
</svg>
