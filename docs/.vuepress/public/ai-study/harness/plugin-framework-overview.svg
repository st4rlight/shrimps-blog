<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="820" height="560" fill="#f8fafc" rx="12"/>

  <text x="410" y="30" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">DeepSeek-V3 插件式框架总览</text>

  <!-- ModelArgs 配置层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="50" width="740" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="73" font-size="11" font-weight="600" fill="#1d4ed8" letter-spacing="1.5">CONFIG LAYER</text>
    <text x="60" y="92" font-size="12" fill="#374151">ModelArgs (dataclass) + config_671B.json — 配置即插件合约</text>
  </g>

  <!-- Transformer 主结构 -->
  <g filter="url(#shadow)">
    <rect x="40" y="125" width="740" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="60" y="148" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="1.5">TRANSFORMER</text>
    <text x="60" y="167" font-size="12" fill="#374151">model.py — ParallelEmbedding → 61×Block → RMSNorm → ColumnParallelLinear</text>
  </g>

  <!-- MLA (left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="200" width="350" height="85" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="60" y="223" font-size="11" font-weight="600" fill="#5b21b6" letter-spacing="1.5">MLA ATTENTION</text>
    <text x="60" y="242" font-size="11" fill="#374151">· 低秩压缩 KV Cache (~57×)</text>
    <text x="60" y="258" font-size="11" fill="#374151">· naive / absorb 双模式</text>
    <text x="60" y="274" font-size="11" fill="#374151">· Q 低秩投影 (q_lora_rank=1536)</text>
  </g>

  <!-- MoE (right) -->
  <g filter="url(#shadow)">
    <rect x="410" y="200" width="370" height="85" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="430" y="223" font-size="11" font-weight="600" fill="#047857" letter-spacing="1.5">DEEPSEEK MOE</text>
    <text x="430" y="242" font-size="11" fill="#374151">· 256 路由专家 + 1 共享专家</text>
    <text x="430" y="258" font-size="11" fill="#374151">· Auxiliary-loss-free 路由</text>
    <text x="430" y="274" font-size="11" fill="#374151">· sigmoid 评分 + 组限制</text>
  </g>

  <!-- Kernel 策略层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="310" width="350" height="85" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="333" font-size="11" font-weight="600" fill="#92400e" letter-spacing="1.5">KERNEL STRATEGY</text>
    <text x="60" y="352" font-size="11" fill="#374151">· gemm_impl: bf16 / fp8 全局开关</text>
    <text x="60" y="368" font-size="11" fill="#374151">· Triton: act_quant + weight_dequant + fp8_gemm</text>
    <text x="60" y="384" font-size="11" fill="#374151">· @triton.autotune 自动调优</text>
  </g>

  <!-- 并行抽象层 -->
  <g filter="url(#shadow)">
    <rect x="410" y="310" width="370" height="85" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="430" y="333" font-size="11" font-weight="600" fill="#9d174d" letter-spacing="1.5">PARALLEL ABSTRACTION</text>
    <text x="430" y="352" font-size="11" fill="#374151">· ColumnParallelLinear (按输出切分)</text>
    <text x="430" y="368" font-size="11" fill="#374151">· RowParallelLinear (按输入切分 + all_reduce)</text>
    <text x="430" y="384" font-size="11" fill="#374151">· ParallelEmbedding (词表并行)</text>
  </g>

  <!-- 底层文件 -->
  <g filter="url(#shadow)">
    <rect x="40" y="420" width="175" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="55" y="443" font-size="10" font-weight="600" fill="#475569" letter-spacing="1">model.py</text>
    <text x="55" y="462" font-size="11" fill="#374151">~850 行 · 模型定义</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="230" y="420" width="175" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="245" y="443" font-size="10" font-weight="600" fill="#475569" letter-spacing="1">kernel.py</text>
    <text x="245" y="462" font-size="11" fill="#374151">~200 行 · FP8 Kernel</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="420" width="175" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="435" y="443" font-size="10" font-weight="600" fill="#475569" letter-spacing="1">generate.py</text>
    <text x="435" y="462" font-size="11" fill="#374151">~180 行 · 推理循环</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="420" width="170" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="625" y="443" font-size="10" font-weight="600" fill="#475569" letter-spacing="1">convert.py</text>
    <text x="625" y="462" font-size="11" fill="#374151">~100 行 · 权重转换</text>
  </g>

  <!-- 全局开关标注 -->
  <text x="410" y="515" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">全局开关：attn_impl · gemm_impl · world_size · rank</text>
  <text x="410" y="535" font-size="11" fill="#94a3b8" text-anchor="middle">dataclass 配置 + 模块化组件 + if-else 路由 = 轻量插件式架构</text>

  <!-- Arrows -->
  <line x1="410" y1="105" x2="410" y2="123" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="180" x2="215" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="180" x2="595" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
