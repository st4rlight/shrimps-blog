<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="520" rx="14" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Grill Me 工作原理总览</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">需求 → 反复拷问 → 设计共识，然后才开始写代码</text>

  <!-- ===== Stage 1: Fuzzy idea (left) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="130" width="180" height="80" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="130" width="180" height="32" rx="12" fill="url(#blueG)"/>
  <rect x="30" y="150" width="180" height="12" fill="url(#blueG)"/>
  <text x="120" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="white">① 模糊需求</text>
  <text x="120" y="185" text-anchor="middle" font-size="11" fill="#475569">脑子里说不清的想法</text>
  <text x="120" y="201" text-anchor="middle" font-size="11" fill="#64748b">功能/范围/边界未定</text>

  <!-- ===== Stage 2: Grilling loop (center) ===== -->
  <g filter="url(#shadow)">
    <rect x="250" y="90" width="340" height="160" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="250" y="90" width="340" height="32" rx="12" fill="url(#amberG)"/>
  <rect x="250" y="110" width="340" height="12" fill="url(#amberG)"/>
  <text x="420" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="white">② 反复拷问循环</text>

  <!-- loop sub-nodes -->
  <rect x="265" y="150" width="95" height="36" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="312" y="172" text-anchor="middle" font-size="11" fill="#92400e">AI 提问</text>
  <rect x="380" y="150" width="95" height="36" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="427" y="172" text-anchor="middle" font-size="11" fill="#92400e">用户回答</text>
  <rect x="495" y="150" width="95" height="36" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="542" y="172" text-anchor="middle" font-size="11" fill="#92400e">推荐答案</text>

  <!-- arrows between sub-nodes -->
  <line x1="360" y1="168" x2="376" y2="168" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <line x1="475" y1="168" x2="491" y2="168" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowY)"/>

  <!-- loop-back arrow -->
  <path d="M 542 186 L 542 205 L 312 205 L 312 190" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrowY)"/>
  <text x="427" y="198" text-anchor="middle" font-size="9" fill="#92400e">重复 20~100 次</text>
  <text x="420" y="236" text-anchor="middle" font-size="11" fill="#475569">一题一题地拷问，每题附推荐答案</text>

  <!-- ===== Stage 3: Shared design concept (right) ===== -->
  <g filter="url(#shadow)">
    <rect x="630" y="130" width="170" height="80" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="630" y="130" width="170" height="32" rx="12" fill="url(#greenG)"/>
  <rect x="630" y="150" width="170" height="12" fill="url(#greenG)"/>
  <text x="715" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="white">③ 设计共识</text>
  <text x="715" y="185" text-anchor="middle" font-size="11" fill="#475569">对同一设计概念</text>
  <text x="715" y="201" text-anchor="middle" font-size="11" fill="#64748b">达成一致的理解</text>

  <!-- ===== Main flow arrows ===== -->
  <line x1="210" y1="170" x2="246" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="170" x2="626" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Bottom notes ===== -->
  <rect x="30" y="310" width="740" height="120" rx="12" fill="#f1f5f9"/>
  <text x="400" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">为什么「先拷问」而不是「先写代码」？</text>
  <text x="400" y="364" text-anchor="middle" font-size="12" fill="#475569">需求没对齐时，AI 会自己脑补一套答案，写完你再逐个驳回。</text>
  <text x="400" y="386" text-anchor="middle" font-size="12" fill="#475569">每道问题都决定了几百行代码的形态 —— 提前暴露决策树，</text>
  <text x="400" y="408" text-anchor="middle" font-size="12" fill="#475569">比写完再返工便宜得多。</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="240" y="470" width="320" height="30" rx="15" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="489" text-anchor="middle" font-size="11" fill="#15803d">💡 想清楚是主任务，代码只是副产品</text>
</svg>
