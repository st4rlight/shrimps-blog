<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Actor 生命周期流程</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">从创建到终止：初始化 → 运行 → 异常处理 → 资源释放</text>

  <!-- ===== 1. preStart ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="160" height="85" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="160" height="36" rx="12" fill="url(#blueG)"/>
  <rect x="30" y="100" width="160" height="16" fill="url(#blueG)"/>
  <text x="110" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="white">① preStart()</text>
  <text x="110" y="130" text-anchor="middle" font-size="10" fill="#374151">Actor 创建后调用</text>
  <text x="110" y="145" text-anchor="middle" fill="#64748b">初始化资源、加载配置</text>

  <!-- Arrow -->
  <line x1="190" y1="122" x2="220" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 2. Running ===== -->
  <g filter="url(#shadow)">
    <rect x="220" y="80" width="180" height="85" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="220" y="80" width="180" height="36" rx="12" fill="url(#greenG)"/>
  <rect x="220" y="100" width="180" height="16" fill="url(#greenG)"/>
  <text x="310" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="white">② 运行中</text>
  <text x="310" y="128" text-anchor="middle" font-size="10" fill="#374151">从 Mailbox 取消息处理</text>
  <text x="310" y="143" text-anchor="middle" font-size="9" fill="#64748b">串行处理 · 修改私有状态</text>
  <text x="310" y="156" text-anchor="middle" font-size="9" fill="#64748b">可创建子 Actor</text>

  <!-- ===== 3. Exception happens ===== -->
  <g filter="url(#shadow)">
    <rect x="440" y="80" width="170" height="85" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="440" y="80" width="170" height="36" rx="12" fill="url(#amberG)"/>
  <rect x="440" y="100" width="170" height="16" fill="url(#amberG)"/>
  <text x="525" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="white">③ 异常发生</text>
  <text x="525" y="130" text-anchor="middle" font-size="10" fill="#374151">Actor 抛出异常</text>
  <text x="525" y="145" text-anchor="middle" fill="#64748b">当前消息处理中断</text>

  <!-- Arrow from Running to Exception -->
  <line x1="400" y1="122" x2="430" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 4. preRestart + postStop ===== -->
  <g filter="url(#shadow)">
    <rect x="440" y="190" width="170" height="70" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="440" y="190" width="170" height="30" rx="12" fill="url(#redG)"/>
  <rect x="440" y="208" width="170" height="12" fill="url(#redG)"/>
  <text x="525" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="white">④ preRestart() → postStop()</text>
  <text x="525" y="235" text-anchor="middle" fill="#64748b">旧实例：保存状态 → 释放资源</text>
  <text x="525" y="250" text-anchor="middle" fill="#64748b">通知子 Actor 停止</text>

  <!-- Arrow from Exception down to restart -->
  <line x1="525" y1="165" x2="525" y2="182" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="545" y="177" font-size="9" fill="#ef4444">崩溃</text>

  <!-- Arrow from postStop to new preStart -->
  <path d="M 440 225 L 360 225 L 360 60 L 110 60 L 110 75" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)" stroke-dasharray="4 3"/>
  <text x="245" y="55" font-size="9" fill="#10b981">Restart：创建新实例</text>

  <!-- ===== 5. postStop (normal) ===== -->
  <g filter="url(#shadow)">
    <rect x="220" y="190" width="180" height="70" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="310" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">⑤ postStop()</text>
  <text x="310" y="233" text-anchor="middle" fill="#64748b">正常终止后调用</text>
  <text x="310" y="248" text-anchor="middle" fill="#64748b">释放资源、关闭连接</text>

  <!-- Arrow from Running to normal postStop -->
  <line x1="310" y1="165" x2="310" y2="182" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="177" font-size="9" fill="#64748b">PoisonPill / stop</text>

  <!-- ===== 6. Three stop ways ===== -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="740" height="110" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <text x="55" y="312" font-size="12" font-weight="600" fill="#475569">停止 Actor 的三种方式</text>

  <!-- Way 1 -->
  <g transform="translate(55, 322)">
    <rect x="0" y="0" width="210" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="105" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">context.stop(self)</text>
    <text x="105" y="35" text-anchor="middle" fill="#64748b">Actor 自行停止</text>
    <text x="105" y="50" text-anchor="middle" fill="#64748b">或父 Actor 停止子 Actor</text>
  </g>

  <!-- Way 2 -->
  <g transform="translate(290, 322)">
    <rect x="0" y="0" width="210" height="65" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="105" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">PoisonPill 消息</text>
    <text x="105" y="35" text-anchor="middle" fill="#64748b">处理完当前消息后停止</text>
    <text x="105" y="50" text-anchor="middle" fill="#64748b">Mailbox 中消息继续处理</text>
  </g>

  <!-- Way 3 -->
  <g transform="translate(525, 322)">
    <rect x="0" y="0" width="210" height="65" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
    <text x="105" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">gracefulStop()</text>
    <text x="105" y="35" text-anchor="middle" fill="#64748b">等待超时，优雅停止</text>
    <text x="105" y="50" text-anchor="middle" fill="#64748b">返回 Future [Boolean]</text>
  </g>

  <!-- Bottom tip -->
  <rect x="180" y="402" width="440" height="16" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="413" text-anchor="middle" font-size="10" fill="#15803d">💡 Actor 重启后 ActorRef 不变，外部引用无需更新 —— 位置透明性</text>
</svg>
