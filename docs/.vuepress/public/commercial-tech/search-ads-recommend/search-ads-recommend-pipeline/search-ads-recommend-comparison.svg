<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="480" rx="14" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">搜索 vs 广告 vs 推荐</text>
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">同一套漏斗架构，不同的核心目标与特殊环节</text>

  <!-- ===== Three columns ===== -->

  <!-- Column 1: Search -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="240" height="370" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="240" height="44" rx="12" fill="url(#blueG)"/>
  <rect x="30" y="100" width="240" height="24" fill="url(#blueG)"/>
  <text x="150" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="white">🔍 搜索</text>

  <!-- Search content -->
  <text x="50" y="150" font-size="11" font-weight="600" fill="#1e293b">用户意图</text>
  <text x="50" y="168" font-size="11" fill="#64748b">明确（有 Query）</text>

  <line x1="50" y1="182" x2="250" y2="182" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="200" font-size="11" font-weight="600" fill="#1e293b">召回核心</text>
  <text x="50" y="218" font-size="11" fill="#64748b">倒排索引 + 语义匹配</text>

  <line x1="50" y1="232" x2="250" y2="232" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="250" font-size="11" font-weight="600" fill="#1e293b">排序目标</text>
  <text x="50" y="268" font-size="11" fill="#64748b">相关性 + 质量</text>

  <line x1="50" y1="282" x2="250" y2="282" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="300" font-size="11" font-weight="600" fill="#1e293b">特殊环节</text>
  <text x="50" y="318" font-size="11" fill="#64748b">Query 理解</text>
  <text x="50" y="336" font-size="11" fill="#64748b">意图识别</text>
  <text x="50" y="354" font-size="11" fill="#64748b">语义匹配</text>

  <line x1="50" y1="368" x2="250" y2="368" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="386" font-size="11" font-weight="600" fill="#1e293b">评估核心</text>
  <text x="50" y="404" font-size="11" fill="#3b82f6" font-weight="600">NDCG / MRR</text>
  <text x="50" y="422" font-size="10" fill="#94a3b8">相关性导向</text>

  <!-- Column 2: Ads -->
  <g filter="url(#shadow)">
    <rect x="290" y="80" width="240" height="370" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="290" y="80" width="240" height="44" rx="12" fill="url(#greenG)"/>
  <rect x="290" y="100" width="240" height="24" fill="url(#greenG)"/>
  <text x="410" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="white">💰 广告</text>

  <!-- Ads content -->
  <text x="310" y="150" font-size="11" font-weight="600" fill="#1e293b">用户意图</text>
  <text x="310" y="168" font-size="11" fill="#64748b">半明确（有倾向）</text>

  <line x1="310" y1="182" x2="510" y2="182" stroke="#e2e8f0" stroke-width="1"/>

  <text x="310" y="200" font-size="11" font-weight="600" fill="#1e293b">召回核心</text>
  <text x="310" y="218" font-size="11" fill="#64748b">定向（人群包）+ 竞价</text>

  <line x1="310" y1="232" x2="510" y2="232" stroke="#e2e8f0" stroke-width="1"/>

  <text x="310" y="250" font-size="11" font-weight="600" fill="#1e293b">排序目标</text>
  <text x="310" y="268" font-size="11" fill="#64748b">eCPM = pCTR × pCVR × Bid</text>

  <line x1="310" y1="282" x2="510" y2="282" stroke="#e2e8f0" stroke-width="1"/>

  <text x="310" y="300" font-size="11" font-weight="600" fill="#1e293b">特殊环节</text>
  <text x="310" y="318" font-size="11" fill="#64748b">竞价机制（GSP/VCG）</text>
  <text x="310" y="336" font-size="11" fill="#64748b">预算控制 / Pacing</text>
  <text x="310" y="354" font-size="11" fill="#64748b">ROI 约束</text>

  <line x1="310" y1="368" x2="510" y2="368" stroke="#e2e8f0" stroke-width="1"/>

  <text x="310" y="386" font-size="11" font-weight="600" fill="#1e293b">评估核心</text>
  <text x="310" y="404" font-size="11" fill="#10b981" font-weight="600">ROI / GMV</text>
  <text x="310" y="422" font-size="10" fill="#94a3b8">商业导向</text>

  <!-- Column 3: Recommend -->
  <g filter="url(#shadow)">
    <rect x="550" y="80" width="240" height="370" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="550" y="80" width="240" height="44" rx="12" fill="url(#amberG)"/>
  <rect x="550" y="100" width="240" height="24" fill="url(#amberG)"/>
  <text x="670" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="white">📱 推荐</text>

  <!-- Recommend content -->
  <text x="570" y="150" font-size="11" font-weight="600" fill="#1e293b">用户意图</text>
  <text x="570" y="168" font-size="11" fill="#64748b">模糊（被动消费）</text>

  <line x1="570" y1="182" x2="770" y2="182" stroke="#e2e8f0" stroke-width="1"/>

  <text x="570" y="200" font-size="11" font-weight="600" fill="#1e293b">召回核心</text>
  <text x="570" y="218" font-size="11" fill="#64748b">兴趣召回为主</text>

  <line x1="570" y1="232" x2="770" y2="232" stroke="#e2e8f0" stroke-width="1"/>

  <text x="570" y="250" font-size="11" font-weight="600" fill="#1e293b">排序目标</text>
  <text x="570" y="268" font-size="11" fill="#64748b">多目标（CTR/时长/互动）</text>

  <line x1="570" y1="282" x2="770" y2="282" stroke="#e2e8f0" stroke-width="1"/>

  <text x="570" y="300" font-size="11" font-weight="600" fill="#1e293b">特殊环节</text>
  <text x="570" y="318" font-size="11" fill="#64748b">兴趣探索（E&amp;E）</text>
  <text x="570" y="336" font-size="11" fill="#64748b">冷启动策略</text>
  <text x="570" y="354" font-size="11" fill="#64748b">长期价值建模</text>

  <line x1="570" y1="368" x2="770" y2="368" stroke="#e2e8f0" stroke-width="1"/>

  <text x="570" y="386" font-size="11" font-weight="600" fill="#1e293b">评估核心</text>
  <text x="570" y="404" font-size="11" fill="#f59e0b" font-weight="600">CTR / 时长 / 留存</text>
  <text x="570" y="422" font-size="10" fill="#94a3b8">体验导向</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="150" y="460" width="520" height="16" rx="8" fill="#f1f5f9"/>
  <text x="410" y="473" text-anchor="middle" font-size="10" fill="#64748b">💡 共享级联漏斗架构，差异在于模型选择、特征使用和目标函数</text>
</svg>
