<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto"
            preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="460" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Graph + Loop：两层共存</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">Graph 负责高层组织关系，Loop 负责节点内部的行动</text>

  <!-- ===== Graph Layer (outer frame) ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="65" width="760" height="360" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="30" y="65" width="760" height="32" rx="12" fill="url(#violetG)"/>
  <rect x="30" y="81" width="760" height="16" fill="url(#violetG)"/>
  <text x="50" y="85" font-size="13" font-weight="700" fill="white">Graph 层 — 高层组织关系</text>
  <text x="770" y="85" text-anchor="end" font-size="11" fill="#ede9fe">谁负责什么 · 谁交给谁</text>

  <!-- ===== Frontend Dev Agent (contains Loop inside) ===== -->
  <g filter="url(#shadow)">
    <rect x="50" y="115" width="340" height="290" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <rect x="50" y="115" width="340" height="28" rx="10" fill="url(#amberG)"/>
  <rect x="50" y="129" width="340" height="14" fill="url(#amberG)"/>
  <text x="220" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="white">Frontend Dev Agent</text>

  <!-- Loop inside Frontend Agent -->
  <text x="220" y="162" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">Loop 层（节点内部）</text>

  <rect x="80" y="175" width="130" height="26" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" font-size="10" fill="#92400e">写前端代码</text>

  <line x1="210" y1="188" x2="246" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="175" width="110" height="26" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="305" y="193" text-anchor="middle" font-size="10" fill="#92400e">跑组件测试</text>

  <line x1="305" y1="201" x2="305" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="305,228 345,248 305,268 265,248" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="305" y="252" text-anchor="middle" font-size="9" fill="#92400e">通过?</text>

  <!-- No: loop back to write code -->
  <path d="M 265 248 L 145 248 L 145 201" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrowR)"/>
  <text x="135" y="228" text-anchor="end" font-size="9" fill="#ef4444" font-weight="600">否</text>
  <rect x="105" y="235" width="30" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="120" y="248" text-anchor="middle" font-size="8" fill="#991b1b">修复</text>

  <!-- Yes: done -->
  <path d="M 345 248 L 370 248 L 370 300 L 336 300" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="375" y="278" text-anchor="start" font-size="9" fill="#10b981" font-weight="600">是</text>

  <rect x="250" y="285" width="80" height="26" rx="6" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="290" y="303" text-anchor="middle" font-size="10" fill="#047857">前端完成</text>

  <!-- Annotation -->
  <text x="220" y="345" text-anchor="middle" font-size="9" fill="#92400e">Agent 内部的 Loop 持续推进</text>
  <text x="220" y="360" text-anchor="middle" font-size="9" fill="#92400e">直到组件测试通过</text>

  <!-- ===== Arrow: Frontend → Integration Test ===== -->
  <line x1="390" y1="260" x2="446" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="252" text-anchor="middle" font-size="9" fill="#64748b">交付</text>

  <!-- ===== Integration Test Agent ===== -->
  <g filter="url(#shadow)">
    <rect x="450" y="160" width="160" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <rect x="450" y="160" width="160" height="26" rx="10" fill="url(#blueG)"/>
  <rect x="450" y="174" width="160" height="12" fill="url(#blueG)"/>
  <text x="530" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="white">Integration Test</text>
  <text x="530" y="215" text-anchor="middle" font-size="10" fill="#1d4ed8">集成测试</text>
  <text x="530" y="230" text-anchor="middle" font-size="9" fill="#64748b">验收前后端整合</text>

  <!-- ===== Arrow: Backend → Integration Test ===== -->
  <path d="M 420 390 L 530 390 L 530 246" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="540" y="320" text-anchor="start" font-size="9" fill="#64748b">交付</text>

  <!-- ===== Backend Dev Agent ===== -->
  <g filter="url(#shadow)">
    <rect x="120" y="350" width="300" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <rect x="120" y="350" width="300" height="24" rx="10" fill="url(#violetG)"/>
  <rect x="120" y="362" width="300" height="12" fill="url(#violetG)"/>
  <text x="270" y="367" text-anchor="middle" font-size="11" font-weight="700" fill="white">Backend Dev Agent</text>
  <text x="270" y="395" text-anchor="middle" font-size="9" fill="#5b21b6">（内部同样运行自己的 Loop）</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="100" y="435" width="620" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="449" text-anchor="middle" font-size="11" fill="#15803d">💡 Graph 节点内部可以运行自己的 Loop——两者完全可以共存</text>
</svg>
