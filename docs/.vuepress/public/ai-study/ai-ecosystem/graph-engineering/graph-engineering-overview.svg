<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="560" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Graph Engineering 技术全景</text>
  <text x="410" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">从图建模到图智能的五层技术栈</text>

  <!-- ===== Layer 1: 图建模 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="760" height="70" rx="10" fill="white" stroke="#818cf8" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="120" height="70" rx="10" fill="url(#indigoG)"/>
  <rect x="130" y="80" width="20" height="70" fill="url(#indigoG)"/>
  <text x="90" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="white">图建模</text>
  <text x="90" y="130" text-anchor="middle" font-size="10" fill="#e0e7ff">Modeling</text>
  <text x="160" y="108" font-size="11" font-weight="600" fill="#475569">核心问题：如何用图描述真实世界的实体与关系</text>
  <text x="160" y="128" font-size="10" fill="#64748b">属性图（Property Graph）  ·  RDF 三元组  ·  本体设计（Ontology）</text>

  <!-- Arrow L1→L2 -->
  <line x1="410" y1="150" x2="410" y2="166" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 2: 图存储 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="170" width="760" height="70" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="170" width="120" height="70" rx="10" fill="url(#blueG)"/>
  <rect x="130" y="170" width="20" height="70" fill="url(#blueG)"/>
  <text x="90" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="white">图存储</text>
  <text x="90" y="220" text-anchor="middle" font-size="10" fill="#dbeafe">Storage</text>
  <text x="160" y="198" font-size="11" font-weight="600" fill="#475569">核心问题：如何高效存储和检索图结构</text>
  <text x="160" y="218" font-size="10" fill="#64748b">Neo4j  ·  NebulaGraph  ·  TigerGraph  ·  Memgraph</text>

  <!-- Arrow L2→L3 -->
  <line x1="410" y1="240" x2="410" y2="256" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 3: 图计算 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="260" width="760" height="70" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="30" y="260" width="120" height="70" rx="10" fill="url(#greenG)"/>
  <rect x="130" y="260" width="20" height="70" fill="url(#greenG)"/>
  <text x="90" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="white">图计算</text>
  <text x="90" y="310" text-anchor="middle" font-size="10" fill="#d1fae5">Compute</text>
  <text x="160" y="288" font-size="11" font-weight="600" fill="#475569">核心问题：如何在大规模图上运行算法</text>
  <text x="160" y="308" font-size="10" fill="#64748b">Spark GraphX  ·  Giraph  ·  Plato  ·  BSP / GAS 模型</text>

  <!-- Arrow L3→L4 -->
  <line x1="410" y1="330" x2="410" y2="346" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 4: 图查询 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="350" width="760" height="70" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="30" y="350" width="120" height="70" rx="10" fill="url(#amberG)"/>
  <rect x="130" y="350" width="20" height="70" fill="url(#amberG)"/>
  <text x="90" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="white">图查询</text>
  <text x="90" y="400" text-anchor="middle" font-size="10" fill="#fef3c7">Query</text>
  <text x="160" y="378" font-size="11" font-weight="600" fill="#475569">核心问题：如何用语言表达图遍历和分析意图</text>
  <text x="160" y="398" font-size="10" fill="#64748b">Cypher  ·  Gremlin  ·  GQL（ISO 标准）  ·  nGQL</text>

  <!-- Arrow L4→L5 -->
  <line x1="410" y1="420" x2="410" y2="436" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 5: 图智能 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="440" width="760" height="70" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="30" y="440" width="120" height="70" rx="10" fill="url(#violetG)"/>
  <rect x="130" y="440" width="20" height="70" fill="url(#violetG)"/>
  <text x="90" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="white">图智能</text>
  <text x="90" y="490" text-anchor="middle" font-size="10" fill="#ede9fe">Intelligence</text>
  <text x="160" y="468" font-size="11" font-weight="600" fill="#475569">核心问题：如何让机器学习图结构中的隐含模式</text>
  <text x="160" y="488" font-size="10" fill="#64748b">GCN  ·  GraphSAGE  ·  GAT  ·  GraphRAG  ·  DGL / PyG</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="525" width="560" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="542" text-anchor="middle" font-size="11" fill="#15803d">💡 每层可独立选型，也可纵向打通构建端到端图智能平台</text>
</svg>
