<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="420" rx="12" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">属性图 vs RDF 三元组</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">两种图数据模型的建模方式对比</text>

  <!-- ===== Left: Property Graph ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="350" height="290" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="30" y="80" width="350" height="40" rx="12" fill="url(#blueG)"/>
  <rect x="30" y="100" width="350" height="20" fill="url(#blueG)"/>
  <text x="205" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="white">属性图 (Property Graph)</text>

  <!-- Node 1: 张三 -->
  <ellipse cx="100" cy="155" rx="50" ry="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">张三:Person</text>
  <text x="100" y="165" text-anchor="middle" font-size="9" fill="#475569">age: 32</text>

  <!-- Edge: WORKS_AT -->
  <path d="M 150 155 L 260 155" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="175" y="138" width="60" height="16" rx="8" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1"/>
  <text x="205" y="150" text-anchor="middle" font-size="9" fill="#1d4ed8">WORKS_AT</text>
  <text x="205" y="172" text-anchor="middle" font-size="8" fill="#64748b">since: 2020</text>

  <!-- Node 2: 蓝星科技 -->
  <ellipse cx="310" cy="155" rx="55" ry="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="310" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">蓝星科技:Company</text>
  <text x="310" y="165" text-anchor="middle" font-size="9" fill="#475569">founded: 2018</text>

  <!-- Features -->
  <rect x="50" y="200" width="310" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="220" font-size="11" font-weight="600" fill="#475569">核心特征：</text>
  <text x="60" y="240" font-size="10" fill="#64748b">• 节点有多标签 (:Person:Employee)</text>
  <text x="60" y="258" font-size="10" fill="#64748b">• 边有类型 (WORKS_AT)</text>
  <text x="60" y="276" font-size="10" fill="#64748b">• 节点和边都可以有属性</text>
  <text x="60" y="294" font-size="10" fill="#64748b">• 有向图，支持多重边</text>
  <text x="60" y="316" font-size="10" font-weight="600" fill="#3b82f6">查询语言：Cypher / GQL</text>
  <text x="60" y="334" font-size="10" font-weight="600" fill="#3b82f6">代表：Neo4j, NebulaGraph</text>

  <!-- ===== Center: VS ===== -->
  <circle cx="400" cy="225" r="22" fill="white" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">VS</text>

  <!-- ===== Right: RDF ===== -->
  <g filter="url(#shadow)">
    <rect x="420" y="80" width="350" height="290" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="420" y="80" width="350" height="40" rx="12" fill="url(#amberG)"/>
  <rect x="420" y="100" width="350" height="20" fill="url(#amberG)"/>
  <text x="595" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="white">RDF 三元组 (Subject-Predicate-Object)</text>

  <!-- RDF triples -->
  <rect x="440" y="140" width="310" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="595" y="160" text-anchor="middle" font-size="10" fill="#92400e">&lt;张三&gt; &lt;worksAt&gt; &lt;蓝星科技&gt;</text>

  <rect x="440" y="178" width="310" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="595" y="198" text-anchor="middle" font-size="10" fill="#92400e">&lt;张三&gt; &lt;age&gt; "32"</text>

  <rect x="440" y="216" width="310" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="595" y="236" text-anchor="middle" font-size="10" fill="#92400e">&lt;蓝星科技&gt; &lt;founded&gt; "2018"</text>

  <!-- Features -->
  <rect x="440" y="260" width="310" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="280" font-size="10" fill="#64748b">• 主-谓-宾三元组描述关系</text>
  <text x="450" y="298" font-size="10" fill="#64748b">• 每个实体和关系用 URI 标识</text>
  <text x="450" y="316" font-size="10" fill="#64748b">• 边无属性（需转为节点）</text>
  <text x="450" y="338" font-size="10" font-weight="600" fill="#f59e0b">查询：SPARQL · 推理：OWL</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="130" y="385" width="540" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="400" y="402" text-anchor="middle" font-size="11" fill="#15803d">💡 面向应用选属性图，面向语义推理选 RDF</text>
</svg>
