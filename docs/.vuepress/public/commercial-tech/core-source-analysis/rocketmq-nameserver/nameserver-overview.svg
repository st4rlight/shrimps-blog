<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" preserveAspectRatio="xMidYMid meet">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="820" height="540" rx="16" fill="#f8fafc"/>

  <!-- ===== Title ===== -->
  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">RocketMQ NameServer 架构总览</text>
  <text x="410" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">轻量级路由注册中心 — AP 模型，最终一致，节点间互不通信</text>

  <!-- ===== Center: NameServer Cluster ===== -->
  <g filter="url(#shadow)">
    <rect x="290" y="190" width="240" height="170" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="290" y="190" width="240" height="38" rx="12" fill="url(#blueG)"/>
  <rect x="290" y="212" width="240" height="16" fill="url(#blueG)"/>
  <text x="410" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="white">NameServer Cluster</text>
  <!-- Three NameServer nodes -->
  <rect x="305" y="243" width="100" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="355" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">NS-1</text>
  <rect x="305" y="293" width="100" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="355" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">NS-2</text>
  <rect x="415" y="243" width="100" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="465" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">NS-3</text>
  <rect x="415" y="293" width="100" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="465" y="317" text-anchor="middle" font-size="14" font-weight="600" fill="#94a3b8">···</text>
  <!-- "No sync" annotation -->
  <text x="410" y="354" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">节点间互不通信</text>

  <!-- ===== Left: Broker ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="180" height="110" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="40" y="100" width="180" height="34" rx="12" fill="url(#greenG)"/>
  <rect x="40" y="118" width="180" height="16" fill="url(#greenG)"/>
  <text x="130" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="white">Broker</text>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#374151">消息存储与转发</text>
  <text x="130" y="180" text-anchor="middle" font-size="10" fill="#64748b">启动注册 + 每30s心跳</text>
  <text x="130" y="196" text-anchor="middle" font-size="10" fill="#64748b">向所有 NS 节点注册</text>

  <!-- Arrow: Broker → NameServer (register/heartbeat) -->
  <path d="M 220 155 L 290 230" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
  <text x="235" y="178" font-size="10" font-weight="600" fill="#10b981">① 注册/心跳</text>

  <!-- ===== Right: Producer ===== -->
  <g filter="url(#shadow)">
    <rect x="600" y="100" width="180" height="110" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="600" y="100" width="180" height="34" rx="12" fill="url(#amberG)"/>
  <rect x="600" y="118" width="180" height="16" fill="url(#amberG)"/>
  <text x="690" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="white">Producer</text>
  <text x="690" y="160" text-anchor="middle" font-size="11" fill="#374151">消息生产者</text>
  <text x="690" y="180" text-anchor="middle" font-size="10" fill="#64748b">启动拉取路由</text>
  <text x="690" y="196" text-anchor="middle" font-size="10" fill="#64748b">每30s 更新路由表</text>

  <!-- Arrow: Producer → NameServer (discover) -->
  <path d="M 600 155 L 530 230" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowA)"/>
  <text x="555" y="178" font-size="10" font-weight="600" fill="#f59e0b">③ 路由发现</text>

  <!-- Arrow: Producer → Broker (send message) -->
  <path d="M 600 145 L 220 145" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="410" y="138" text-anchor="middle" font-size="10" fill="#94a3b8">发送消息</text>

  <!-- ===== Bottom: Consumer ===== -->
  <g filter="url(#shadow)">
    <rect x="320" y="420" width="180" height="100" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="320" y="420" width="180" height="34" rx="12" fill="url(#violetG)"/>
  <rect x="320" y="438" width="180" height="16" fill="url(#violetG)"/>
  <text x="410" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="white">Consumer</text>
  <text x="410" y="475" text-anchor="middle" font-size="11" fill="#374151">消息消费者</text>
  <text x="410" y="493" text-anchor="middle" font-size="10" fill="#64748b">每30s 拉取路由</text>
  <text x="410" y="509" text-anchor="middle" font-size="10" fill="#64748b">触发 Rebalance</text>

  <!-- Arrow: Consumer → NameServer (discover) -->
  <path d="M 410 420 L 410 360" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowV)"/>
  <text x="418" y="390" font-size="10" font-weight="600" fill="#8b5cf6">③ 路由发现</text>

  <!-- Arrow: Consumer ← Broker (pull message) -->
  <path d="M 220 175 L 320 440" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="250" y="310" font-size="10" fill="#94a3b8">拉取消息</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="140" y="510" width="540" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="525" text-anchor="middle" font-size="11" fill="#15803d">💡 AP 模型：只要一个 NS 存活即可用，路由短暂不一致靠重试兜底</text>
</svg>
