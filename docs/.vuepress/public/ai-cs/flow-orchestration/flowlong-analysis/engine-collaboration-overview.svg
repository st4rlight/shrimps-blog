<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="440" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">三引擎协作架构</text>
  <text x="410" y="53" text-anchor="middle" font-size="11" fill="#94a3b8">LiteFlow 自动编排 + QLExpress 条件判断 + FlowLong 人工审批</text>

  <!-- ===== Layer 1: LiteFlow 自动编排 ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="72" width="740" height="110" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="40" y="72" width="740" height="30" rx="10" fill="url(#blueG)"/>
  <rect x="40" y="90" width="740" height="12" fill="url(#blueG)"/>
  <text x="60" y="92" text-anchor="start" font-size="13" font-weight="700" fill="white">LiteFlow — 自动编排层</text>
  <text x="760" y="92" text-anchor="end" font-size="10" fill="white" opacity="0.8">自动步骤，无需人工</text>

  <!-- LiteFlow nodes -->
  <rect x="70" y="115" width="110" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="125" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">消息预处理</text>

  <line x1="185" y1="129" x2="200" y2="129" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="205" y="115" width="110" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="260" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">AI意图识别</text>

  <line x1="320" y1="129" x2="335" y2="129" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="115" width="110" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="395" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">情绪分析</text>

  <line x1="455" y1="129" x2="470" y2="129" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- QLExpress node -->
  <rect x="475" y="113" width="130" height="32" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">QLExpress</text>
  <text x="540" y="140" text-anchor="middle" font-size="9" fill="#92400e">需要人工审批?</text>

  <line x1="610" y1="129" x2="625" y2="129" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="630" y="115" width="120" height="28" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="690" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">启动 FlowLong</text>

  <!-- Auto path -->
  <text x="540" y="162" text-anchor="middle" font-size="9" fill="#64748b">否 → 自动处理（无需审批）</text>

  <!-- Arrow down to FlowLong -->
  <line x1="690" y1="147" x2="690" y2="180" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="168" font-size="9" fill="#f59e0b" font-weight="600">是</text>

  <!-- ===== Layer 2: FlowLong 人工审批 ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="190" width="740" height="160" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="40" y="190" width="740" height="30" rx="10" fill="url(#greenG)"/>
  <rect x="40" y="208" width="740" height="12" fill="url(#greenG)"/>
  <text x="60" y="210" text-anchor="start" font-size="13" font-weight="700" fill="white">FlowLong — 人工审批层</text>
  <text x="760" y="210" text-anchor="end" font-size="10" fill="white" opacity="0.8">人工审批，任务持久化</text>

  <!-- FlowLong flow -->
  <rect x="70" y="240" width="110" height="28" rx="14" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="125" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">主管审批</text>

  <line x1="185" y1="254" x2="200" y2="254" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Diamond: condition -->
  <polygon points="260,240 310,254 260,268 210,254" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="260" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">条件</text>

  <line x1="310" y1="254" x2="325" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="240" width="110" height="28" rx="14" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="385" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">总监审批</text>

  <line x1="445" y1="254" x2="460" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="465" y="240" width="100" height="28" rx="14" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="515" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">财务复核</text>

  <line x1="570" y1="254" x2="585" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="590" y="240" width="80" height="28" rx="14" fill="#d1fae5" stroke="#86efac" stroke-width="1"/>
  <text x="630" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">抄送</text>

  <line x1="675" y1="254" x2="690" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="695" y="240" width="60" height="28" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="725" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">结案</text>

  <!-- Operations -->
  <text x="60" y="293" font-size="10" font-weight="600" fill="#475569">支持操作：</text>
  <rect x="130" y="282" width="55" height="18" rx="9" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
  <text x="157" y="294" text-anchor="middle" font-size="9" fill="#047857">同意</text>
  <rect x="195" y="282" width="55" height="18" rx="9" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="222" y="294" text-anchor="middle" font-size="9" fill="#991b1b">驳回</text>
  <rect x="260" y="282" width="55" height="18" rx="9" fill="#fef3c7" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="287" y="294" text-anchor="middle" font-size="9" fill="#92400e">转办</text>
  <rect x="325" y="282" width="55" height="18" rx="9" fill="#fef3c7" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="352" y="294" text-anchor="middle" font-size="9" fill="#92400e">委派</text>
  <rect x="390" y="282" width="55" height="18" rx="9" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="417" y="294" text-anchor="middle" font-size="9" fill="#1d4ed8">加签</text>
  <rect x="455" y="282" width="55" height="18" rx="9" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="482" y="294" text-anchor="middle" font-size="9" fill="#1d4ed8">减签</text>
  <rect x="520" y="282" width="55" height="18" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="547" y="294" text-anchor="middle" font-size="9" fill="#4f46e5">撤回</text>
  <rect x="585" y="282" width="70" height="18" rx="9" fill="#d1fae5" stroke="#86efac" stroke-width="0.5"/>
  <text x="620" y="294" text-anchor="middle" font-size="9" fill="#047857">会签/或签</text>

  <!-- Persistence note -->
  <text x="410" y="330" text-anchor="middle" font-size="10" fill="#64748b">每一步审批自动持久化到数据库，完整审批轨迹可追溯</text>

  <!-- Bottom tip -->
  <rect x="120" y="380" width="580" height="36" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="398" text-anchor="middle" font-size="11" fill="#15803d">✅ 自动流程用 LiteFlow 编排 · 复杂条件用 QLExpress 求值 · 人工审批用 FlowLong 驱动</text>
  <text x="410" y="412" text-anchor="middle" font-size="10" fill="#15803d">三者各司其职，配合默契</text>
</svg>
