<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" rx="14" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">A2UI 架构总览</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#94a3b8">Agent 生成 JSON 蓝图，客户端原生渲染 — 安全如数据，表达如代码</text>

  <!-- ===== User Layer ===== -->
  <g filter="url(#shadow)">
    <rect x="310" y="75" width="200" height="48" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="310" y="75" width="200" height="22" rx="10" fill="url(#indigoG)"/>
  <rect x="310" y="87" width="200" height="10" fill="url(#indigoG)"/>
  <text x="410" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="white">用户</text>
  <text x="410" y="114" text-anchor="middle" font-size="10" fill="#64748b">看到原生 UI · 点击交互</text>

  <!-- Arrow: User to Client App -->
  <line x1="410" y1="123" x2="410" y2="155" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Client App Layer ===== -->
  <g filter="url(#shadow)">
    <rect x="140" y="160" width="540" height="140" rx="12" fill="white" stroke="#10b981" stroke-width="2.5"/>
  </g>
  <rect x="140" y="160" width="540" height="34" rx="12" fill="url(#greenG)"/>
  <rect x="140" y="178" width="540" height="16" fill="url(#greenG)"/>
  <text x="410" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="white">Client App（客户端应用）</text>

  <!-- A2UI Renderer -->
  <g filter="url(#shadow)">
    <rect x="160" y="208" width="220" height="78" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="270" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">A2UI Renderer</text>
  <text x="270" y="248" text-anchor="middle" font-size="10" fill="#64748b">解析 JSON 蓝图</text>
  <text x="270" y="264" text-anchor="middle" font-size="10" fill="#64748b">映射为原生组件树</text>
  <text x="270" y="278" text-anchor="middle" font-size="9" fill="#94a3b8">React / Flutter / Lit / Angular</text>

  <!-- Native Components -->
  <g filter="url(#shadow)">
    <rect x="440" y="208" width="220" height="78" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="550" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Native Components</text>
  <text x="550" y="248" text-anchor="middle" font-size="10" fill="#64748b">Card · Text · Button</text>
  <text x="550" y="264" text-anchor="middle" font-size="10" fill="#64748b">Slider · Select · Chart</text>
  <text x="550" y="278" text-anchor="middle" font-size="9" fill="#94a3b8">经过审核的安全组件</text>

  <!-- Arrow: Renderer to Native -->
  <line x1="380" y1="247" x2="438" y2="247" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- ===== Transport Layer ===== -->
  <rect x="60" y="320" width="700" height="36" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">传输层（Transport）</text>
  <text x="410" y="350" text-anchor="middle" font-size="10" fill="#64748b">A2A 协议 · AG-UI · SSE · WebSocket — A2UI 不绑定传输，任何通道均可</text>

  <!-- Arrow: Client to Transport -->
  <line x1="410" y1="300" x2="410" y2="318" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: Transport to Agent -->
  <line x1="410" y1="356" x2="410" y2="378" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Agent Layer ===== -->
  <g filter="url(#shadow)">
    <rect x="140" y="380" width="540" height="130" rx="12" fill="white" stroke="#3b82f6" stroke-width="2.5"/>
  </g>
  <rect x="140" y="380" width="540" height="34" rx="12" fill="url(#blueG)"/>
  <rect x="140" y="398" width="540" height="16" fill="url(#blueG)"/>
  <text x="410" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="white">Agent（后端智能体）</text>

  <!-- LLM -->
  <g filter="url(#shadow)">
    <rect x="160" y="428" width="150" height="68" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="235" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">LLM 推理</text>
  <text x="235" y="468" text-anchor="middle" font-size="10" fill="#64748b">理解用户意图</text>
  <text x="235" y="484" text-anchor="middle" font-size="10" fill="#64748b">决定 UI 结构</text>

  <!-- JSON Blueprint Generator -->
  <g filter="url(#shadow)">
    <rect x="335" y="428" width="150" height="68" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  </g>
  <text x="410" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">JSON 蓝图</text>
  <text x="410" y="468" text-anchor="middle" font-size="10" fill="#64748b">声明式 UI 描述</text>
  <text x="410" y="484" text-anchor="middle" font-size="10" fill="#64748b">扁平化组件列表</text>

  <!-- Agent SDK -->
  <g filter="url(#shadow)">
    <rect x="510" y="428" width="150" height="68" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="585" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Agent SDK</text>
  <text x="585" y="468" text-anchor="middle" font-size="10" fill="#64748b">Python / Go</text>
  <text x="585" y="484" text-anchor="middle" font-size="10" fill="#64748b">组件库 + 生成辅助</text>

  <!-- Arrow: LLM to JSON -->
  <line x1="310" y1="462" x2="333" y2="462" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <!-- Arrow: JSON to SDK -->
  <line x1="485" y1="462" x2="508" y2="462" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowV)"/>

  <!-- Arrow: JSON to Transport (up) -->
  <line x1="410" y1="428" x2="410" y2="358" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- ===== Security Badge ===== -->
  <g filter="url(#shadow)">
    <rect x="620" y="75" width="170" height="80" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <rect x="620" y="75" width="170" height="26" rx="10" fill="#fee2e2"/>
  <rect x="620" y="91" width="170" height="10" fill="#fee2e2"/>
  <text x="705" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">安全保障</text>
  <text x="705" y="118" text-anchor="middle" font-size="9" fill="#64748b">不执行任意代码</text>
  <text x="705" y="132" text-anchor="middle" font-size="9" fill="#64748b">不注入 script 标签</text>
  <text x="705" y="146" text-anchor="middle" font-size="9" fill="#64748b">客户端本地渲染</text>

  <!-- ===== Cross-Platform Badge ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="75" width="170" height="80" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="30" y="75" width="170" height="26" rx="10" fill="#fef3c7"/>
  <rect x="30" y="91" width="170" height="10" fill="#fef3c7"/>
  <text x="115" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">跨平台一致</text>
  <text x="115" y="118" text-anchor="middle" font-size="9" fill="#64748b">同一份 JSON</text>
  <text x="115" y="132" text-anchor="middle" font-size="9" fill="#64748b">Web / Mobile / Desktop</text>
  <text x="115" y="146" text-anchor="middle" font-size="9" fill="#64748b">原生渲染体验</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="120" y="525" width="580" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="542" text-anchor="middle" font-size="11" fill="#15803d">Agent 只说"要什么界面"，客户端决定"怎么画" — UI 生成与执行彻底解耦</text>
</svg>